 وقوع الأزمة لمنع حدوثها أو تقليل احتمالية وقوعها وحجم أضرارها، وأهم إجراءاتها تحديد المخاطر والتهديدات، وإعداد خرائط المخاطر، وتقييم احتمالية كل خطر وتأثيره، ووضع التشريعات الوقائية، وتعزيز المنشآت الحيوية، وإنشاء أنظمة الإنذار المبكر. (ب) الاستجابة تبدأ عند وقوع الأزمة أو ظهور مؤشرات مؤكدة على قرب وقوعها، وهدفها إنقاذ الأرواح واحتواء الأزمة. أما التعافي وإعادة الإعمار فيبدأ بعد السيطرة على الخطر المباشر، وهدفه إعادة الحياة الطبيعية وإعادة البناء بصورة أفضل.","u":5},{"q":"اختر أحد السؤالين التاليين وأجب عنه: (أ) اذكر إجراءات مرحلة الاستعداد والجاهزية. (ب) اذكر المخرجات الرئيسية لمرحلة التعافي وإعادة الإعمار.","model":"(أ) تشمل إجراءات الاستعداد إعداد خطط الطوارئ والاستجابة الوطنية، وتحديد أدوار كل جهة ومسؤولياتها، وإنشاء غرف ومراكز إدارة الأزمات، وتدريب فرق الطوارئ والإنقاذ والإسعاف، وتنفيذ التدريبات والمحاكاة، وتجهيز الموارد والمخزون الاستراتيجي، وتحديد طرق الإخلاء ومراكز الإيواء. (ب) المخرجات الرئيسية للتعافي هي استعادة الحياة الطبيعية، وإعادة بناء ما تضرر، وتحسين الخطط، وتعزيز قدرة الدولة على الصمود.","u":5}]},{"exam":4,"title":"امتحان 4: أدوار الأجهزة المعنية بإدارة الأزمة","tf":[{"s":"الأزمة الوطنية لا تتعامل معها مؤسسة واحدة فقط، بل تتطلب مشاركة جميع المؤسسات.","a":true,"fix":"","quote":"الأزمة الوطنية لا تتعامل معها مؤسسة واحدة فقط، بل تتطلب مشاركة جميع المؤسسات:","u":6},{"s":"يمكن للجهاز الأمني أن يعمل بمعزل عن باقي الأجهزة دون أن تتأثر الاستجابة الأمنية.","a":false,"fix":"لا تنجح الاستجابة الأمنية إذا عمل كل جهاز بمعزل عن باقي الأجهزة.","quote":"القاعدة الأساسية: لا تنجح الاستجابة الأمنية إذا عمل كل جهاز بمعزل عن باقي الأجهزة.","u":6},{"s":"تتولى وزارة الصحة إدارة الاستجابة الصحية.","a":true,"fix":"","quote":"تتولى وزارة الصحة إدارة الاستجابة الصحية.","u":6},{"s":"تتولى وزارة الصحة تقديم الدعم الاجتماعي للمتضررين، بينما تتولى وزارة التضامن إدارة الاستجابة الصحية.","a":false,"fix":"تتولى وزارة الصحة إدارة الاستجابة الصحية، بينما تتولى وزارة التضامن تقديم الدعم الاجتماعي للمتضررين.","quote":"تتولى وزارة التضامن تقديم الدعم الاجتماعي للمتضررين.","u":6},{"s":"تمثل أجهزة الحماية المدنية غالباً خط الاستجابة الأولى في العديد من الأزمات المحلية والكوارث.","a":true,"fix":"","quote":"وهذه الأجهزة تمثل غالباً خط الاستجابة الأولى في العديد من الأزمات المحلية والكوارث.","u":6},{"s":"تقدم القوات المسلحة الدعم في كل الأزمات بصورة متساوية، ويكون دورها ثابتاً دون النظر إلى طبيعة الأزمة.","a":false,"fix":"تقدم القوات المسلحة الدعم عند الأزمات التي تتجاوز قدرات الجهات المدنية، ويختلف دورها وفق طبيعة الأزمة والقوانين والاختصاصات الوطنية.","quote":"تقدم القوات المسلحة الدعم عند الأزمات التي تتجاوز قدرات الجهات المدنية، لما تمتلكه من إمكانات بشرية ولوجستية وهندسية وطنية كبيرة، ويختلف الدور العسكري وفق طبيعة الأزمة والقوانين والاختصاصات الوطنية.","u":6},{"s":"المستوى المحلي يرى الأزمة على الأرض، بينما المستوى المركزي يمتلك قدرة أكبر على حشد الموارد الوطنية.","a":true,"fix":"","quote":"المستوى المحلي يرى الأزمة على الأرض، بينما المستوى المركزي يمتلك قدرة أكبر على حشد الموارد الوطنية.","u":6},{"s":"تعمل المؤسسات الاقتصادية على الحد من الآثار الاقتصادية للأزمة، ولا يعنيها استقرار الأسواق.","a":false,"fix":"تعمل المؤسسات الاقتصادية والمالية على الحد من الآثار الاقتصادية والمالية للأزمة، والحفاظ على استقرار الأسواق والأنشطة الحيوية.","quote":"تعمل المؤسسات الاقتصادية والمالية على الحد من الآثار الاقتصادية والمالية للأزمة، والحفاظ على استقرار الأسواق والأنشطة الحيوية.","u":6},{"s":"تضمن مؤسسات النقل استمرار حركة الأفراد والإمدادات والمساعدات مع الحفاظ على سلامة الطرق والموانئ والمطارات.","a":true,"fix":"","quote":"تضمن مؤسسات النقل استمرار حركة الأفراد والإمدادات والمساعدات، مع الحفاظ على سلامة الطرق والموانئ والمطارات ووسائل النقل.","u":6},{"s":"يجب أن يعمل المجتمع المدني بمعزل عن الجهات الرسمية لتحقيق سرعة أكبر في توزيع المساعدات.","a":false,"fix":"يجب أن تعمل جهود المجتمع المدني تحت إشراف وتنسيق الجهات الرسمية لتجنب التكرار أو سوء توزيع المساعدات.","quote":"ويجب أن تعمل جهوده تحت إشراف وتنسيق الجهات الرسمية لتجنب التكرار أو سوء توزيع المساعدات.","u":6}],"mcq":[{"q":"أي جهة تتولى إدارة الاستجابة الصحية وفق النص؟","o":["وزارة الصحة","وزارة التضامن","وزارة النقل","وزارة البيئة"],"c":0,"e":"النص يحدد أن وزارة الصحة تتولى إدارة الاستجابة الصحية.","quote":"تتولى وزارة الصحة إدارة الاستجابة الصحية.","u":6},{"q":"من يتولى تأمين وسائل النقل والطرق أثناء الأزمة؟","o":["وزارة التموين","وزارة النقل","وزارة التربية والتعليم","وزارة البيئة"],"c":1,"e":"تتولى وزارة النقل تأمين وسائل النقل والطرق وفق النص.","quote":"تتولى وزارة النقل تأمين وسائل النقل والطرق.","u":6},{"q":"أي جهة تمثل غالباً خط الاستجابة الأولى في العديد من الأزمات المحلية والكوارث؟","o":["المؤسسات الاقتصادية","وزارة التموين","أجهزة الحماية المدنية","القطاع الخاص"],"c":2,"e":"تمثل أجهزة الحماية المدنية غالباً خط الاستجابة الأولى، خاصة في الساعات الأولى من الأزمة.","quote":"وهذه الأجهزة تمثل غالباً خط الاستجابة الأولى في العديد من الأزمات المحلية والكوارث.","u":6},{"q":"ما الدور الذي تقوم به القوات المسلحة عند الأزمات وفق النص؟","o":["تتولى إدارة الأزمة المدنية بالكامل بمفردها","تحل محل وزارة الصحة في الاستجابة الصحية","تقتصر على حماية الحدود دون غيرها","تقدم الدعم عند الأزمات التي تتجاوز قدرات الجهات المدنية"],"c":3,"e":"تقدم القوات المسلحة الدعم عند الأزمات التي تتجاوز قدرات الجهات المدنية، ويختلف دورها وفق طبيعة الأزمة.","quote":"تقدم القوات المسلحة الدعم عند الأزمات التي تتجاوز قدرات الجهات المدنية، لما تمتلكه من إمكانات بشرية ولوجستية وهندسية وطنية كبيرة، ويختلف الدور العسكري وفق طبيعة الأزمة والقوانين والاختصاصات الوطنية.","u":6},{"q":"ما المهمة التي تتولاها المحافظات والإدارات المحلية وفق النص؟","o":["إدارة الأزمة على المستوى الميداني والمحلي","تحديد السياسات الوطنية للاستجابة","إصدار القرارات السيادية الاستثنائية","إدارة العلاقات الخارجية وطلب المساعدات الدولية"],"c":0,"e":"تتولى المحافظات والإدارات المحلية إدارة الأزمة على المستوى الميداني والمحلي، لقربها من المواطنين والمناطق المتضررة.","quote":"تتولى المحافظات والإدارات المحلية إدارة الأزمة على المستوى الميداني والمحلي، لأنها الأكثر قرباً من المواطنين والمناطق المتضررة.","u":6},{"q":"وفق دور مؤسسات الطاقة، أي الجهات تُعطى الأولوية في الإمداد؟","o":["المصانع الكبرى","المستشفيات ومراكز الاتصالات ومحطات المياه","المحلات التجارية","المنتزهات العامة"],"c":1,"e":"تعطي مؤسسات الطاقة الأولوية للمستشفيات ومراكز الاتصالات ومحطات المياه.","quote":"إعطاء الأولوية للمستشفيات ومراكز الاتصالات ومحطات المياه.","u":6},{"q":"ما الدور الذي تقوم به مؤسسات المياه والصرف الصحي وفق النص؟","o":["تنظيم حركة المرور وتأمين مسارات الإخلاء","إدارة التعويضات المالية للمتضررين","ضمان توفر مياه آمنة ومنع المخاطر الصحية أو البيئية","تشغيل محطات الكهرباء البديلة"],"c":2,"e":"تعمل مؤسسات المياه والصرف الصحي على ضمان توفر مياه آمنة ومنع المخاطر الصحية أو البيئية الإضافية.","quote":"تعمل مؤسسات المياه والصرف الصحي على ضمان توفر مياه آمنة وصالحة للاستخدام، ومنع حدوث مخاطر صحية أو بيئية إضافية.","u":6},{"q":"وفق النص، ما الذي يجب على كل وزارة أن تضمنه أثناء الأزمة؟","o":["إيقاف خدماتها حتى انتهاء الأزمة","الاقتصار على الإعلام فقط","تحويل كل مسؤولياتها إلى القطاع الخاص","ضمان استمرارية خدماتها وتقديم بيانات دقيقة عن الموقف"],"c":3,"e":"يجب على كل وزارة ضمان استمرارية خدماتها وتقديم بيانات دقيقة عن الموقف وتوفير الموارد المتخصصة المطلوبة.","quote":"ويجب على كل وزارة ضمان استمرارية خدماتها، وتقديم بيانات دقيقة عن الموقف، وتوفير الموارد المتخصصة المطلوبة.","u":6},{"q":"ما الأدوار التي يشملها القطاع الصحي بالإضافة إلى العلاج وفق النص؟","o":["الوقاية والرصد والاستجابة","التمويل والتسويق والإعلان","النقل والتخزين والتوزيع","الحماية البيئية فقط"],"c":0,"e":"لا يقتصر دور القطاع الصحي على العلاج، بل يشمل أيضاً الوقاية والرصد والاستجابة.","quote":"ولا يقتصر دور القطاع الصحي على العلاج، بل يشمل أيضاً (الوقاية - الرصد - الاستجابة).","u":6},{"q":"وفق النص، كيف ينبغي أن تتم مشاركة القطاع الخاص في الاستجابة؟","o":["الإنفاق دون تنسيق مع الدولة","المشاركة ضمن تنسيق واضح وقواعد محددة وتوزيع مسؤوليات","الاستقلال الكامل عن الجهات الرسمية","الاقتصار على الإعلان عن الدعم"],"c":1,"e":"يجب أن تتم مشاركة القطاع الخاص ضمن تنسيق واضح وقواعد محددة وتوزيع مسؤوليات.","quote":"لكن المشاركة يجب أن تتم ضمن (تنسيق واضح - قواعد محددة - توزيع مسؤوليات).","u":6}],"def":[{"q":"عرّف المقصود بتحديد الأدوار العامة للأجهزة في إدارة الأزمة، ثم اذكر مثالاً يوضح اختلاف الجهة القائدة حسب نوع الأزمة.","model":"يقصد بتحديد الأدوار توزيع المسؤوليات والصلاحيات بوضوح بين جميع الجهات المشاركة، مع تحديد الجهة القائدة والجهات المنفذة والداعمة وآليات التنسيق وتبادل المعلومات، بما يمنع تضارب القرارات ويضمن سرعة الاستجابة. ومثال ذلك: في الكارثة الطبيعية تزداد أهمية الحماية المدنية والصحة والإدارة المحلية والنقل، بينما في الأزمة الاقتصادية تتقدم المؤسسات المالية والاقتصادية، أي أن الجهة القائدة تتغير بتغير طبيعة الأزمة.","u":6}],"research":[{"q":"ناقش لماذا لا تستطيع مؤسسة واحدة إدارة الأزمة الوطنية، وكيف يسهم تكامل أدوار الأجهزة في تحقيق استجابة فعالة، مستشهداً بأمثلة من النص.","model":"الأزمة الوطنية تتطلب مشاركة جميع المؤسسات، من القيادة السياسية والأجهزة الأمنية والقوات المسلحة والحماية المدنية والوزارات والمؤسسات الاقتصادية والنقل والطاقة والمياه والاتصالات والإعلام والمجتمع المدني والقطاع الخاص، لأن كل جهة تمتلك قدرة متخصصة. ويتحقق التكامل حين يعرف كل جهاز مسؤوليته وصلاحياته ومن يتلقى التعليمات، فتعمل وزارة الصحة على الاستجابة الصحية وتؤمن وزارة النقل الطرق، وتوفر مؤسسات الطاقة الكهرباء للمستشفيات، فتتحقق استجابة سريعة ومنظمة لا تتعارض فيها القرارات أو تتكرر الجهود.","u":6}],"choose":[{"q":"اختر أحد السؤالين التاليين وأجب عنه: (أ) اذكر مسؤوليات أجهزة الحماية المدنية والطوارئ. (ب) اشرح دور المحليات والمحافظات وسبب أهميتها.","model":"(أ) تشمل مسؤوليات أجهزة الحماية المدنية والطوارئ الإطفاء ومكافحة الحرائق، وتنفيذ عمليات البحث والإنقاذ، وإخلاء السكان من المناطق الخطرة، والتعامل مع الحوادث وإنقاذ المحاصرين والمصابين، والتعامل مع تسرب المواد الخطرة والكيميائية، وتقييم سلامة المباني المتضررة، وتأمين مواقع الحوادث، وتقديم الإسعافات الأولية. (ب) تتولى المحافظات والإدارات المحلية إدارة الأزمة على المستوى الميداني والمحلي، وتفعيل غرف العمليات المحلية، وتقييم الموقف، وتنفيذ الإخلاء والإيواء، وحصر الأضرار، وتوزيع المساعدات، ورفع تقارير دورية إلى الجهات المركزية، وتكمن أهميتها في قربها من المواطنين والمناطق المتضررة.","u":6},{"q":"اختر أحد السؤالين التاليين وأجب عنه: (أ) اذكر مسؤوليات مؤسسات الطاقة. (ب) اذكر مسؤوليات القطاع الصحي.","model":"(أ) تشمل مسؤوليات مؤسسات الطاقة حماية محطات الكهرباء والوقود والغاز، وتقييم الأعطال والأضرار، وإصلاح الشبكات وإعادة تشغيلها بسرعة، وتوفير مصادر طاقة بديلة ومولدات احتياطية، وإعطاء الأولوية للمستشفيات ومراكز الاتصالات ومحطات المياه، وتأمين مخزون الوقود اللازم للطوارئ، وتقنين الاستهلاك مؤقتاً عند الحاجة. (ب) تشمل مسؤوليات القطاع الصحي استقبال المصابين وتصنيفهم وفق درجة الخطورة، وتقديم الإسعاف والعلاج والرعاية الطارئة، ورفع جاهزية المستشفيات، وتوفير الأدوية والمستلزمات الطبية، ونشر الفرق الطبية، ومراقبة الأمراض والأوبئة، وتقديم الدعم النفسي، وإدارة بيانات الإصابات والوفيات بدقة.","u":6}]},{"exam":5,"title":"امتحان 5: القيادة والتنسيق والتعاون الدولي في إدارة الأزمات","tf":[{"s":"لا يشترط مشاركة جميع الجهات بالدرجة نفسها في كل أزمة، بل يتم تفعيلها وفقاً لنوع الأزمة ونطاقها ومستوى خطورتها.","a":true,"fix":"","quote":"لا يشترط مشاركة جميع الجهات بالدرجة نفسها في كل أزمة، بل يتم تفعيلها وفقاً لنوع الأزمة ونطاقها ومستوى خطورتها.","u":7},{"s":"التنسيق الأفقي هو التنسيق بين القيادة الوطنية والمحافظات وفرق الميدان.","a":false,"fix":"التنسيق الأفقي هو التنسيق بين الجهات التي تعمل على المستوى الإداري نفسه، أما التنسيق بين القيادة الوطنية والمحافظات وفرق الميدان فهو التنسيق الرأسي.","quote":"هو التنسيق بين الجهات التي تعمل على المستوى الإداري نفسه، مثل التنسيق بين الصحة والشرطة والحماية المدنية والنقل والكهرباء داخل المحافظة الواحدة.","u":7},{"s":"لكل مهمة جهة قائدة واحدة واضحة، ويمكن أن تشارك جهات متعددة في التنفيذ والدعم.","a":true,"fix":"","quote":"لكل مهمة جهة قائدة واحدة واضحة، ويمكن أن تشارك جهات متعددة في التنفيذ والدعم، ولكن دون تعدد في المسؤولية النهائية أو تضارب مصادر القرار.","u":7},{"s":"في الأوبئة والأزمات الصحية تكون الحماية المدنية الجهة الفنية القائدة.","a":false,"fix":"في الأوبئة والأزمات الصحية تكون وزارة الصحة الجهة الفنية القائدة، بينما تقود الحماية المدنية العمليات الميدانية في الحرائق والانهيارات.","quote":"في الأوبئة والأزمات الصحية تكون وزارة الصحة الجهة الفنية القائدة.","u":7},{"s":"الجهة الاستشارية في مصفوفة RACI هي التي تقدم الرأي الفني والمعلومات قبل اتخاذ القرار.","a":true,"fix":"","quote":"الجهة الاستشارية، وتقدم الرأي الفني والمعلومات قبل اتخاذ القرار.","u":7},{"s":"في مصفوفة RACI الجهة Responsible هي الجهة المسؤولة نهائياً التي تعتمد القرار.","a":false,"fix":"في مصفوفة RACI الجهة Accountable هي المسؤولة نهائياً وتعتمد القرار، أما Responsible فهي الجهة المنفذة للمهمة فعلياً.","quote":"الجهة المسؤولة نهائياً، وتعتمد القرار وتتحمل المسؤولية النهائية.","u":7},{"s":"من مهام غرفة العمليات تحويل القرارات إلى مهام واضحة.","a":true,"fix":"","quote":"تحويل القرارات إلى مهام واضحة.","u":7},{"s":"تعتمد غرفة العمليات على الشائعات لاتخاذ القرار بسرعة، ولا تتحقق من المعلومات قبل اعتمادها.","a":false,"fix":"تتحقق غرفة العمليات من المعلومات، ويمنع ذلك اتخاذ قرارات بناء على شائعات أو بيانات غير مكتملة.","quote":"ويمنع ذلك اتخاذ قرارات بناء على شائعات أو بيانات غير مكتملة.","u":7},{"s":"في التدفق الرأسي الصاعد تنتقل المعلومات من فرق الاستجابة الميدانية إلى الإدارات المحلية، ثم إلى غرف العمليات والقيادة العليا.","a":true,"fix":"","quote":"تنتقل المعلومات من فرق الاستجابة الميدانية إلى الإدارات المحلية، ثم إلى غرف العمليات والقيادة العليا.","u":7},{"s":"التعاون الثنائي هو الذي تشارك فيه عدد كبير من الدول في مواجهة أزمة واسعة النطاق.","a":false,"fix":"التعاون متعدد الأطراف هو الذي تشارك فيه عدد كبير من الدول، أما التعاون الثنائي فهو تعاون مباشر بين دولتين وفق اتفاق محدد بينهما.","quote":"هو تعاون مباشر بين دولتين لمواجهة أزمة أو خطر مشترك، ويتم وفق اتفاق أو تنسيق محدد بينهما.","u":7}],"mcq":[{"q":"ما الذي يحدد تفعيل الجهات المشاركة في إدارة الأزمة وفق النص؟","o":["مشاركة جميع الجهات بالدرجة نفسها في كل الأزمات","نوع الأزمة ونطاقها ومستوى خطورتها","الميزانية المتاحة للوزارات فقط","قرار القطاع الخاص وحده"],"c":1,"e":"لا يشترط مشاركة جميع الجهات بالدرجة نفسها، بل يتم تفعيلها وفقاً لنوع الأزمة ونطاقها ومستوى خطورتها.","quote":"لا يشترط مشاركة جميع الجهات بالدرجة نفسها في كل أزمة، بل يتم تفعيلها وفقاً لنوع الأزمة ونطاقها ومستوى خطورتها.","u":7},{"q":"أي عبارة تعرّف التنسيق الرأسي وفق النص؟","o":["التنسيق بين الصحة والشرطة داخل المحافظة","التنسيق بين دولتين لمواجهة أزمة مشتركة","التنسيق بين المستويات الإدارية المختلفة من القيادة الوطنية إلى فرق الميدان","التنسيق بين المؤسسات الاقتصادية فقط"],"c":2,"e":"التنسيق الرأسي هو التنسيق بين المستويات الإدارية المختلفة، بدءاً من القيادة الوطنية وصولاً إلى فرق الاستجابة الميدانية.","quote":"هو التنسيق الذي يتم بين المستويات الإدارية المختلفة، بدءاً من القيادة الوطنية، مروراً بالوزارات والمحافظات، وصولاً إلى فرق الاستجابة الميدانية.","u":7},{"q":"وفق النص، أي جهة تكون الجهة الفنية القائدة في الأوبئة والأزمات الصحية؟","o":["الحماية المدنية","وزارة التموين","القيادة الوطنية دائماً","وزارة الصحة"],"c":3,"e":"في الأوبئة والأزمات الصحية تكون وزارة الصحة الجهة الفنية القائدة.","quote":"في الأوبئة والأزمات الصحية تكون وزارة الصحة الجهة الفنية القائدة.","u":7},{"q":"في مصفوفة RACI، من هي الجهة التي تعتمد القرار وتتحمل المسؤولية النهائية؟","o":["Accountable","Responsible","Consulted","Informed"],"c":0,"e":"Accountable هي الجهة المسؤولة نهائياً، وتعتمد القرار وتتحمل المسؤولية النهائية.","quote":"الجهة المسؤولة نهائياً، وتعتمد القرار وتتحمل المسؤولية النهائية.","u":7},{"q":"ما الدور الذي تؤديه غرفة العمليات في الاتصال والإعلام وفق النص؟","o":["اتخاذ القرار الإعلامي بمفردها","توحيد الرسائل بين الجهات والمتحدثين الرسميين","حجب كل المعلومات عن الجمهور","الرد على الشائعات دون تنسيق"],"c":1,"e":"تضمن غرفة العمليات توحيد الرسائل بين الجهات والمتحدثين الرسميين.","quote":"توحيد الرسائل بين الجهات والمتحدثين الرسميين.","u":7},{"q":"وفق النص، ما فائدة السجل الذي تحفظه غرفة العمليات بعد الأزمة؟","o":["لإلغاء القرارات السابقة","لتقليل عدد الجهات المشاركة","لتقييم الأداء وتحديث الخطط المستقبلية","لتحويل الميزانية إلى القطاع الخاص"],"c":2,"e":"يُستخدم السجل بعد الأزمة لتقييم الأداء وتحديد نقاط القوة والقصور وتحديث الخطط المستقبلية.","quote":"ويُستخدم هذا السجل بعد الأزمة لتقييم الأداء، وتحديد نقاط القوة والقصور، وتحديث الخطط المستقبلية، وبذلك تمثل غرفة العمليات حلقة الوصل بين القيادة ومتخذي القرار والجهات التنفيذية وفرق الاستجابة الميدانية.","u":7},{"q":"ما المقصود بالإسناد اللوجستي وفق النص؟","o":["الإخلاء الجوي للمصابين فقط","إدارة الاستثمارات المالية للدولة","صياغة التشريعات الوقائية","توفير الاحتياجات والموارد الضرورية لتمكين فرق الاستجابة من أداء مهامها"],"c":3,"e":"الإسناد اللوجستي يعني توفير الاحتياجات والموارد الضرورية لتمكين فرق الاستجابة من أداء مهامها.","quote":"يعني توفير الاحتياجات والموارد الضرورية لتمكين فرق الاستجابة من أداء مهامها.","u":7},{"q":"ما المقصود بالتعاون متعدد الأطراف وفق النص؟","o":["مشاركة عدد كبير من الدول والمؤسسات في مواجهة أزمة مشتركة واسعة النطاق","تعاون مباشر بين دولتين فقط","تعاون داخل محافظة واحدة","إرسال المساعدات دون تنسيق"],"c":0,"e":"التعاون متعدد الأطراف هو مشاركة عدد كبير من الدول والمؤسسات في مواجهة أزمة مشتركة واسعة النطاق.","quote":"هو مشاركة عدد كبير من الدول والمؤسسات في مواجهة أزمة مشتركة، من خلال تنسيق الأدوار وتبادل الموارد والمعلومات، ويُستخدم هذا المستوى عندما تكون الأزمة واسعة النطاق، ولا يمكن التعامل معها من خلال دولة واحدة أو تعاون ثنائي، ويهدف فقط إلى توحيد الجهود وتوزيع المسؤوليات والاستفادة من إمكانات جميع الأطراف المشاركة.","u":7},{"q":"وفق النص، متى تلجأ الدولة إلى طلب المساعدة الدولية؟","o":["عند وجود خلاف سياسي داخلي","عندما تكون الأزمة واسعة النطاق أو تتجاوز الاحتياجات قدراتها الوطنية","عندما تكون الأزمة محلية بسيطة","عند انتهاء الأزمة وبدء التعافي"],"c":1,"e":"تلجأ الدولة إلى طلب المساعدة الدولية عندما تكون الأزمة واسعة النطاق أو تتجاوز الاحتياجات قدراتها الوطنية ومواردها.","quote":"تلجأ الدولة إلى طلب المساعدة الدولية عندما تكون الأزمة واسعة النطاق، أو عندما تتجاوز الاحتياجات قدراتها الوطنية ومواردها، ويتم ذلك وفقاً للقوانين الوطنية والاتفاقيات الدولية، مع احترام سيادة الدولة المتضررة.","u":7},{"q":"ما القاعدة الأساسية التي تحكم المساعدة الدولية وفق النص؟","o":["تحل محل جهود الدولة المتضررة","تُقدَّم دون موافقة الدولة المتضررة","تدعم جهود الدولة المتضررة ولا تحل محلها، وتُقدَّم بموافقتها وتحت تنسيقها","تُدار من جهة دولية منفردة"],"c":2,"e":"المساعدة الدولية تدعم جهود الدولة المتضررة ولا تحل محلها، وتُقدَّم بموافقتها وتحت تنسيقها.","quote":"المساعدة الدولية تدعم جهود الدولة المتضررة ولا تحل محلها، وتُقدَّم بموافقتها وتحت تنسيقها.","u":7}],"def":[{"q":"عرّف التنسيق الرأسي والتنسيق الأفقي أثناء الأزمة، ثم اذكر مثالاً يوضح كيف يعمل كل منهما.","model":"التنسيق الرأسي هو التنسيق بين المستويات الإدارية المختلفة من القيادة الوطنية إلى الوزارات والمحافظات وفرق الميدان، ويعمل في اتجاهين: نقل القرارات للأسفل، ورفع بيانات الموقف للأعلى. مثاله أن ترسل القيادة الوطنية توجيهاً بإخلاء منطقة معرضة للسيول فتنفذه المحافظة عبر الشرطة والحماية المدنية، ثم ترفع تقريراً بأعداد من تم إجلاؤهم. أما التنسيق الأفقي فهو بين الجهات على المستوى الإداري نفسه، كالتنسيق بين الصحة والشرطة والحماية المدنية والنقل والكهرباء داخل المحافظة، ومثاله نقل المرضى من مستشفى مُخلى بسبب السيول.","u":7}],"research":[{"q":"حلل كيف تسهم غرفة العمليات ومصفوفة توزيع المسؤوليات والتعاون الدولي معاً في تحقيق وحدة القرار وكفاءة الاستجابة، مع توضيح حدود كل منها.","model":"تجمع غرفة العمليات المعلومات وتتحقق منها وتعد صورة تشغيلية موحدة، وترفع التوصيات إلى القيادة دون أن تتجاوز الصلاحيات القانونية للجهة المختصة، فتسهم في وحدة القرار. وتحدد مصفوفة RACI جهة قائدة واحدة لكل مهمة مع مشاركة الجهات الأخرى دون تعدد في المسؤولية النهائية، فتمنع تضارب القرارات. أما التعاون الدولي فيدعم جهود الدولة ولا يحل محلها، ويُقدَّم بموافقتها وتحت تنسيقها، ويكون عند تجاوز الأزمة للقدرات الوطنية. فالحدود أن غرفة العمليات تدعم القرار ولا تحل محل الوزارات، والمصفوفة لا تلغي دور الجهات المنفذة، والتعاون الدولي لا يحل محل الدولة المتضررة.","u":7}],"choose":[{"q":"اختر أحد السؤالين التاليين وأجب عنه: (أ) اذكر مستويات التعاون بين الدول في مواجهة الأزمات. (ب) اشرح أهمية التدفق الأفقي للمعلومات مع مثال.","model":"(أ) مستويات التعاون أربعة: التعاون الثنائي بين دولتين وفق اتفاق محدد، والتعاون الإقليمي بين دول المنطقة الجغرافية الواحدة في الأمن والصحة والكوارث والبيئة والطاقة، والتعاون الدولي عبر المنظمات الدولية كالأمم المتحدة ومنظمة الصحة العالمية والبنك الدولي، والتعاون متعدد الأطراف لمشاركة عدد كبير من الدول في الأزمات واسعة النطاق. (ب) يساعد التدفق الأفقي على تحقيق التكامل بين الجهات وتبادل المعلومات والموارد بسرعة ومنع تعارض الإجراءات، ومثاله أن تبلغ الحماية المدنية وزارة الصحة بعدد المصابين المتوقع لتستعد المستشفيات لاستقبالهم.","u":7},{"q":"اختر أحد السؤالين التاليين وأجب عنه: (أ) اذكر الخطوات الواردة لطلب المساعدة الدولية. (ب) اذكر المعايير التي يتحدد بها دور كل مؤسسة في الأزمة.","model":"(أ) تتمثل الخطوات في تقييم الموقف والاحتياجات، ثم اتخاذ القرار الرسمي من الجهة الوطنية المختصة، ثم إرسال الطلب عبر القنوات الرسمية كالقنوات الدبلوماسية والمنظمات الإقليمية والأمم المتحدة والمؤسسات الإنسانية الدولية. (ب) يتحدد دور كل مؤسسة وفق الاختصاص القانوني، وطبيعة الأزمة، والمستوى الإداري، والقدرات المتاحة، ومرحلة الأزمة، ونطاق المسؤولية هل تقود المهمة أم تنفذها أم تقدم الدعم والمعلومات.","u":7}]}],"explain":[{"unit":1,"title":"المفهوم والخصائص","html":"<h3>مفهوم المنظور المؤسسي<\/h3><p>إدارة الكوارث ليست رد فعل آني أو فوضوي يستند إلى الاجتهادات الشخصية أثناء وقوع الحدث، بل هي منظومة مؤسسية مستدامة تقوم على الآتي:<\/p><ul><li><b>البناء التنظيمي:<\/b> وجود هياكل وحدود صلاحيات معلنة ومسبقة.<\/li><li><b>الاستمرارية:<\/b> العمل الدائم قبل وأثناء وبعد الأزمة (وليس فقط عند وقوع الكارثة).<\/li><li><b>المأسسة والتكامل:<\/b> صياغة لوائح، وخطط طوارئ، وقواعد بيانات محددة تربط جميع مؤسسات الدولة ببعضها.<\/li><\/ul> <h3>مراحل إدارة الكوارث من منظور مؤسسي<\/h3><p>تُقسّم المنظومة المؤسسية التعامل مع الكارثة إلى دورة حياة خماسية متكاملة:<\/p><ul><li><b>الوقاية والتخفيف:<\/b> الإجراءات الاستباقية للحد من الأسباب والمخاطر (مثل التشريعات، وأكواد البناء، والسدود).<\/li><li><b>الاستعداد والجاهزية:<\/b> إعداد خطط الطوارئ، وإنشاء أنظمة الإنذار المبكر، وتدريب الكوادر تنفيذياً.<\/li><li><b>الاستجابة:<\/b> تفعيل غرف العمليات والتدخل الميداني السريع فور وقوع الكارثة لإنقاذ الأرواح وتأمين الممتلكات.<\/li><li><b>التعافي والتعمير:<\/b> إغلاق الملف الميداني، وإعادة بناء ما تم تدميره مع الاستفادة من الدروس المستفادة.<\/li><\/ul><div class=\"note\">ملاحظة: النص الأصلي يصف الدورة بأنها “خماسية”، بينما تُعرض أربع مراحل في القائمة نفسها.<\/div> <h3>خصائص المؤسسية الناجحة في إدارة الكوارث<\/h3><ul><li><b>المركزية القيادية والتداول الميداني اللامركزي:<\/b> وحدة القرار السياسي والقيادي مع إعطاء مرونة تنفيذية للفرق الميدانية.<\/li><li><b>الشفافية وتدفق المعلومات:<\/b> توحيد الخطاب الإعلامي ومنع الشائعات.<\/li><li><b>الاستجابة القائمة على الأدلة البيانية:<\/b> توظيف التقنيات والخرائط الرقمية لتوجيه فرق الإنقاذ وإدارة الأزمة.<\/li><\/ul>"},{"unit":2,"title":"الأزمة والكارثة والمنظور المؤسسي","html":"<h3>متى تتحول الأزمة المحلية إلى كارثة قومية تستوجب تعديل الهيكل الإداري للمواجهة؟<\/h3><h4>أ - الأزمة<\/h4><ul><li><b>المعنى المفاهيمي:<\/b> الأزمة هي خلل يتطلب اتخاذ قرار سريع في ظل ظروف من الشك، وعدم يقين المعلومات، وضغط الوقت الشديد.<\/li><li><b>الخصائص:<\/b> تنشأ غالباً عن مشكلات إدارية، سياسية، أو اجتماعية، وتتطور عبر التدرج.<\/li><li><b>القدرة على السيطرة:<\/b> يمكن للمؤسسة أو الدولة السيطرة عليها واستيعابها باستخدام الموارد والإمكانيات المحلية المتاحة دون الحاجة لاستدعاء عون خارجي استثنائي.<\/li><\/ul><h4>ب - الكارثة<\/h4><ul><li><b>المعنى المفاهيمي:<\/b> حدث صدمي، مفاجئ أو متدرج، يحدث دماراً هائلاً في الأرواح، أو الممتلكات، أو البيئة.<\/li><li><b>الشرط الحاكم:<\/b> شلل قدرة النظام المحلي على الاستجابة. الحد الفاصل بين الأزمة والكارثة هو أن الكارثة تتجاوز كلياً القدرات والموارد الاستجابية للدولة أو الإقليم المحلي، مما يجبر النظام على إعلان حالة الطوارئ الوطنية وطلب أو قبول الدعم الإقليمي والدولي.<\/li><\/ul><h4>ج - التهديد والتأثير المتبادل<\/h4><ul><li><b>التهديد<\/b> هو المسبب الخارجي (زلزال - سيول - فيروس)، ولكنه لا يتحول إلى “كارثة” بمفرده إلا إذا اصطدم بشرط “الهشاشة”.<\/li><li><b>معادلة الخطر المباشرة:<\/b><\/li><\/ul><div class=\"note\"><p>الخطر (Risk) = [التهديد (Hazard) × الهشاشة (Vulnerability)] ÷ قدرة المواجهة (Capacity)<\/p><\/div><p>كلما زادت هشاشة البنية التحتية أو ضعف الإعداد المؤسسي (المقام)، ارتفعت احتمالية تحول التهديد الطبيعي أو البشري إلى “كارثة” مدمرة.<\/p> <h3>التحول الاستراتيجي من العمل الفردي إلى المنظور المؤسسي<\/h3><h4>1 - العقلية الفردية / الرد الفعل<\/h4><p>تاريخياً، كانت إدارة الكوارث تعتمد على ما يُعرف بـ“الاستجابة المنفصلة” أو “الاجتهاد الفردي”:<\/p><ul><li><b>الرد العاطفي والفوضوي:<\/b> التحرك فقط بعد وقوع الحدث، وتعتمد القرارات على التقديرات الشخصية للقيادات الميدانية دون وجود خطط مرجعية مسبقة.<\/li><li><b>تضارب الاختصاصات:<\/b> تداخل عمل الجهات الأمنية مع الخدمية مع الهيئات الأهلية، مما يؤدي إلى هدر الموارد، وتكرار الجهود، وتأخير الاستجابة في “الساعات الذهبية” الأولى للحدث.<\/li><\/ul><h4>2 - المنظور المؤسسي<\/h4><p>المنظور المؤسسي يُعرف إدارة الكوارث على أنها “نظام عام مستمر، دائم، ومستدام بالدولة” وليست لجنة تشكل وقت الطوارئ وتُفض بعد انتهائها.<\/p><p><b>مرتكزات المنظور المؤسسي:<\/b><\/p><ul><li><b>أ - المؤسسة القانونية:<\/b> وجود أطر تشريعية ملزمة تحدد مهام كل جهاز تنفيذي بالدولة مسبقاً قبل وقوع الكارثة.<\/li><li><b>ب - الهيكلة الواضحة:<\/b> تسلسل قيادي محدد وغرف عمليات موحدة إدارة السيطرة.<\/li><li><b>ج - استدامية التخطيط:<\/b> التخطيط والاستعداد يحدث في ظروف الهدوء والتنسيق، وليس تحت ضغط الأزمة.<\/li><\/ul> <h3>المقارنة التفصيلية: الإدارة الفردية والإدارة المؤسسية<\/h3><table><thead><tr><th>وجه المقارنة<\/th><th>الإدارة الفردية / التقليدية<\/th><th>الإدارة المؤسسية الحديثة<\/th><\/tr><\/thead><tbody><tr><td>توقيت التفكير<\/td><td>يبدأ بعد وقوع الكارثة (رد فعل)<\/td><td>يبدأ قبل الكارثة بسنوات (تخطيط واستباق)<\/td><\/tr><tr><td>مرجعية القرار<\/td><td>التقدير الشخصي والانطباعي<\/td><td>أطر خطط الطوارئ وسيناريوهات المحاكاة<\/td><\/tr><tr><td>تبادل المعلومات<\/td><td>جزر منعزلة وتكتم معلوماتي<\/td><td>غرف عمليات مشتركة ورصد لحظي متكامل<\/td><\/tr><tr><td>الموارد واللوجستيات<\/td><td>عشوائية التوزيع والطلب العاجل<\/td><td>مصفوفة موارد وطنية محددة ومحدثة رقمياً<\/td><\/tr><tr><td>التقييم<\/td><td>البحث عن شماعة أخطاء ودفن الملفات<\/td><td>تحليل الدروس المستفادة والتطوير المستمر<\/td><\/tr><\/tbody><\/table> <h3>الركائز والأبعاد الرئيسية للمنظومة المؤسسية<\/h3><p>لتطبيق المنظور المؤسسي في الدولة، يجب أن تتوافر أربعة أبعاد رئيسية تشكل هيكل المنظومة:<\/p><h4>1 - البعد التشريعي والسياسي<\/h4><ul><li>إقرار القوانين التي تمنح هيئات إدارة الكوارث الصلاحيات التنفيذية لإخلاء المناطق، وتوجيه الموارد، وإعلان الطوارئ.<\/li><li>إلزام كافة مؤسسات الدولة القطاعية (صحة، نقل، دفاع، إعلام) بإعداد “خطط استمرارية الأعمال”.<\/li><\/ul><h4>2 - البعد التنظيمي<\/h4><ul><li>تأسيس مركز/مركز وطني موحد لإدارة الأزمات والكوارث يتبع أعلى سلطة تنفيذية في الدولة.<\/li><li>تحديد أدوار واضحة ومسؤوليات غير متداخلة لكل جهاز (من يمارس الإغاثة، من يُدير الإعلام) [غير واضح].<\/li><\/ul><h4>3 - البعد المعلوماتي والتكنولوجي<\/h4><ul><li>إنشاء أنظمة الإنذار المبكر المرتبطة بالاستشعار عن بعد ومراكز الأرصاد.<\/li><li>بناء قاعدة بيانات وطنية شاملة للمخاطر وتدفق الموارد المتوفرة بالدولة لحظة بلحظة.<\/li><\/ul><h4>4 - البعد المالي والمادي<\/h4><ul><li>تخصيص موازنات وطنية ومبالغ طارئة ومستقلة لإدارة الأزمات، لا تخضع للدورة المستندية المعتادة أثناء وقوع الكارثة.<\/li><li>إيجاد صناديق للتعافي وإعادة الإعمار مبنية على التكافل والتأمين ضد الكوارث.<\/li><\/ul>"},{"unit":3,"title":"دورة حياة الكارثة","html":"<h3>دورة حياة الكارثة: مرحلة الوقاية والتخفيف<\/h3><p>تُقسّم المؤسسية الحديثة التعامل مع الكوارث إلى دورة حياة خماسية متكاملة الدفع، ولا تقتصر على لحظة التدخل الميداني فقط كالآتي:<\/p><h4>1 - مرحلة الوقاية والتخفيف<\/h4><ul><li><b>المدخل:<\/b> إجراءات طويلة المدى تهدف لتقليل احتمالية وقوع التهديد أو تقليل آثاره.<\/li><li><b>الأعمال المؤسسية:<\/b><ul><li>تطبيق أطقم وكودات البناء المقاوم للزلازل.<\/li><li>مراجعة وتجهيز مخرات السيول والسدود.<\/li><li>التخطيط العمراني وتجنب السكن في مخرات السيول أو الفوالق النشطة.<\/li><\/ul><\/li><\/ul> <h3>دورة حياة الكارثة: مرحلة الاستعداد والجاهزية<\/h3><h4>2 - مرحلة الاستعداد والجاهزية<\/h4><ul><li><b>المدخل:<\/b> الإجراءات المتخذة لتجهيز الأجهزة والأفراد للتدخل السريع عند التنبؤ بالكارثة.<\/li><li><b>الأعمال المؤسسية:<\/b><ul><li>تنفيذ تدريبات ومحاكاة ميدانية افتراضية.<\/li><li>مراجعة صلاحية المعدات وأنظمة الاتصال البديلة.<\/li><li>مخزون الاستجابة السريعة (أغذية، أدوية، خيام).<\/li><\/ul><\/li><\/ul> <h3>دورة حياة الكارثة: مرحلة الاستجابة الطارئة<\/h3><h4>3 - مرحلة الاستجابة الطارئة<\/h4><ul><li><b>المدخل:<\/b> الساعات والأيام الأولى لوقوع الكارثة (تفعيل خطة الطوارئ).<\/li><li><b>الأعمال المؤسسية:<\/b><ul><li>إنقاذ الأرواح وإخلاء المناطق المتأثرة.<\/li><li>تقديم الخدمات الطبية العاجلة وإدارة المستشفيات الميدانية.<\/li><li>تأمين المرافق الأساسية (كهرباء، مياه، اتصالات) ومنع سرقة أو انهيار الأمن.<\/li><\/ul><\/li><\/ul> <h3>دورة حياة الكارثة: مرحلة التعافي وإعادة الإعمار<\/h3><h4>4 - مرحلة التعافي وإعادة الإعمار<\/h4><ul><li><b>المدخل:<\/b> العودة للتوازن وإعادة بناء المنطقة المتضررة بشروط أفضل مما كانت عليه.<\/li><li><b>الأعمال المؤسسية:<\/b><ul><li>الدعم النفسي والاجتماعي للمتضررين وتوفير سكن بديل.<\/li><li>إزالة الأنقاض وإعادة بناء البنية التحتية بنماذج أكثر صلابة.<\/li><li>تقييم الأداء المؤسسي وصياغة ملف “الدروس المستفادة” لتعديل الخطط المستقبلية.<\/li><\/ul><\/li><\/ul>"},{"unit":4,"title":"الهيكل الوطني لإدارة الأزمات","html":"<h3>الهيكل الوطني لإدارة الأزمات والكوارث<\/h3><p>عندما تقع كارثة كبرى، لا يمكن ترك كل وزارة أو جهاز يعمل بشكل منفصل. المبدأ الحاكم هو “وحدة القيادة وتكامل الأداء.”<\/p><h4>1 - تعريف الهيكل الوطني لإدارة الأزمات<\/h4><p>هو الإطار المؤسسي المعترف به رسمياً وقانونياً بالدولة، والذي يربط بين كافة السلطات التنفيذية، والأمنية، والخدمية، والاجتماعية ضمن شبكة قيادية موحدة تعمل وفق سياسات واستراتيجية مسبقة لمواجهة المخاطر القومية.<\/p><h4>2 - الفلسفة الحاكمة للهيكل الوطني<\/h4><ul><li><b>المركزية الاستراتيجية واللامركزية التنفيذية:<\/b> القرار السياسي وتوزيع الموارد الكبرى يكون مركزياً من أعلى سلطة، بينما تعطى الصلاحيات الميدانية للقيادات المحلية للتحرك السريع.<\/li><li><b>الشمولية:<\/b> أن يكون الهيكل قابلاً للتعامل مع أي نوع من الكوارث (طبيعية كـ الزلازل والسيول، أو بشرية كـ الحوادث الكبرى والإرهاب، أو صحية كـ الجوائح)، دون الحاجة لتأسيس هيكل جديد لكل أزمة.<\/li><li><b>استمرارية القيادة:<\/b> ضمان وجود بدلاء وسلسلة قيادة واضحة في حال تغيب أو إصابة أي مسؤول.<\/li><\/ul> <h3>المكونات الرئيسية للهيكل الوطني<\/h3><p>يتكون الهيكل الوطني الناجح من 3 مستويات قيادية وتنفيذية مترابطة:<\/p><h4>1 - المستوى الاستراتيجي (السياسي / القيادي)<\/h4><ul><li><b>المشكّلون:<\/b> رئيس مجلس الوزراء، الوزراء المعنيون (دفاع، داخلية، صحة، نقل، إعلام، مالية)، رؤساء الأجهزة الأمنية.<\/li><li><b>المهام:<\/b><ul><li>إعلان حالة الطوارئ أو الكارثة القومية.<\/li><li>اتخاذ القرارات السيادية وتوجيه الموارد المالية والعسكرية الشاملة.<\/li><li>طلب أو قبول المساعدات الدولية.<\/li><\/ul><\/li><\/ul><h4>2 - المستوى التنسيقي / التكتيكي (المركز الوطني لإدارة الأزمات)<\/h4><ul><li><b>المكون:<\/b> جهاز أو مركز دائري مستمر يعمل 7/24 تحت إدارة خبراء وممثلين دائمين عن كافة الوزارات.<\/li><li><b>المهام:<\/b><ul><li>التقييم المستمر للمخاطر وتجميع البيانات اللحظية.<\/li><li>صياغة السيناريوهات وعرض البدائل والحلول أمام القيادة السياسية.<\/li><li>التنسيق بين كافة أجهزة الدولة لضمان عدم تضارب القرارات.<\/li><\/ul><\/li><\/ul><h4>3 - المستوى الميداني / التنفيذي (المحافظات والميدان)<\/h4><ul><li><b>المكون:<\/b> المحافظون، قادة القطاعات، فرق الدفاع المدني، المستشفيات، القوات المسلحة الميدانية.<\/li><li><b>المهام:<\/b><ul><li>التنفيذ المباشر لعمليات الإنقاذ والإخلاء والإغاثة.<\/li><li>رفع تقارير موقف لحظية للمركز الوطني.<\/li><\/ul><\/li><\/ul> <h3>الوظائف والمهام الأساسية للكيان الوطني<\/h3><p>يقوم الهيكل الوطني بأداء أربع وظائف جوهرية تعتمد عليها الدولة في إدارة المواقف الحادّة:<\/p><h4>1 - إدارة المخاطر والتنبؤ الاستباقي<\/h4><ul><li>إنشاء وحصر “سجل المخاطر القومي”.<\/li><li>استخدام الخرائط التفاعلية وتحديد النقاط الأكثر هشاشة بالدولة (مثل السدود، المناطق المزدحمة، الشبكات الكهربائية).<\/li><\/ul><h4>2 - التخطيط وبناء السيناريوهات<\/h4><ul><li>وضع خطط الطوارئ القومية لكل خطر متوقع.<\/li><li>إجراء تدريبات ومحاكاة دورية وهمية لتحديد نقاط الضعف قبل وقوع الكارثة الحقيقية.<\/li><\/ul><h4>3 - إدارة الاتصال والأزمات الإعلامية<\/h4><ul><li>توحيد الخطاب الإعلامي للدولة عبر متحدث رسمي باسم المركز الوطني.<\/li><li>مواجهة الشائعات والمعلومات المغلوطة التي تسهم في إشاعة الفوضى أو الهلع بين المواطنين.<\/li><\/ul><h4>4 - إدارة اللوجستيات والموارد القومية<\/h4><ul><li>إعداد قاعدة بيانات رقمية شاملة للمعدات، والأطقم الطبية، وسيارات الإسعاف، وطائرات الإنقاذ على مستوى الدولة للتدخل السريع عند الطلب.<\/li><\/ul> <h3>نظام إدارة الحوادث الميداني (ICS)<\/h3><p>لا تكتمل مأسسة الهيكل الوطني إلا بتطبيق نظام قيادة الحوادث الميداني.<\/p><h4>1 - مكونات نظام القيادة الميداني (ICS)<\/h4><p>تعتمد قيادة الميدان على أربعة قطاعات رئيسية تعمل تحت قيادة “قائد الحادث”:<\/p><ul><li><b>قسم العمليات:<\/b> المنفذون، والإخلاء، والفرق الطبية (من يمارس الفعل الميداني).<\/li><li><b>قسم التخطيط:<\/b> جمع البيانات، تقييم تطور الكارثة، ووضع خطة العمل للفترة القادمة.<\/li><li><b>قسم اللوجستيات:<\/b> توفير الإمدادات، والوقود، وشبكات الاتصال، والإطعام.<\/li><li><b>قسم المالية والإدارة:<\/b> التعويضات، وتوثيق التكاليف، وعقود التجهيزات العاجلة.<\/li><\/ul> <h3>شروط نجاح الهيكل الوطني<\/h3><ul><li><b>وحدة الأمر:<\/b> يعلم كل فرد في الميدان من هو رئيسه المباشر لتجنب التضارب.<\/li><li><b>نطاق السيطرة المناسب:<\/b> ألا يشرف القيادي الواحد على أكثر من 3 إلى 7 أفراد أو فرق عمل لضمان تركيز السيطرة.<\/li><li><b>الاتصالات المتوافقة:<\/b> استخدام شبكات لاسلكية مجهزة تعمل على نفس الترددات بين الشرطة، والجيش، والإسعاف.<\/li><\/ul> <h3>منظومة إدارة الأزمات على المستوى الوطني: التعريف والمراحل الأربع<\/h3><h4>أولاً: تعريف منظومة إدارة الأزمات على المستوى الوطني<\/h4><p>منظومة إدارة الأزمات على المستوى الوطني هي إطار وطني متكامل يضم الجهات الحكومية والأمنية والعسكرية والصحية والقطاع الخاص والمجتمع المدني، ويحدد أدوارها وآليات التنسيق بينها، بهدف التنبؤ بالأزمات والاستعداد لها، والاستجابة السريعة والفعالة عند وقوعها، ثم التعافي وإعادة الأوضاع الطبيعية، والحد من تكرارها لمنع تكرار آثارها، وتعزيز قدرة الدولة على الصمود.<\/p><p>وتشمل أربع مراحل رئيسية: <b>الوقاية والتخفيف - الاستعداد - الاستجابة - التعافي وإعادة الإعمار.<\/b><\/p>"},{"unit":5,"title":"منظومة إدارة الأزمات ومراحلها","html":"<h3>الوقاية والتخفيف من المخاطر (المنظومة الوطنية)<\/h3><h4>1 - الوقاية والتخفيف من المخاطر<\/h4><p>هي الإجراءات التي تُتخذ قبل وقوع الأزمة لمنع حدوثها قدر الإمكان، أو تقليل احتمالية وقوعها وحجم أضرارها إذا تعذر منعها.<\/p><ul><li><b>الهدف:<\/b> حماية الأرواح والممتلكات والبنية التحتية، وتقليل الخسائر الاقتصادية والاجتماعية.<\/li><li><b>أهم الإجراءات:<\/b><ul><li>تحديد المخاطر والتهديدات المحتملة على المستوى الوطني.<\/li><li>إعداد خرائط للمخاطر وتحديد المناطق والفئات الأكثر تعرضاً.<\/li><li>تقييم احتمالية وقوع كل خطر وتأثيره المتوقع.<\/li><li>وضع التشريعات والاشتراطات الوقائية.<\/li><li>تعزيز قدرة المنشآت الحيوية مثل المستشفيات ومحطات الكهرباء والمياه.<\/li><li>إنشاء أنظمة الإنذار المبكر.<\/li><li>معالجة نقاط الضعف التي قد تؤدي إلى تفاقم الأزمة.<\/li><\/ul><\/li><li><b>مثال:<\/b> منع أو تخفيف أضرار السيول، يتم إنشاء شبكات تصريف، ومنع البناء في مجاري السيول، ومراقبة الأحوال الجوية، وتحديد المناطق المهددة مسبقاً.<\/li><li><b>المخرجات الرئيسية:<\/b> تقييم وطني للمخاطر، وخرائط المخاطر، وإجراءات قانونية، وخطط لتقليل الخسائر.<\/li><\/ul> <h3>الاستعداد والجاهزية (المنظومة الوطنية)<\/h3><h4>2 - الاستعداد والجاهزية<\/h4><p>هي مرحلة تجهيز الدولة ومؤسساتها للتعامل مع الأزمة قبل وقوعها، في حال لم تنجح إجراءات الوقاية في منعها.<\/p><ul><li><b>الهدف:<\/b> ضمان أن تكون الجهات المعنية مستعدة للتحرك بسرعة وكفاءة عند وقوع الأزمة.<\/li><li><b>أهم الإجراءات:<\/b><ul><li>إعداد خطط الطوارئ والاستجابة الوطنية.<\/li><li>تحديد أدوار ومسؤوليات كل جهة.<\/li><li>إنشاء غرف ومراكز إدارة الأزمات.<\/li><li>وضع آليات واضحة للقيادة واتخاذ القرار.<\/li><li>تدريب فرق الطوارئ والإنقاذ والإسعاف.<\/li><li>تنفيذ تدريبات ومحاكاة لسيناريوهات الأزمات.<\/li><li>تجهيز الموارد والمعدات والمخزون الاستراتيجي.<\/li><li>تحديد طرق الإخلاء ومراكز الإيواء.<\/li><li>إعداد خطط الاتصال والإعلام أثناء الأزمة.<\/li><li>الاتفاق على آليات تبادل المعلومات بين الجهات.<\/li><\/ul><\/li><li><b>مثال:<\/b> قبل موسم السيول، يتم اختبار أجهزة الإنذار، وتجهيز فرق الإنقاذ، وتحديد مراكز الإيواء، والتأكد من جاهزية سيارات الإسعاف والمعدات.<\/li><li><b>المخرجات الرئيسية:<\/b> خطط طوارئ معتمدة، وفرق مدربة، وموارد جاهزة، وسيناريوهات استجابة مجرّبة.<\/li><\/ul><h4>الفرق الأساسي بين (الوقاية والتخفيف) و(الاستعداد والجاهزية)<\/h4><div class=\"note\">التخفيف يقلل الخطر نفسه، بينما الاستعداد يجهز الدولة للتعامل معه إذا وقع.<\/div> <h3>الاستجابة (المنظومة الوطنية)<\/h3><h4>1 - الاستجابة<\/h4><p>تبدأ هذه المرحلة عند وقوع الأزمة أو ظهور مؤشرات مؤكدة على قرب وقوعها، وتشمل الإجراءات العاجلة للسيطرة على الموقف وتقليل الخسائر.<\/p><ul><li><b>الهدف:<\/b> إنقاذ الأرواح، حماية الممتلكات، احتواء الأزمة، وضمان استمرار الخدمات الأساسية.<\/li><li><b>أهم الإجراءات:<\/b><ul><li>تفعيل مركز إدارة الأزمات وخطط الطوارئ.<\/li><li>جمع المعلومات والتحقق منها وتكوين صورة موحدة للموقف.<\/li><li>إصدار التحذيرات والتعليمات الرسمية.<\/li><li>تنفيذ عمليات الإنقاذ والإخلاء والإسعاف.<\/li><li>تأمين المناطق المتضررة وتنظيم الحركة.<\/li><li>توفير الغذاء والمياه والرعاية الصحية والإيواء المؤقت.<\/li><li>حماية المنشآت والخدمات الحيوية.<\/li><li>تنسيق الموارد والفرق بين الجهات المختلفة.<\/li><li>إدارة الاتصال الإعلامي ومواجهة الشائعات والمعلومات المضللة.<\/li><li>متابعة تطورات الأزمة وتحديث القرارات باستمرار.<\/li><\/ul><\/li><li><b>مثال:<\/b> عند وقوع السيول، يتم إخلاء المناطق المهددة، وإغلاق الطرق الخطرة، وإنقاذ المتضررين، وتوفير مراكز إيواء وخدمات طبية عاجلة.<\/li><li><b>المخرجات الرئيسية:<\/b> احتواء الأزمة، وتقليل الإصابات والخسائر، واستقرار الموقف، واستمرار الخدمات الحيوية.<\/li><\/ul> <h3>التعافي وإعادة الإعمار (المنظومة الوطنية)<\/h3><h4>2 - التعافي وإعادة الإعمار<\/h4><p>تبدأ بعد السيطرة على الخطر المباشر، وتهدف إلى إعادة المجتمع والدولة للعمل بصورة طبيعية، مع معالجة الآثار طويلة الأجل للأزمة.<\/p><ul><li><b>الهدف:<\/b> استعادة الخدمات والأنشطة الاقتصادية والاجتماعية، وتعويض الأضرار، وإعادة البناء بصورة أكثر قدرة على مواجهة الأزمات المستقبلية.<\/li><li><b>أهم الإجراءات:<\/b><ul><li>إجراء تقييم شامل للأضرار والاحتياجات.<\/li><li>إعادة تشغيل الكهرباء والمياه والاتصالات والنقل.<\/li><li>إصلاح أو إعادة بناء المنشآت والبنية التحتية المتضررة.<\/li><li>تقديم الدعم المالي والاجتماعي والنفسي للمتضررين.<\/li><li>إعادة فتح المدارس والمستشفيات ومواقع العمل.<\/li><li>دعم الأنشطة الاقتصادية والمؤسسات المتضررة.<\/li><li>توثيق القرارات والإجراءات التي اتُخذت أثناء الأزمة.<\/li><li>تقييم أداء الجهات واستخلاص الدروس المستفادة.<\/li><li>تحديث خطط الطوارئ والتشريعات بناءً على النتائج.<\/li><li>إعادة البناء وفق مبدأ البناء بصورة أفضل وأكثر أماناً.<\/li><\/ul><\/li><li><b>مثال:<\/b> بعد انتهاء السيول، يتم إصلاح الطرق والمنازل وشبكات المرافق، وتعويض المتضررين، ثم تطوير شبكات التصريف لمنع تكرار الخسائر نفسها.<\/li><li><b>المخرجات الرئيسية:<\/b> استعادة الحياة الطبيعية، وإعادة بناء ما تضرر، وتحسين الخطط، وتعزيز قدرة الدولة على الصمود.<\/li><\/ul> <h3>الخلاصة: جدول المراحل الأربع<\/h3><table><thead><tr><th>م<\/th><th>المرحلة<\/th><th>التوقيت<\/th><th>الهدف الرئيسي<\/th><th>أبرز الإجراءات<\/th><th>المخرجات المتوقعة<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>الوقاية والتخفيف<\/td><td>قبل الأزمة<\/td><td>منع الأزمة أو الحد من تأثيرها<\/td><td>تقييم المخاطر، خرائط المخاطر، التشريعات الوقائية، الإنذار المبكر<\/td><td>تقليل احتمالية الأزمة وحجم الخسائر<\/td><\/tr><tr><td>2<\/td><td>الاستعداد والجاهزية<\/td><td>قبل الأزمة<\/td><td>رفع جاهزية الدولة للتعامل مع الأزمة<\/td><td>إعداد خطط الطوارئ، تحديد المسؤوليات والتدريب والمحاكاة، تجهيز الموارد<\/td><td>خطط معتمدة، وفرق مدربة، وموارد جاهزة<\/td><\/tr><tr><td>3<\/td><td>الاستجابة<\/td><td>أثناء الأزمة<\/td><td>السيطرة على الأزمة وتقليل الخسائر<\/td><td>تفعيل خطط الطوارئ، الإنقاذ والإخلاء، توفير الإيواء والدعم، إدارة المعلومات والإعلام<\/td><td>إنقاذ الأرواح، واحتواء الأزمة، واستمرار الخدمات الحيوية<\/td><\/tr><tr><td>4<\/td><td>التعافي وإعادة الإعمار<\/td><td>بعد الأزمة<\/td><td>معالجة الآثار وإعادة البناء بصورة أفضل<\/td><td>تقييم الأضرار، دعم المتضررين، إعادة الإعمار، استخلاص الدروس<\/td><td>استعادة الحياة الطبيعية، وتعزيز قدرة الدولة على الصمود<\/td><\/tr><\/tbody><\/table>"},{"unit":6,"title":"أدوار الأجهزة المعنية","html":"<h3>تحديد الأدوار العامة للأجهزة والمؤسسات المعنية بإدارة الأزمة<\/h3><p>يقصد بذلك توزيع المسؤوليات والصلاحيات بوضوح بين جميع الجهات المشاركة في إدارة الأزمة، وتحديد الجهة التي تقود، والجهات التي تنفذ، والجهات الداعمة، وآليات التنسيق وتبادل المعلومات بينها، بما يمنع تضارب القرارات أو ازدواجية الجهود، ويضمن سرعة الاستجابة.<\/p><h4>المهام الرئيسية للمؤسسات والأجهزة المعنية بإدارة الأزمات على المستوى الوطني<\/h4><p>الأزمة الوطنية لا تتعامل معها مؤسسة واحدة فقط، بل تتطلب مشاركة جميع المؤسسات:<\/p><ol><li>القيادة السياسية.<\/li><li>المؤسسات الأمنية.<\/li><li>القوات المسلحة.<\/li><li>أجهزة الحماية المدنية.<\/li><li>جميع الوزارات المعنية [وزارة التنمية المحلية (المحافظات) - الصحة - التضامن - ....].<\/li><li>المؤسسات الاقتصادية.<\/li><li>مؤسسات النقل.<\/li><li>مؤسسات الطاقة.<\/li><li>مؤسسات المياه.<\/li><li>أجهزة الاتصالات.<\/li><li>الإعلام.<\/li><li>المجتمع المدني.<\/li><li>القطاع الخاص.<\/li><li>إلخ.<\/li><\/ol> <h3>عوامل نجاح إدارة الأزمة<\/h3><ol><li>وضوح الاختصاصات وتخصيص المهام.<\/li><li>التنسيق المستمر.<\/li><li>سرعة ودقة المعلومات.<\/li><li>وحدة القرار.<\/li><li>كفاءة التنفيذ.<\/li><\/ol> <h3>مبادئ العمل المؤسسي أثناء الأزمة<\/h3><h4>1 - وضوح المسؤوليات<\/h4><p>يجب أن يعرف كل جهاز:<\/p><ul><li>ما مسؤوليته؟<\/li><li>ما صلاحياته؟<\/li><li>مع من يتنسيق؟<\/li><li>من يتلقى التعليمات؟<\/li><li>ما حدود اختصاصه؟<\/li><\/ul><h4>2 - وحدة القيادة<\/h4><p>كلما زاد عدد الجهات المشاركة في الأزمة زادت الحاجة إلى وجود:<\/p><ul><li>قيادة واضحة.<\/li><li>آلية تنسيق واضحة.<\/li><\/ul><h4>3 - سرعة تدفق المعلومات<\/h4><p>المعلومات أثناء الأزمة يجب أن تنتقل بصورة:<\/p><ul><li>سريعة.<\/li><li>دقيقة.<\/li><li>موثوقة.<\/li><li>مؤكدة.<\/li><li>موقوتة.<\/li><li>قابلة للتحليل.<\/li><\/ul><h4>4 - التنسيق الأفقي<\/h4><p>أي التنسيق بين المؤسسات التي تعمل في المستوى نفسه، مثل: وزارة الصحة - وزارة الداخلية - وزارة النقل - الإدارة المحلية.<\/p><h4>5 - التنسيق الرأسي<\/h4><p>أي انتقال المعلومات والقرارات بين: المستوى المركزي - المستوى المحلي.<\/p> <h3>دور القيادة السياسية في إدارة الأزمات<\/h3><p>تتولى القيادة السياسية إدارة الأزمة على المستوى الاستراتيجي الأعلى، وتحدد التوجه العام للدولة وأولويات التعامل مع الأزمة. وتشمل مسؤولياتها:<\/p><ul><li>تحديد الأولويات الوطنية، وإتخاذ القرارات السيادية والاستثنائية.<\/li><li>تحديد مستوى الاستجابة واعتماد السياسات والخطط الوطنية للاستجابة.<\/li><li>توجيه المؤسسات والموارد والإمكانات إلى القطاعات الأكثر تضرراً.<\/li><li>اتخاذ القرارات الاستراتيجية مثل إعلان حالة الطوارئ أو التعبئة العامة عند الضرورة.<\/li><li>متابعة أداء الجهات الحكومية ومحاسبتها.<\/li><li>إدارة العلاقات الخارجية وطلب المساعدات الدولية إذا تجاوزت الأزمة القدرات الوطنية.<\/li><li>طمأنة المواطنين والحفاظ على الثقة في مؤسسات الدولة.<\/li><\/ul><div class=\"note\">القيادة الناجحة أثناء الأزمة لا تعني اتخاذ عدد أكبر من القرارات، وإنما اتخاذ القرارات الصحيحة في الوقت المناسب بناءً على المعلومات المتاحة.<\/div> <h3>دور المؤسسات الأمنية<\/h3><p>تتولى المؤسسات الأمنية الحفاظ على الأمن والنظام العام، ومنع استغلال الأزمة في نشر الفوضى أو ارتكاب الجرائم. وتشمل مسؤولياتها:<\/p><ul><li>حماية الأرواح، وتأمين المناطق والمنشآت الحيوية.<\/li><li>حفظ النظام وتنظيم الدخول إلى المناطق المتضررة والخروج منها.<\/li><li>تأمين المناطق المتضررة وحماية فرق الإنقاذ وتأمين مسارات أداء مهامها.<\/li><li>إدارة الحركة لتنظيم حركة المرور وتأمين مسارات الإخلاء.<\/li><li>منع الجريمة مثل أعمال السرقة أو التخريب أو الاحتكار.<\/li><li>دعم عمليات الإخلاء لمساندة تنفيذ قرارات الإخلاء أو العزل.<\/li><li>حماية المواقع الحيوية ومتابعة التهديدات الأمنية المصاحبة للأزمة.<\/li><li>جمع وتحليل المعلومات الأمنية في حدود الاختصاص، ودعم جهود مكافحة الشائعات والمعلومات المضللة بالتنسيق مع الجهات المختصة.<\/li><\/ul><div class=\"note\">القاعدة الأساسية: لا تنجح الاستجابة الأمنية إذا عمل كل جهاز بمعزل عن باقي الأجهزة.<\/div> <h3>دور القوات المسلحة في إدارة الأزمات<\/h3><p>تقدم القوات المسلحة الدعم عند الأزمات التي تتجاوز قدرات الجهات المدنية، لما تمتلكه من إمكانات بشرية ولوجستية وهندسية وطنية كبيرة، ويختلف الدور العسكري وفق طبيعة الأزمة والقوانين والاختصاصات الوطنية.<\/p><p><b>وتشمل مسؤولياتها:<\/b><\/p><ul><li>دعم عمليات الإنقاذ والإخلاء.<\/li><li>البحث والإنقاذ باستخدام الطائرات والمركبات والمعدات الثقيلة للوصول إلى المناطق المتضررة.<\/li><li>الدعم الطبي بإنشاء المستشفيات الميدانية ومراكز الإيواء المؤقتة.<\/li><li>الهندسة: فتح الطرق، وإزالة الأنقاض، وإقامة الجسور المؤقتة.<\/li><li>دعم عمليات نقل الإغاثة والإمدادات والمساعدات العاجلة.<\/li><li>تأمين بعض المنشآت الحيوية والحدود والمواقع الاستراتيجية عند الحاجة.<\/li><li>توفير الاتصالات البديلة.<\/li><li>الإسناد اللوجستي ودعم السلطات المدنية وفقاً للقوانين والخطة الوطنية المعتمدة.<\/li><\/ul><div class=\"note\">ويجب التمييز بين إدارة الأزمة المدنية والإسناد العسكري للأجهزة المدنية. فالهدف في الأزمات الوطنية هو تحقيق التكامل بين القدرات المختلفة، وليس بالضرورة أن تتولى مؤسسة واحدة جميع جوانب الأزمة.<\/div> <h3>دور أجهزة الحماية المدنية والطوارئ<\/h3><p>تُعد أجهزة الحماية المدنية من أهم جهات الاستجابة الميدانية المباشرة، خاصة في الساعات الأولى من وقوع الأزمة، وتقوم أجهزة الطوارئ عادة بمهام مباشرة في موقع الأزمة. وتشمل مسؤولياتها:<\/p><ul><li>الإطفاء ومكافحة الحرائق.<\/li><li>تنفيذ عمليات البحث والإنقاذ.<\/li><li>إخلاء السكان من المناطق الخطرة.<\/li><li>التعامل مع الحوادث وإنقاذ المحاصرين والمصابين.<\/li><li>التعامل مع تسرب المواد الخطرة والمواد الكيميائية.<\/li><li>تقييم سلامة المباني والمنشآت المتضررة.<\/li><li>تأمين مواقع الحوادث ومنع امتداد الخطر.<\/li><li>تقديم الإسعافات الأولية لحين وصول الجهات الصحية.<\/li><\/ul><div class=\"note\">وهذه الأجهزة تمثل غالباً خط الاستجابة الأولى في العديد من الأزمات المحلية والكوارث.<\/div> <h3>دور الوزارات<\/h3><p>الأزمات الحديثة متعددة الأبعاد، ولذلك تختلف الجهات المشاركة حسب طبيعة الأزمة، حيث تتولى كل وزارة إدارة الآثار المرتبطة بقطاعها واختصاصها، وتفعيل خطة الطوارئ القطاعية بالتنسيق مع مركز إدارة الأزمات.<\/p><h4>على سبيل المثال:<\/h4><ul><li>تتولى وزارة الصحة إدارة الاستجابة الصحية.<\/li><li>تتولى وزارة النقل تأمين وسائل النقل والطرق.<\/li><li>تتولى وزارة التموين ضمان توافر السلع الأساسية.<\/li><li>تتولى وزارة التضامن تقديم الدعم الاجتماعي للمتضررين.<\/li><li>تتولى وزارة التربية والتعليم حماية الطلاب والمنشآت التعليمية.<\/li><li>تتولى وزارة البيئة متابعة الآثار والمخاطر البيئية.<\/li><\/ul><p>ويجب على كل وزارة ضمان استمرارية خدماتها، وتقديم بيانات دقيقة عن الموقف، وتوفير الموارد المتخصصة المطلوبة.<\/p><h4>تزداد الأهمية حسب نوع الأزمة<\/h4><p><b>في الأزمة الاقتصادية تتقدم المؤسسات المالية والاقتصادية.<\/b><\/p><p><b>في الكارثة الطبيعية تزداد أهمية:<\/b><\/p><ul><li>الحماية المدنية.<\/li><li>الصحة.<\/li><li>الإدارة المحلية.<\/li><li>النقل.<\/li><li>الخدمات.<\/li><\/ul><p><b>في الأزمة السيبرانية تزداد أهمية:<\/b><\/p><ul><li>الجهات المختصة بالاتصالات.<\/li><li>الأمن السيبراني.<\/li><li>المؤسسات المتضررة.<\/li><li>أجهزة الأمن.<\/li><li>مزودو التكنولوجيا.<\/li><\/ul> <h3>دور المحليات والمحافظات<\/h3><p>تتولى المحافظات والإدارات المحلية إدارة الأزمة على المستوى الميداني والمحلي، لأنها الأكثر قرباً من المواطنين والمناطق المتضررة. وتشمل مسؤولياتها:<\/p><ul><li>تفعيل غرف العمليات المحلية.<\/li><li>تقييم الموقف وتحديد الاحتياجات العاجلة.<\/li><li>تنفيذ عمليات الإخلاء والإيواء.<\/li><li>تحديد مراكز استقبال المتضررين.<\/li><li>معرفة الاحتياجات المحلية وحصر الأضرار والخسائر.<\/li><li>التنسيق مع الأجهزة التنفيذية داخل المحافظة.<\/li><li>توزيع المساعدات والإمدادات.<\/li><li>متابعة استعادة الخدمات المحلية.<\/li><li>رفع تقارير دورية إلى الجهات المركزية.<\/li><\/ul><div class=\"note\">المستوى المحلي يرى الأزمة على الأرض، بينما المستوى المركزي يمتلك قدرة أكبر على حشد الموارد الوطنية. ولذلك فإن نجاح إدارة الأزمة يحتاج إلى الربط بين المستويين.<\/div> <h3>دور القطاع الصحي<\/h3><p>يتولى القطاع الصحي حماية الأرواح والتعامل مع الآثار الصحية المباشرة وغير المباشرة للأزمة من خلال منظومة متكاملة (المستشفيات - الإسعاف - الطوارئ - بنوك الدم - الوقاية - المختبرات - الأدوية - التواصل الصحي) والإمدادات الطبية.<\/p><p><b>وتشمل مسؤولياته:<\/b><\/p><ul><li>استقبال المصابين وتصنيفهم وفق درجة الخطورة.<\/li><li>تقديم خدمات الإسعاف والعلاج والرعاية الطارئة.<\/li><li>رفع جاهزية المستشفيات وزيادة قدرتها الاستيعابية.<\/li><li>توفير الأدوية والمستلزمات الطبية.<\/li><li>نشر الفرق الطبية والمستشفيات الميدانية.<\/li><li>مراقبة الأمراض والأوبئة ومنع انتشارها.<\/li><li>تطبيق إجراءات العزل والحجر عند الضرورة.<\/li><li>تقديم الدعم النفسي للمتضررين وفرق الاستجابة.<\/li><li>إدارة بيانات الإصابات والوفيات بصورة دقيقة.<\/li><\/ul><div class=\"note\">ولا يقتصر دور القطاع الصحي على العلاج، بل يشمل أيضاً (الوقاية - الرصد - الاستجابة).<\/div> <h3>دور المؤسسات الاقتصادية ومؤسسات النقل<\/h3><h4>المؤسسات الاقتصادية<\/h4><p>تعمل المؤسسات الاقتصادية والمالية على الحد من الآثار الاقتصادية والمالية للأزمة، والحفاظ على استقرار الأسواق والأنشطة الحيوية. فقد تؤدي الأزمة إلى (تعطيل الإنتاج - ارتفاع الأسعار - نقص السلع - تراجع الإيرادات - اضطراب الأسواق).<\/p><p><b>ولذلك تحتاج الدولة إلى:<\/b><\/p><ul><li>تقييم الأثر الاقتصادي.<\/li><li>تأمين الاحتياجات الأساسية.<\/li><li>إدارة الموارد.<\/li><li>حماية سلاسل الإمداد.<\/li><li>دعم القطاعات المتضررة.<\/li><\/ul><p><b>وتشمل مسؤولياتها:<\/b><\/p><ul><li>تقييم الخسائر الاقتصادية.<\/li><li>ضمان استمرار الخدمات المصرفية والمالية.<\/li><li>توفير السيولة والتمويل للقطاعات المتضررة.<\/li><li>مراقبة الأسواق والأسعار.<\/li><li>منع الاحتكار والاستغلال ورفع الأسعار بصورة غير مبررة.<\/li><li>دعم الشركات والعمال المتضررين.<\/li><li>وضع خطط لتحفيز الاقتصاد بعد الأزمة.<\/li><\/ul><div class=\"note\">وهنا يظهر مفهوم المرونة الاقتصادية: أي قدرة الاقتصاد على تحمل الصدمة والاستمرار والتعافي.<\/div><h4>مؤسسات النقل<\/h4><p>تضمن مؤسسات النقل استمرار حركة الأفراد والإمدادات والمساعدات، مع الحفاظ على سلامة الطرق والموانئ والمطارات ووسائل النقل. وتشمل مسؤولياتها:<\/p><ul><li>توفير وسائل نقل لعمليات الإخلاء.<\/li><li>نقل فرق الإنقاذ والمعدات والمساعدات.<\/li><li>تأمين الطرق والممرات اللوجستية.<\/li><li>تحديد طرق بديلة عند إغلاق الطرق الرئيسية.<\/li><li>تقييم سلامة الجسور وشبكات السكك الحديدية.<\/li><li>الحفاظ على تشغيل الموانئ والمطارات عند الإمكان.<\/li><li>إعطاء الأولوية لنقل المصابين والمواد الطبية والسلع الأساسية.<\/li><\/ul> <h3>دور مؤسسات الطاقة<\/h3><p>تتولى مؤسسات الطاقة ضمان استمرارية إمدادات الكهرباء والوقود والغاز، باعتبارها من الخدمات الضرورية لاستمرار عمل الدولة. وتشمل مسؤولياتها:<\/p><ul><li>حماية محطات الكهرباء والوقود والغاز.<\/li><li>تقييم الأعطال والأضرار.<\/li><li>إصلاح الشبكات وإعادة تشغيلها بسرعة.<\/li><li>توفير مصادر طاقة بديلة ومولدات احتياطية.<\/li><li>إعطاء الأولوية للمستشفيات ومراكز الاتصالات ومحطات المياه.<\/li><li>تأمين مخزون الوقود اللازم لعمليات الطوارئ.<\/li><li>تقنين الاستهلاك مؤقتاً إذا تطلب الموقف ذلك.<\/li><\/ul> <h3>دور مؤسسات المياه<\/h3><p>تعمل مؤسسات المياه والصرف الصحي على ضمان توفر مياه آمنة وصالحة للاستخدام، ومنع حدوث مخاطر صحية أو بيئية إضافية. وتشمل مسؤولياتها:<\/p><ul><li>حماية محطات المياه والصرف الصحي.<\/li><li>مراقبة جودة المياه واكتشاف التلوث.<\/li><li>إصلاح الكسور والأعطال في الشبكات.<\/li><li>توفير خزانات ومصادر مياه بديلة.<\/li><li>توزيع المياه على المناطق المتضررة.<\/li><li>إعطاء الأولوية للمستشفيات ومراكز الإيواء.<\/li><li>معالجة مشكلات الصرف الصحي لمنع انتشار الأمراض.<\/li><\/ul> <h3>دور أجهزة الاتصالات<\/h3><p>تمثل الاتصالات عنصراً أساسياً في القيادة والسيطرة وتبادل المعلومات، ولذلك تتولى أجهزة الاتصالات ضمان استمرارية شبكات الاتصال والإنترنت والاتصالات الحكومية. وتشمل مسؤولياتها:<\/p><ul><li>الحفاظ على تشغيل شبكات الهاتف والإنترنت.<\/li><li>توفير قنوات اتصال بديلة عند تعطل الشبكات.<\/li><li>إعطاء الأولوية لاتصالات الجهات الحكومية وفرق الطوارئ.<\/li><li>دعم أنظمة الإنذار والتحذير الجماهيري.<\/li><li>حماية الشبكات من الهجمات الإلكترونية.<\/li><li>إعادة الخدمات المتضررة بسرعة.<\/li><li>توفير البيانات الفنية اللازمة لغرف إدارة الأزمات.<\/li><\/ul> <h3>دور الإعلام<\/h3><p>يتولى الإعلام إدارة الاتصال مع الجمهور وتقديم معلومات دقيقة وواضحة وفي الوقت المناسب. وتشمل مسؤولياته:<\/p><ul><li>نشر البيانات الرسمية وتحديثات الموقف.<\/li><li>توعية المواطنين بكيفية التصرف.<\/li><li>الإعلان عن مناطق الخطر ومسارات الإخلاء ومراكز الإيواء.<\/li><li>تصحيح الأخبار غير الدقيقة ومواجهة الشائعات.<\/li><li>تجنب نشر معلومات قد تثير الذعر.<\/li><li>الحفاظ على الشفافية والمصداقية.<\/li><li>توحيد الرسائل بالتنسيق مع المتحدث الرسمي.<\/li><li>نقل احتياجات المتضررين بصورة مسؤولة.<\/li><\/ul> <h3>دور المجتمع المدني<\/h3><p>يضم المجتمع المدني الجمعيات الأهلية والمؤسسات الخيرية والنقابات والمبادرات المجتمعية والمتطوعين، ويؤدي دوراً داعماً للدولة في الوصول إلى المتضررين. وتشمل مسؤولياته:<\/p><ul><li>تقديم المساعدات الإنسانية والإغاثية.<\/li><li>دعم كبار السن والأطفال وذوي الإعاقة والفئات الأكثر احتياجاً.<\/li><li>تنظيم المتطوعين وتوجيه جهودهم.<\/li><li>توزيع الغذاء والملابس والأدوية.<\/li><li>تقديم الدعم النفسي والاجتماعي.<\/li><li>المساعدة في تحديد احتياجات المجتمعات المحلية.<\/li><li>المشاركة في التوعية والتعافي المجتمعي.<\/li><\/ul><div class=\"note\">ويجب أن تعمل جهوده تحت إشراف وتنسيق الجهات الرسمية لتجنب التكرار أو سوء توزيع المساعدات.<\/div> <h3>دور القطاع الخاص<\/h3><p>يمتلك القطاع الخاص موارد وخبرات وتقنيات وسلاسل إمداد يمكن الاستفادة منها في دعم الاستجابة والتعافي، ولا تستطيع الدولة استيعاب إدارة الأزمات الكبرى بمفردها دائماً.<\/p><div class=\"note\">يمكن أن يساهم القطاع الخاص (سلاسل الإمداد - النقل - الاتصالات - الخدمات الطبية - التكنولوجيا).<\/div><p><b>وتشمل مسؤولياته:<\/b><\/p><ul><li>الحفاظ على استمرارية الأعمال والخدمات الضرورية.<\/li><li>توفير السلع الغذائية والأدوية والوقود والمعدات.<\/li><li>دعم عمليات النقل والتخزين والتوزيع.<\/li><li>إتاحة المعدات والآليات والمرافق عند الحاجة.<\/li><li>تقديم الحلول التقنية والاتصالات والخدمات اللوجستية.<\/li><li>حماية العاملين والمنشآت التابعة له.<\/li><li>التعاون مع الدولة لمنع نقص السلع أو ارتفاع الأسعار.<\/li><li>المساهمة في تمويل جهود الإغاثة وإعادة الإعمار.<\/li><\/ul><div class=\"note\">كما يمكن للمجتمع المدني أن يساهم في (الإغاثة - دعم المتضررين - الخدمات المجتمعية - التوعية).<\/div><p>لكن المشاركة يجب أن تتم ضمن (تنسيق واضح - قواعد محددة - توزيع مسؤوليات).<\/p>"},{"unit":7,"title":"التكامل والقيادة والتعاون الدولي","html":"<h3>مبدأ التكامل بين الجهات: نموذج التكامل المؤسسي<\/h3><p>يمكن تصور منظومة الدولة أثناء الأزمة بالشكل التالي:<\/p><ul><li>القيادة الوطنية.<\/li><li>مركز إدارة الأزمة.<\/li><li>الوزارات والأجهزة الوطنية [الأمن - الصحة - الاقتصاد - النقل - الطاقة - الاتصالات].<\/li><li>الإدارة المحلية.<\/li><li>الاستجابة الميدانية.<\/li><\/ul><p>وفي الوقت نفسه: <b>المنظومة الوطنية - المنظومة الإقليمية والدولية.<\/b><\/p><div class=\"note\">لا يشترط مشاركة جميع الجهات بالدرجة نفسها في كل أزمة، بل يتم تفعيلها وفقاً لنوع الأزمة ونطاقها ومستوى خطورتها. ويعتمد نجاح المنظومة على الآتي:<\/div><ul><li>وجود قيادة موحدة.<\/li><li>وضوح الأدوار والصلاحيات.<\/li><li>سرعة تبادل المعلومات.<\/li><li>التنسيق المستمر بين المستوى المركزي والمحلي.<\/li><li>الاستخدام المشترك للموارد.<\/li><li>منع تضارب القرارات وازدواجية الجهود.<\/li><li>خضوع جميع الجهات لخطة وطنية معتمدة لإدارة الأزمة.<\/li><\/ul> <h3>أهمية القيادة والتنسيق الرأسي والأفقي أثناء الأزمات<\/h3><p>تحتاج الأزمة الوطنية إلى قيادة موحدة ونظام تنسيق فعال، لأن تعدد الجهات المشاركة دون تحديد واضح للقيادة ومسارات الاتصال قد يؤدي إلى تضارب القرارات، وتأخر الاستجابة، وتكرار الجهود، وسوء استخدام الموارد.<\/p><h4>القيادة أثناء الأزمة<\/h4><p>القيادة هي الجهة المسؤولة عن توجيه جميع الجهود نحو هدف مشترك، واتخاذ القرارات الحاسمة في ظل ضغط الوقت ونقص المعلومات.<\/p> <h3>التنسيق أثناء الأزمة<\/h3><p>وتتمثل أهميتها في:<\/p><ul><li>تحديد الأهداف والأولويات الوطنية.<\/li><li>توحيد القرارات ومنع صدور توجيهات متعارضة.<\/li><li>توزيع المسؤوليات والصلاحيات بين الجهات.<\/li><li>تخصيص الموارد وفق حجم الاحتياجات.<\/li><li>اتخاذ القرارات السريعة في المواقف الحرجة.<\/li><li>متابعة التنفيذ وتقييم النتائج.<\/li><li>ضمان المساءلة ووضوح المسؤولية.<\/li><li>توحيد الرسائل الرسمية الموجهة إلى المواطنين.<\/li><\/ul><div class=\"note\"><p>فالقيادة الفعالة لا تعني أن جهة واحدة تنفذ جميع المهام، وإنما تعني وجود مرجعية واضحة تقود وتنسق وتتابع أداء الجهات المختلفة.<\/p><\/div><p><b>التنسيق أثناء الأزمة:<\/b> وينقسم إلى نوعين (الرأسي / الأفقي):<\/p><h4>التنسيق الرأسي<\/h4><p>هو التنسيق الذي يتم بين المستويات الإدارية المختلفة، بدءاً من القيادة الوطنية، مروراً بالوزارات والمحافظات، وصولاً إلى فرق الاستجابة الميدانية.<\/p><p>ويعمل في اتجاهين:<\/p><p><b>من أعلى إلى أسفل:<\/b> نقل القرارات والتعليمات، وتحديد الأولويات، وتوفير الموارد.<\/p><p><b>من أسفل إلى أعلى:<\/b> رفع بيانات الموقف الميداني، والاحتياجات، والخسائر، والتحديات إلى متخذي القرار.<\/p><p>وتتمثل أهميته في:<\/p><ul><li>ضمان تنفيذ القرارات الوطنية على المستوى المحلي.<\/li><li>نقل صورة حقيقية ومحدثة عن الموقف إلى القيادة.<\/li><li>تسريع طلب الموارد والدعم الإضافي.<\/li><li>منع انقطاع الاتصال بين القيادة وفرق الميدان.<\/li><li>تعديل القرارات وفق تطورات الأزمة.<\/li><li>ضمان وضوح التسلسل القيادي ومسارات رفع التقارير.<\/li><\/ul><p><b>مثال:<\/b> ترسل القيادة الوطنية توجيهاً بإخلاء منطقة معرضة للسيول، فتقوم المحافظة بتنفيذ القرار من خلال الشرطة والحماية المدنية، ثم ترفع تقريراً عن أعداد السكان الذين تم إجلاؤهم والاحتياجات المتبقية.<\/p><h4>التنسيق الأفقي<\/h4><p>هو التنسيق بين الجهات التي تعمل على المستوى الإداري نفسه، مثل التنسيق بين الصحة والشرطة والحماية المدنية والنقل والكهرباء داخل المحافظة الواحدة.<\/p><p>وتتمثل أهميته في:<\/p><ul><li>تحقيق التكامل بين تخصصات الجهات المختلفة.<\/li><li>تبادل المعلومات والموارد بسرعة.<\/li><li>منع تكرار المهام أو تعارض الإجراءات.<\/li><li>تحديد مسؤولية كل جهة داخل موقع الأزمة.<\/li><li>تنسيق توقيت وترتيب العمليات الميدانية.<\/li><li>تكوين صورة مشتركة للموقف.<\/li><li>معالجة المشكلات التي تتطلب تدخل أكثر من جهة.<\/li><\/ul><p><b>مثال:<\/b> أثناء إخلاء مستشفى بسبب السيول، تنسق وزارة الصحة عملية نقل المرضى، وتؤمن الشرطة الطرق، وتوفر وزارة النقل المركبات، وتفصل شركة الكهرباء التيار عن المناطق الخطرة، بينما تتولى الحماية المدنية عمليات الإنقاذ.<\/p><h4>الفرق بين التنسيق الرأسي والأفقي<\/h4><table><thead><tr><th>العنصر<\/th><th>التنسيق الأفقي<\/th><th>التنسيق الرأسي<\/th><\/tr><\/thead><tbody><tr><td>طبيعة التنسيق<\/td><td>بين جهات تعمل على المستوى نفسه<\/td><td>بين مستويات إدارية وقيادية مختلفة<\/td><\/tr><tr><td>مسار الاتصال<\/td><td>بين الجهات النظيرة بصورة مباشرة<\/td><td>من القيادة إلى الميدان والعكس<\/td><\/tr><tr><td>الغرض الرئيسي<\/td><td>تكامل المهام وتوحيد الجهود بين الجهات<\/td><td>نقل القرارات للأدنى والمعلومات للأعلى<\/td><\/tr><tr><td>مثال<\/td><td>التنسيق بين الصحة والشرطة والحماية المدنية والنقل<\/td><td>التنسيق بين مجلس الوزراء والمحافظة وفرق الميدان<\/td><\/tr><tr><td>النتيجة المطلوبة<\/td><td>منع التعارض والازدواجية وتحقيق التكامل<\/td><td>وضوح القيادة وسرعة رفع الاحتياجات<\/td><\/tr><\/tbody><\/table><p>وبالتالي، فإن فعالية إدارة الأزمة تعتمد على المعادلة التالية:<\/p><div class=\"note\"><p><b>قيادة موحدة + تنسيق رأسي فعال + تنسيق أفقي متكامل = استجابة سريعة ومنظمة وفعالة<\/b><\/p><\/div> <h3>رابعاً: التمييز بين أدوار المؤسسات المختلفة أثناء الأزمات<\/h3><table><thead><tr><th>نوع الدور<\/th><th>الجهات المعنية عادةً<\/th><th>المسؤولية الرئيسية<\/th><\/tr><\/thead><tbody><tr><td>القيادة الاستراتيجية<\/td><td>القيادة السياسية ومجلس الوزراء<\/td><td>تحديد الأولويات الوطنية، واتخاذ القرارات السيادية، واعتماد الموارد والسياسات العامة<\/td><\/tr><tr><td>التنسيق وإدارة الموقف<\/td><td>المركز الوطني وغرف إدارة الأزمات<\/td><td>تجميع المعلومات، وإعداد صورة موحدة للموقف، وتنسيق الجهات، ومتابعة تنفيذ القرارات<\/td><\/tr><tr><td>القيادة القطاعية<\/td><td>الوزارة أو الهيئة المختصة بنوع الأزمة<\/td><td>قيادة الاستجابة الفنية وفق طبيعة الأزمة؛ مثل قيادة وزارة الصحة للاستجابة الوبائية<\/td><\/tr><tr><td>التنفيذ الميداني<\/td><td>الحماية المدنية، الشرطة، الإسعاف والقوات المسلحة عند الحاجة<\/td><td>تنفيذ عمليات الإنقاذ والإخلاء والتأمين والتدخل المباشر<\/td><\/tr><tr><td>توفير الخدمات الحيوية<\/td><td>الصحة، الكهرباء، المياه، النقل والاتصالات<\/td><td>ضمان استمرارية الخدمات الأساسية وإصلاح الأعطال وإيجاد البدائل المؤقتة<\/td><\/tr><tr><td>الدعم اللوجستي والاقتصادي<\/td><td>المؤسسات الاقتصادية والقطاع الخاص<\/td><td>توفير التمويل والمعدات والسلع والنقل والتخزين وسلاسل الإمداد<\/td><\/tr><tr><td>إدارة الاتصال العام<\/td><td>المتحدث الرسمي ووسائل الإعلام<\/td><td>نشر المعلومات والتعليمات الرسمية وتوعية المواطنين، ومواجهة الشائعات<\/td><\/tr><tr><td>الدعم المجتمعي والإنساني<\/td><td>المجتمع المدني والجمعيات والمتطوعون<\/td><td>تقديم الإغاثة، ودعم الفئات الأكثر احتياجاً، والمساهمة في التعافي المجتمعي<\/td><\/tr><tr><td>التنسيق المحلي<\/td><td>المحافظات والإدارة المحلية<\/td><td>إدارة الموقف داخل النطاق الجغرافي، وتنسيق الجهات وحصر الأضرار والاحتياجات<\/td><\/tr><\/tbody><\/table><h4>كيف نميز بين مسؤوليات الجهات؟<\/h4><p>يتم تحديد دور كل مؤسسة وفق مجموعة من المعايير:<\/p><ul><li>1 - الاختصاص القانوني: ما المسؤوليات والصلاحيات التي يمنحها القانون للجهة؟<\/li><li>2 - طبيعة الأزمة: ما الجهة الأكثر ارتباطاً بنوع الخطر؟<\/li><li>3 - المستوى الإداري: هل تعمل الجهة وطنياً أم محلياً أم ميدانياً؟<\/li><li>4 - القدرات المتاحة: ما الموارد والخبرات والمعدات التي تمتلكها؟<\/li><li>5 - مرحلة الأزمة: هل يتركز دورها في الوقاية أم الاستجابة أم التعافي؟<\/li><li>6 - نطاق المسؤولية: هل تقود المهمة أم تنفذها أم تقدم الدعم والمعلومات؟<\/li><\/ul><h4>الجهة القائدة تختلف حسب نوع الأزمة<\/h4><p>لا توجد جهة واحدة تقود جميع أنواع الأزمات؛ بل تتغير الجهة القائدة وفق طبيعة الموقف.<\/p><ul><li>في الأوبئة والأزمات الصحية تكون وزارة الصحة الجهة الفنية القائدة.<\/li><li>في الحرائق والانهيارات تقود الحماية المدنية العمليات الميدانية.<\/li><li>في الأزمات الأمنية تتولى المؤسسات الأمنية الدور الرئيسي.<\/li><li>في انقطاع الكهرباء واسع النطاق تقود مؤسسة أو وزارة الطاقة الاستجابة الفنية.<\/li><li>في تلوث المياه تقود مؤسسات المياه والصحة والبيئة الاستجابة المشتركة.<\/li><li>في الكوارث واسعة النطاق تتولى القيادة الوطنية إدارة الموقف مع مشاركة جميع القطاعات المعنية.<\/li><\/ul><h4>تحديد المسؤوليات باستخدام مصفوفة RACI CHART<\/h4><p>يمكن استخدام مصفوفة توزيع المسؤوليات لتحديد دور كل مؤسسة في كل مهمة:<\/p><ul><li><b>Responsible:<\/b> الجهة المنفذة، وتنفذ المهمة فعلياً.<\/li><li><b>Accountable:<\/b> الجهة المسؤولة نهائياً، وتعتمد القرار وتتحمل المسؤولية النهائية.<\/li><li><b>Consulted:<\/b> الجهة الاستشارية، وتقدم الرأي الفني والمعلومات قبل اتخاذ القرار.<\/li><li><b>Informed:<\/b> الجهة التي يجب إبلاغها، ويتم إخطارها بالقرارات والنتائج.<\/li><\/ul><p><b>مثال:<\/b> إخلاء منطقة معرضة للسيول.<\/p><ul><li><b>المحافظة:<\/b> مسؤولة نهائياً عن تنفيذ قرار الإخلاء.<\/li><li><b>الشرطة والحماية المدنية:<\/b> تنفذان الإخلاء ميدانياً.<\/li><li><b>الأرصاد والجهات الفنية:<\/b> تقدم المعلومات والاستشارات.<\/li><li><b>الصحة والنقل والإعلام:<\/b> يتم التنسيق معها وإبلاغها لتقديم الدعم.<\/li><\/ul><p><b>القاعدة الأساسية:<\/b><\/p><div class=\"note\"><p>لكل مهمة جهة قائدة واحدة واضحة، ويمكن أن تشارك جهات متعددة في التنفيذ والدعم، ولكن دون تعدد في المسؤولية النهائية أو تضارب مصادر القرار.<\/p><\/div> <h3>خامساً: فهم دور غرف ومراكز عمليات إدارة الأزمات<\/h3><div class=\"note\"><p>تُعد غرف ومراكز عمليات إدارة الأزمة العقل التنسيقي للمنظومة الوطنية: فهي المكان الذي تُجمع فيه المعلومات، وتُحلل تطورات الموقف، وتُنسق جهود الجهات المختلفة، وتُرفع التوصيات إلى القيادة، ثم تتابع القرارات حتى تُنفذ، ولا يعني وجود غرفة العمليات أنها تحل محل الوزارات أو الجهات التنفيذية، بل تعمل على توحيد الصورة العامة، وربط الجهات، ودعم اتخاذ القرار، ومتابعة التنفيذ.<\/p><\/div><h4>الأدوار الرئيسية لغرف ومراكز العمليات<\/h4><h4>1 - الرصد والإنذار المبكر<\/h4><p>تتابع المؤشرات التي قد تدل على اقتراب أزمة أو تصاعدها، من خلال:<\/p><ul><li>أنظمة المراقبة والإنذار المبكر.<\/li><li>تقارير الوزارات والمحافظات.<\/li><li>البلاغات الواردة من المواطنين.<\/li><li>بيانات الطقس والبيئة والصحة والأمن.<\/li><li>وسائل الإعلام والمنصات الرقمية.<\/li><li>التقارير الصادرة عن فرق الميدان.<\/li><\/ul><p>والهدف هو اكتشاف الخطر في وقت مبكر ومنح الجهات المعنية وقتاً كافياً للاستعداد.<\/p><h4>2 - جمع المعلومات والتحقق منها<\/h4><p>تستقبل غرفة العمليات البيانات من المصادر المختلفة، ثم تتحقق من:<\/p><ul><li>مصدر المعلومة.<\/li><li>دقتها وتوقيت ورودها.<\/li><li>درجة خطورتها واستعجالها.<\/li><li>توافقها مع المعلومات الواردة من مصادر أخرى.<\/li><li>تأثيرها المحتمل على السكان والخدمات والمنشآت.<\/li><\/ul><p>ويمنع ذلك اتخاذ قرارات بناء على شائعات أو بيانات غير مكتملة.<\/p><h4>3 - إعداد صورة تشغيلية موحدة<\/h4><p>تقوم غرفة العمليات بدمج المعلومات الواردة من الجهات المختلفة في صورة واحدة ومحدثة للموقف تشمل:<\/p><ul><li>طبيعة الأزمة وموقعها.<\/li><li>المناطق والفئات المتضررة.<\/li><li>أعداد الإصابات والوفيات والمفقودين.<\/li><li>حجم الأضرار.<\/li><li>الخدمات المتوقفة.<\/li><li>الموارد المتاحة والمطلوبة.<\/li><li>العمليات الجارية.<\/li><li>المخاطر المتوقعة خلال الساعات أو الأيام التالية.<\/li><\/ul><p>وتساعد هذه الصورة جميع الجهات على العمل بناءً على معلومات موحدة.<\/p><h4>4 - تحليل الموقف وتوقع تطور الأزمة<\/h4><p>لا تكتفي غرفة العمليات بعرض البيانات، بل تعمل على تحليلها للإجابة عن أسئلة مثل:<\/p><ul><li>ما حجم الأزمة الحالي؟<\/li><li>هل الأزمة مستقرة أم تتصاعد؟<\/li><li>ما المناطق المتوقع أن تتأثر لاحقاً؟<\/li><li>ما أسوأ السيناريوهات المحتملة؟<\/li><li>ما الموارد الإضافية المطلوبة؟<\/li><li>ما القرارات التي يجب اتخاذها فوراً؟<\/li><\/ul><p>ثم ترفع بدائل وتوصيات واضحة إلى صاحب السلطة في اتخاذ القرار.<\/p><h4>5 - دعم اتخاذ القرار<\/h4><p>تقدم غرفة العمليات للقيادة معلومات مختصرة ودقيقة تساعدها على اتخاذ القرار، مثل:<\/p><ul><li>تحديد أولويات عمليات الإنقاذ.<\/li><li>إخلاء منطقة معينة.<\/li><li>إعلان حالة الطوارئ.<\/li><li>إغلاق الطرق أو المنشآت.<\/li><li>تحريك موارد إضافية.<\/li><li>طلب دعم القوات المسلحة أو القطاع الخاص.<\/li><li>إصدار تحذير رسمي للمواطنين.<\/li><\/ul><div class=\"note\"><p>غرفة العمليات تدعم القرار ولا تتجاوز الصلاحيات القانونية للقيادة المختصة.<\/p><\/div><h4>6 - تنسيق الجهات المشاركة<\/h4><p>تجمع غرفة العمليات ممثلين أو ضباط اتصال من الجهات المعنية، مثل:<\/p><ul><li>الشرطة والحماية المدنية.<\/li><li>الصحة والإسعاف.<\/li><li>القوات المسلحة عند الحاجة.<\/li><li>النقل والطاقة والمياه والاتصالات.<\/li><li>المحافظات والإدارة المحلية.<\/li><li>الإعلام والقطاع الخاص والمجتمع المدني.<\/li><\/ul><p>ويهدف ذلك إلى منع تعارض القرارات، وتحديد مسؤولية كل جهة، وضمان تكامل العمليات.<\/p><h4>7 - إدارة الموارد والاحتياجات<\/h4><p>تتابع غرفة العمليات الموارد المتاحة والمستخدمة والمطلوبة، مثل:<\/p><ul><li>فرق الإنقاذ والإسعاف.<\/li><li>المركبات والمعدات الثقيلة.<\/li><li>الأسرّة والمستلزمات الطبية.<\/li><li>المواد الغذائية ومياه الشرب.<\/li><li>الوقود والمولدات الكهربائية.<\/li><li>مراكز الإيواء.<\/li><li>وسائل النقل والاتصالات.<\/li><\/ul><p>كما تحدد أماكن العجز، وتعيد توجيه الموارد وفق الأولويات.<\/p><h4>8 - إصدار التكليفات ومتابعة التنفيذ<\/h4><p>بعد اعتماد القرارات، تتولى غرفة العمليات:<\/p><ul><li>تحويل القرارات إلى مهام واضحة.<\/li><li>تحديد الجهة المسؤولة عن كل مهمة.<\/li><li>تحديد وقت التنفيذ.<\/li><li>متابعة نسبة الإنجاز.<\/li><li>تسجيل المعوقات.<\/li><li>تصعيد المشكلات التي تحتاج إلى تدخل القيادة.<\/li><li>التأكد من إغلاق المهام بعد تنفيذها.<\/li><\/ul><p>وبذلك لا يظل القرار مجرد توجيه، بل يتحول إلى إجراء قابل للمتابعة والقياس.<\/p><h4>9 - تنسيق الاتصال والإعلام<\/h4><p>تضمن غرفة العمليات أن تكون الرسائل الرسمية متوافقة مع حقيقة الموقف، من خلال:<\/p><ul><li>إعداد البيانات الرسمية.<\/li><li>تحديد المعلومات التي يمكن نشرها.<\/li><li>نشر تعليمات السلامة والإخلاء.<\/li><li>تحديث الجمهور بصورة منتظمة.<\/li><li>الرد على الشائعات والمعلومات المضللة.<\/li><li>توحيد الرسائل بين الجهات والمتحدثين الرسميين.<\/li><li>حماية المعلومات السرية أو الحساسة.<\/li><\/ul><h4>10 - توثيق الأزمة واستخلاص الدروس<\/h4><p>تسجل غرفة العمليات جميع المعلومات والإجراءات، بما يشمل:<\/p><ul><li>وقت وقوع الأحداث.<\/li><li>التقارير والمعلومات الواردة.<\/li><li>القرارات التي تم اتخاذها.<\/li><li>الجهات التي نُفذت من خلالها المهام.<\/li><li>الموارد المستخدمة.<\/li><li>النتائج والمعوقات.<\/li><li>التغييرات التي طرأت على الموقف.<\/li><\/ul><p>ويُستخدم هذا السجل بعد الأزمة لتقييم الأداء، وتحديد نقاط القوة والقصور، وتحديث الخطط المستقبلية، وبذلك تمثل غرفة العمليات حلقة الوصل بين القيادة ومتخذي القرار والجهات التنفيذية وفرق الاستجابة الميدانية.<\/p> <h3>سادساً: تحليل تدفق المعلومات أثناء الأزمات<\/h3><p>يقصد بتحليل تدفق المعلومات دراسة كيفية انتقال البيانات والمعلومات بين مصادرها الميدانية، وغرف العمليات، والجهات المختصة، والقيادة العليا، ثم تحويلها إلى قرارات وتعليمات قابلة للتنفيذ. ولا تقتصر العملية على نقل المعلومات فقط، بل تشمل جمعها، والتحقق منها، وتحليلها، وتحديد أهميتها، وتوجيهها إلى الجهة المناسبة في الوقت المناسب.<\/p><h4>أهمية تدفق المعلومات<\/h4><p>يساعد التدفق الفعال للمعلومات على:<\/p><ul><li>تكوين صورة دقيقة ومشتركة عن الأزمة.<\/li><li>دعم القيادة في اتخاذ قرارات سريعة ومدروسة.<\/li><li>تحديد المناطق والفئات الأكثر تضرراً.<\/li><li>توجيه الموارد والإمكانات وفق الأولويات.<\/li><li>تنسيق جهود الجهات المشاركة.<\/li><li>اكتشاف التغيرات والمخاطر الجديدة.<\/li><li>منع تضارب التقارير والقرارات.<\/li><li>مواجهة الشائعات والمعلومات المضللة.<\/li><li>متابعة تنفيذ القرارات وقياس نتائجها.<\/li><\/ul><h4>دورة تدفق المعلومات أثناء الأزمة<\/h4><table><thead><tr><th>م<\/th><th>المرحلة<\/th><th>الإجراءات الرئيسية<\/th><th>المخرجات<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>جمع المعلومات<\/td><td>الحصول على البيانات من فرق الميدان، والوزارات، والمحافظات، وأجهزة الإنذار، والمواطنين، ووسائل الإعلام<\/td><td>بيانات أولية عن الحادث والأضرار والاحتياجات<\/td><\/tr><tr><td>2<\/td><td>التحقق من المعلومات<\/td><td>مقارنة المعلومات الواردة من عدة مصادر، واستبعاد الأخبار غير المؤكدة أو المتضاربة<\/td><td>معلومات موثوقة وقابلة للاستخدام<\/td><\/tr><tr><td>3<\/td><td>التصنيف وتحديد الأولويات<\/td><td>تصنيف المعلومات حسب الخطورة، والموقع، والقطاع، ودرجة الاستعجال<\/td><td>تحديد المعلومات الحرجة والعاجلة<\/td><\/tr><tr><td>4<\/td><td>التحليل والتقييم<\/td><td>دراسة حجم الأزمة، وتوقع تطورها، وتحديد المخاطر والاحتياجات والبدائل<\/td><td>تقدير واضح للموقف والسيناريوهات المحتملة<\/td><\/tr><tr><td>5<\/td><td>رفع الموقف إلى القيادة<\/td><td>إعداد تقارير مختصرة ولوحات متابعة تتضمن الحقائق والاحتياجات والتوصيات<\/td><td>صورة تشغيلية موحدة تدعم اتخاذ القرار<\/td><\/tr><tr><td>6<\/td><td>اتخاذ القرار<\/td><td>اختيار الإجراء المناسب، وتحديد الأولويات والمسؤوليات والموارد<\/td><td>قرارات وتوجيهات معتمدة<\/td><\/tr><tr><td>7<\/td><td>نشر القرارات والتعليمات<\/td><td>إرسال القرارات إلى الجهات التنفيذية وفرق الميدان، ونشر التعليمات اللازمة للجمهور<\/td><td>مهام واضحة وإجراءات قابلة للتنفيذ<\/td><\/tr><tr><td>8<\/td><td>المتابعة والتغذية الراجعة<\/td><td>متابعة التنفيذ، وقياس النتائج، وتحديث المعلومات باستمرار<\/td><td>تعديل القرارات وفق تطورات الأزمة<\/td><\/tr><\/tbody><\/table><h4>اتجاهات تدفق المعلومات<\/h4><h4>1 - التدفق الرأسي الصاعد<\/h4><p>تنتقل المعلومات من فرق الاستجابة الميدانية إلى الإدارات المحلية، ثم إلى غرف العمليات والقيادة العليا.<\/p><p><b>الغرض منه:<\/b><\/p><ul><li>رفع بيانات الموقف الفعلي.<\/li><li>توضيح حجم الأضرار والخسائر.<\/li><li>طلب الموارد والدعم.<\/li><li>الإبلاغ عن التحديات والاحتياجات العاجلة.<\/li><\/ul><p><b>مثال:<\/b> يرفع فريق الإنقاذ تقريراً إلى غرفة العمليات بعدد المحاصرين والمعدات الإضافية المطلوبة.<\/p><h4>2 - التدفق الرأسي الهابط<\/h4><p>تنتقل القرارات والتوجيهات من القيادة العليا إلى الوزارات والمحافظات والجهات التنفيذية وفرق الميدان.<\/p><p><b>الغرض منه:<\/b><\/p><ul><li>نقل القرارات الرسمية.<\/li><li>تحديد الأولويات والمهام.<\/li><li>تخصيص الموارد.<\/li><li>توضيح الصلاحيات ومسؤولية كل جهة.<\/li><\/ul><p><b>مثال:<\/b> تصدر القيادة قراراً بإخلاء منطقة محددة، ثم تقوم المحافظة والشرطة والحماية المدنية بتنفيذه.<\/p><h4>3 - التدفق الأفقي<\/h4><p>يتم تبادل المعلومات بين المؤسسات العاملة على المستوى نفسه، مثل الصحة والشرطة والحماية المدنية والنقل والطاقة.<\/p><p><b>الغرض منه:<\/b><\/p><ul><li>تنسيق العمليات المشتركة.<\/li><li>تبادل البيانات والموارد.<\/li><li>منع تعارض الإجراءات.<\/li><li>تكوين صورة مشتركة للموقف.<\/li><\/ul><p><b>مثال:<\/b> تبلغ الحماية المدنية وزارة الصحة بعدد المصابين المتوقع، حتى تستعد المستشفيات لاستقبالهم.<\/p><h4>4 - التدفق الخارجي مع الجمهور<\/h4><p>يشمل المعلومات التي تنتقل من الجهات الرسمية إلى المواطنين، والمعلومات التي يرسلها المواطنون إلى الجهات المختصة.<\/p><p><b>من الجهات الرسمية إلى الجمهور:<\/b><\/p><ul><li>التحذيرات المبكرة.<\/li><li>تعليمات السلامة والإخلاء.<\/li><li>تحديد الطرق المغلقة ومراكز الإيواء.<\/li><li>تحديثات الموقف الرسمية.<\/li><\/ul><p><b>من الجمهور إلى الجهات الرسمية:<\/b><\/p><ul><li>بلاغات الحوادث.<\/li><li>طلبات الإنقاذ والمساعدة.<\/li><li>المعلومات المتعلقة بالمفقودين أو الأضرار.<\/li><li>الملاحظات حول وصول الخدمات والمساعدات.<\/li><\/ul><h4>خصائص المعلومات الفعالة<\/h4><p>يجب أن تتصف المعلومات المستخدمة أثناء الأزمة بما يلي:<\/p><ul><li><b>الدقة:<\/b> أن تكون صحيحة ومتحققاً منها.<\/li><li><b>السرعة:<\/b> أن تصل قبل أن تفقد قيمتها.<\/li><li><b>الوضوح:<\/b> أن تكون مفهومة وغير قابلة للتفسير المتعارض.<\/li><li><b>الملاءمة:<\/b> أن ترتبط باحتياجات القرار.<\/li><li><b>الاكتمال:<\/b> أن تتضمن العناصر الأساسية للموقف.<\/li><li><b>التحديث المستمر:<\/b> أن تعكس أحدث تطورات الأزمة.<\/li><li><b>الأمن والسرية:<\/b> أن تُحمى المعلومات الحساسة من التسريب أو التلاعب.<\/li><li><b>إمكانية التتبع:<\/b> أن يكون مصدر المعلومات وتوقيت ورودها معروفين.<\/li><\/ul><h4>تحديات تدفق المعلومات<\/h4><ul><li>تأخر وصول التقارير الميدانية.<\/li><li>ورود معلومات متضاربة من جهات مختلفة.<\/li><li>الاعتماد على مصادر غير موثوقة.<\/li><li>كثرة البيانات دون تحديد أولويات.<\/li><li>ضعف التنسيق بين قواعد البيانات والأنظمة.<\/li><li>تعطل شبكات الكهرباء أو الاتصالات.<\/li><li>احتفاظ بعض الجهات بالمعلومات وعدم مشاركتها.<\/li><li>انتشار الشائعات أسرع من البيانات الرسمية.<\/li><li>صدور تعليمات متعددة أو متعارضة.<\/li><\/ul><div class=\"note\"><p>كلما كانت المعلومات أدق وأسرع وأكثر تنظيماً، كانت القرارات أفضل، والاستجابة أكثر كفاءة، والخسائر أقل.<\/p><\/div> <h3>سابعاً: دور القوات المسلحة في إدارة الأزمات<\/h3><h4>مجالات مساهمة القوات المسلحة<\/h4><h4>1 - الإسناد اللوجستي<\/h4><p>يعني توفير الاحتياجات والموارد الضرورية لتمكين فرق الاستجابة من أداء مهامها.<\/p><p><b>وقد يشمل:<\/b><\/p><ul><li>توفير المعدات والآليات.<\/li><li>نقل وتخزين المواد الإغاثية.<\/li><li>إنشاء المعسكرات ومراكز الإيواء.<\/li><li>توفير الوقود والمولدات.<\/li><li>تجهيز المطابخ والمرافق الميدانية.<\/li><li>توصيل الإمدادات إلى المناطق المعزولة.<\/li><\/ul><p><b>مثال:<\/b> نقل الغذاء والمياه والخيام إلى منطقة تضررت من السيول وتعذر وصول المركبات المدنية إليها.<\/p><h4>2 - النقل<\/h4><p>تمتلك القوات المسلحة وسائل نقل برية وبحرية وجوية يمكن استخدامها في الظروف الاستثنائية.<\/p><p><b>وقد يشمل دورها:<\/b><\/p><ul><li>نقل فرق الإنقاذ والمعدات.<\/li><li>نقل المساعدات والإمدادات.<\/li><li>الوصول إلى المناطق النائية أو المعزولة.<\/li><li>نقل المصابين إلى المستشفيات.<\/li><li>استخدام الطائرات أو السفن عند تعطل وسائل النقل المعتادة.<\/li><\/ul><h4>3 - الإخلاء<\/h4><p>تساهم القوات المسلحة في إخلاء السكان من المناطق الخطرة، خاصةً عندما تكون الأعداد كبيرة أو يصعب الوصول إلى المنطقة.<\/p><p><b>وقد يشمل ذلك:<\/b><\/p><ul><li>توفير المركبات والطائرات ووسائل النقل.<\/li><li>نقل السكان إلى مناطق آمنة.<\/li><li>إجلاء المصابين وكبار السن والفئات الأكثر احتياجاً.<\/li><li>دعم تنظيم مسارات الإخلاء.<\/li><li>المساعدة في تجهيز مواقع الاستقبال والإيواء.<\/li><\/ul><p>ويتم الإخلاء بالتنسيق مع الشرطة والحماية المدنية والمحافظات والقطاع الصحي.<\/p><h4>4 - الدعم الطبي<\/h4><p>يمكن للخدمات الطبية العسكرية دعم القطاع الصحي عندما تتجاوز أعداد المصابين القدرة الاستيعابية للمستشفيات المدنية.<\/p><p><b>وقد يشمل الدعم:<\/b><\/p><ul><li>إنشاء مستشفيات وعيادات ميدانية.<\/li><li>توفير فرق طبية وتمريضية.<\/li><li>تقديم الإسعافات والرعاية الطارئة.<\/li><li>نقل المصابين بواسطة سيارات أو طائرات الإسعاف.<\/li><li>توفير الأدوية والمستلزمات الطبية.<\/li><\/ul><div class=\"note\"><p>ولا يحل الدعم الطبي العسكري محل النظام الصحي المدني، بل يزيد قدرته على التعامل مع الضغط الاستثنائي.<\/p><\/div><h4>5 - الدعم الهندسي<\/h4><p>تتميز القوات المسلحة بقدرات هندسية يمكن استخدامها لإزالة العوائق وإعادة فتح المناطق المتضررة.<\/p><p><b>وقد يشمل ذلك:<\/b><\/p><ul><li>إزالة الأنقاض.<\/li><li>فتح الطرق المغلقة.<\/li><li>إقامة الجسور والطرق المؤقتة.<\/li><li>تدعيم المنشآت المهددة.<\/li><li>إنشاء مراكز الإيواء والمستشفيات الميدانية.<\/li><li>إصلاح بعض المرافق بصورة عاجلة.<\/li><li>التعامل مع الأجسام الخطرة أو المتفجرات بواسطة الفرق المتخصصة.<\/li><\/ul><h4>6 - البحث والإنقاذ<\/h4><p>تشارك الفرق العسكرية المتخصصة في البحث عن المفقودين وإنقاذ المحاصرين، وخصوصاً في البيئات الخطرة أو التي يصعب الوصول إليها.<\/p><p><b>وقد يشمل ذلك:<\/b><\/p><ul><li>البحث تحت الأنقاض.<\/li><li>الإنقاذ الجوي أو البحري.<\/li><li>الوصول إلى المناطق الجبلية أو الصحراوية.<\/li><li>استخدام الطائرات والمركبات المتخصصة.<\/li><li>دعم فرق الحماية المدنية بالخبرات والمعدات.<\/li><li>تحديد مواقع المفقودين باستخدام الوسائل التقنية.<\/li><\/ul><h4>7 - دعم عمليات الإغاثة<\/h4><p>تساعد القوات المسلحة الجهات الحكومية والمنظمات الإنسانية في توصيل المساعدات إلى المتضررين.<\/p><p><b>وقد يشمل دورها:<\/b><\/p><ul><li>نقل وتوزيع المواد الغذائية ومياه الشرب.<\/li><li>إقامة مراكز الإيواء.<\/li><li>تنظيم عمليات الاستقبال والتوزيع.<\/li><li>توفير المعدات ووسائل النقل.<\/li><li>الوصول إلى المناطق المعزولة.<\/li><li>دعم استمرارية سلاسل الإمداد.<\/li><\/ul><div class=\"note\"><p>ويجب أن يتم توزيع المساعدات بناءً على تقييم الاحتياجات وبالتنسيق مع الجهات المدنية، لضمان وصولها إلى الفئات الأكثر تضرراً.<\/p><\/div><h4>8 - تأمين المنشآت الحيوية عند التكليف<\/h4><p>قد تُكلَّف القوات المسلحة بحماية بعض المنشآت الحيوية عند وجود تهديد كبير أو حاجة أمنية استثنائية.<\/p><p><b>ومن أمثلة هذه المنشآت:<\/b><\/p><ul><li>محطات الكهرباء والطاقة.<\/li><li>محطات المياه.<\/li><li>المطارات والموانئ.<\/li><li>مراكز الاتصالات.<\/li><li>المستشفيات الرئيسية.<\/li><li>المخازن الاستراتيجية.<\/li><li>المنشآت الحكومية المهمة.<\/li><\/ul><div class=\"note\"><p>ويهدف التأمين إلى منع التخريب، وضمان استمرار الخدمات، وحماية العاملين والمعدات.<\/p><\/div> <h3>ثامناً: التعاون الدولي في الأزمات<\/h3><h4>1 - لماذا تحتاج الدول إلى التعاون الدولي؟<\/h4><p>تحتاج الدول إلى التعاون الدولي لأن بعض الأزمات تتجاوز الحدود الوطنية، ولا تستطيع دولة واحدة منعها أو إدارة آثارها بمفردها.<\/p><ul><li><b>الأوبئة:<\/b> تنتقل الأمراض بين الدول بسرعة؛ لذلك يتطلب احتواؤها تبادل المعلومات الصحية، وتنسيق إجراءات الوقاية والعلاج.<\/li><li><b>تغير المناخ:<\/b> توثر الانبعاثات والظواهر المناخية في العالم كله، مما يستلزم التزام الدول بخطط مشتركة للحد من الآثار المناخية.<\/li><li><b>الإرهاب العابر للحدود:<\/b> قد تعمل الجماعات الإرهابية في عدة دول؛ لذلك تتطلب مواجهتها تبادل المعلومات والتنسيق الأمني.<\/li><li><b>الهجرة غير الشرعية:<\/b> تمر عمليات الهجرة عبر أكثر من دولة، مما يستدعي التعاون لحماية الحدود ومكافحة شبكات التهريب ومعالجة أسباب الهجرة.<\/li><li><b>الجريمة المنظمة:<\/b> تعمل شبكات تهريب المخدرات والأسلحة والأموال عبر الحدود؛ لذلك تحتاج مكافحتها إلى تعاون أمني وقضائي بين الدول.<\/li><li><b>الكوارث الطبيعية:<\/b> قد تفوق الكارثة قدرات الدولة المتضررة، فتحتاج إلى مساعدات دولية وفرق إنقاذ وإمدادات وخبرات متخصصة.<\/li><li><b>أزمات الطاقة:<\/b> تعتمد الدول على بعضها في إنتاج ونقل واستيراد الطاقة، ولذلك يتطلب نقص الإمدادات تنسيقاً لضمان استمرارها واستقرار الأسواق.<\/li><li><b>أزمات الغذاء:<\/b> تتأثر إمدادات الغذاء بالإنتاج والتجارة والنقل الدولي، مما يجعل التعاون ضرورياً لتوفير الاحتياجات ومنع النقص الحاد.<\/li><li><b>الأمن السيبراني:<\/b> يمكن أن تنفذ الهجمات الإلكترونية من أي دولة وتستهدف عدة دول في الوقت نفسه، لذلك تتطلب مواجهتها تبادل التحذيرات والخبرات التقنية.<\/li><li><b>اضطراب سلاسل الإمداد:<\/b> تعتمد عمليات الإنتاج والتجارة على موردين ووسائل نقل موزعة بين دول متعددة، ولذلك يحتاج استقرارها إلى التنسيق وتوفير بدائل مشتركة.<\/li><\/ul><h4>2 - مستويات التعاون في مواجهة الأزمات<\/h4><p>يمكن تقسيم التعاون بين الدول والمؤسسات في مواجهة الأزمات إلى أربعة مستويات، وفقاً لعدد الجهات المشاركة ونطاق الأزمة وطبيعة التنسيق المطلوب.<\/p><h4>المستوى الأول: التعاون الثنائي<\/h4><p>هو تعاون مباشر بين دولتين لمواجهة أزمة أو خطر مشترك، ويتم وفق اتفاق أو تنسيق محدد بينهما.<\/p><p><b>ويشمل:<\/b><\/p><ul><li>تبادل المعلومات.<\/li><li>مشاركة البيانات والتحذيرات المتعلقة بالأزمة.<\/li><li>المساعدة الطبية.<\/li><li>توفير الأدوية والمستلزمات والفرق الطبية.<\/li><li>الإغاثة.<\/li><li>إرسال الغذاء والمياه والمعدات والمساعدات العاجلة.<\/li><li>تبادل الخبراء.<\/li><li>الاستفادة من التجارب والقدرات الفنية لكل دولة.<\/li><\/ul><h4>المستوى الثاني: التعاون الإقليمي<\/h4><p>هو تعاون مجموعة من الدول الموجودة داخل منطقة جغرافية واحدة، خاصةً عندما تتأثر الأزمة في أكثر من دولة داخل الإقليم.<\/p><p><b>ويشمل التعاون في:<\/b><\/p><ul><li><b>الأمن:<\/b> تنسيق الجهود لمواجهة التهديدات المشتركة.<\/li><li><b>الصحة:<\/b> تبادل المعلومات وتنسيق الإجراءات الصحية.<\/li><li><b>الكوارث:<\/b> مشاركة فرق الإنقاذ والإغاثة والموارد.<\/li><li><b>البيئة:<\/b> مواجهة المشكلات البيئية التي تمتد عبر الحدود.<\/li><li><b>الطاقة:<\/b> تنسيق الإمدادات وتقليل تأثير نقص الطاقة أو انقطاعها.<\/li><\/ul><h4>المستوى الثالث: التعاون الدولي<\/h4><p>يتم من خلال المنظمات والمؤسسات الدولية التي تنسق الجهود، وتقدم الدعم الفني أو المالي أو الإنساني للدول المتضررة.<\/p><p><b>ومن أبرز الجهات المشاركة:<\/b><\/p><ul><li><b>الأمم المتحدة:<\/b> تنسيق الاستجابة الدولية والمساعدات الإنسانية.<\/li><li><b>منظمة الصحة العالمية:<\/b> تقديم التوجيه والدعم في الأزمات الصحية.<\/li><li><b>البنك الدولي:<\/b> دعم التعافي وإعادة الإعمار وتمويل المشروعات.<\/li><li><b>المؤسسات الإنسانية الدولية:<\/b> تقديم الإغاثة والخدمات للمتضررين.<\/li><\/ul><h4>المستوى الرابع: التعاون متعدد الأطراف<\/h4><p>هو مشاركة عدد كبير من الدول والمؤسسات في مواجهة أزمة مشتركة، من
