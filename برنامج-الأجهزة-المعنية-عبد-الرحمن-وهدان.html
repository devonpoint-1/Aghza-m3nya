<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>برنامج الأجهزة المعنية في الدولة</title><style>
:root{--navy:#102a43;--blue:#245477;--gold:#b9934f;--gold2:#7a5c1e;--bg:#f4f6f9;--surface:#fff;--ink:#1f2d3b;--line:#d9e1e8;--ok:#e8f5ed;--bad:#fdecea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.9 "Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
header{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;padding:18px 16px;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 0;color:#dbe7f1;font-size:15px}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;background:var(--navy)}
nav button{background:transparent;color:#fff;border:1px solid #ffffff44;border-radius:8px;padding:8px 12px;font:inherit;font-size:16px;cursor:pointer}
nav button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
main{max-width:920px;margin:0 auto;padding:18px 16px 60px}
h2{color:var(--navy);font-size:24px;border-bottom:2px solid var(--gold);padding-bottom:6px}
h3{color:var(--blue);font-size:19px;margin:18px 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-size:17px;cursor:pointer}
.btn.alt{background:#e9eef2;color:var(--navy);border:1px solid #cfd9e2}
.btn.gold{background:var(--gold);color:var(--navy)}
.q{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#fff}
.q p{margin:0 0 6px;font-weight:700}
.opt{display:block;padding:6px 8px;border-radius:8px;cursor:pointer}
.opt:hover{background:#f0f4f7}
.opt input{margin-left:8px}
.ok{background:var(--ok)}.bad{background:var(--bad)}
.exp{font-size:16px;color:#33475b;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.res{background:var(--ok);border:1px solid #c6e1cf;border-radius:10px;padding:12px;margin:12px 0;font-size:18px}
.res.low{background:var(--bad);border-color:#efc4bf}
textarea{width:100%;font:inherit;border:1px solid #ccd7e0;border-radius:8px;padding:8px;min-height:90px}
.muted{color:#6a7b8c;font-size:15px}
.note{background:#fbf8f1;border-right:4px solid var(--gold);padding:10px 12px;border-radius:8px;margin:10px 0}
table{width:100%;border-collapse:collapse;margin:8px 0}
th,td{border:1px solid var(--line);padding:7px;font-size:16px;vertical-align:top;text-align:right}
th{background:#edf2f6}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;background:#fff}
summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
@media print{nav,header,.no-print,.btn,textarea{display:none!important}body{background:#fff;font-size:15pt}main{max-width:none;padding:0}details{break-inside:avoid}h2{break-after:avoid}@page{size:A4;margin:16mm}}
@media (max-width:600px){body{font-size:17px}h2{font-size:21px}}
</style></head><body>
<header><h1>برنامج الأجهزة المعنية في الدولة</h1><p>إشراف اللواء دكتور / عبد الرحمن وهدان · المؤسسات والأجهزة المعنية بإدارة الأزمات والكوارث على المستوى الوطني</p></header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
var D = {"bank":[{"unit":1,"title":"","tf":[{"s":"إدارة الكوارث وفق المنظور المؤسسي هي رد فعل آني يعتمد على الاجتهادات الشخصية أثناء وقوع الحدث.","a":false,"fix":"إدارة الكوارث وفق المنظور المؤسسي منظومة مؤسسية مستدامة، وليست رد فعل آني يعتمد على الاجتهادات الشخصية أثناء وقوع الحدث.","quote":"إدارة الكوارث ليست رد فعل آني أو فوضوي يستند إلى الاجتهادات الشخصية أثناء وقوع الحدث، بل هي منظومة مؤسسية مستدامة تقوم على الآتي:","u":1},{"s":"يتضمن المنظور المؤسسي الاستمرارية، أي العمل الدائم قبل وأثناء وبعد الأزمة.","a":true,"fix":"","quote":"الاستمرارية: العمل الدائم قبل وأثناء وبعد الأزمة (وليس فقط عند وقوع الكارثة).","u":1},{"s":"يقتصر العمل في المنظور المؤسسي على الفترة التي تقع فيها الكارثة فقط.","a":false,"fix":"يقوم المنظور المؤسسي على الاستمرارية، أي العمل الدائم قبل وأثناء وبعد الأزمة وليس فقط عند وقوع الكارثة.","quote":"الاستمرارية: العمل الدائم قبل وأثناء وبعد الأزمة (وليس فقط عند وقوع الكارثة).","u":1},{"s":"تشمل مرحلة الوقاية والتخفيف الإجراءات الاستباقية للحد من الأسباب والمخاطر، مثل التشريعات وأكواد البناء والسدود.","a":true,"fix":"","quote":"الوقاية والتخفيف: الإجراءات الاستباقية للحد من الأسباب والمخاطر (مثل التشريعات، وأكواد البناء، والسدود).","u":1},{"s":"مرحلة الاستجابة تتمثل في إعداد خطط الطوارئ وإنشاء أنظمة الإنذار المبكر.","a":false,"fix":"مرحلة الاستعداد والجاهزية تتمثل في إعداد خطط الطوارئ وإنشاء أنظمة الإنذار المبكر وتدريب الكوادر تنفيذياً.","quote":"الاستعداد والجاهزية: إعداد خطط الطوارئ، وإنشاء أنظمة الإنذار المبكر، وتدريب الكوادر تنفيذياً.","u":1},{"s":"تشمل مرحلة الاستجابة تفعيل غرف العمليات والتدخل الميداني السريع فور وقوع الكارثة.","a":true,"fix":"","quote":"الاستجابة: تفعيل غرف العمليات والتدخل الميداني السريع فور وقوع الكارثة لإنقاذ الأرواح وتأمين الممتلكات.","u":1},{"s":"تعني مرحلة التعافي والتعمير تفعيل غرف العمليات والتدخل الميداني السريع فور وقوع الكارثة.","a":false,"fix":"تعني مرحلة التعافي والتعمير إغلاق الملف الميداني وإعادة بناء ما تم تدميره مع الاستفادة من الدروس المستفادة.","quote":"التعافي والتعمير: إغلاق الملف الميداني، وإعادة بناء ما تم تدميره مع الاستفادة من الدروس المستفادة.","u":1},{"s":"من أسس المأسسة والتكامل صياغة لوائح وخطط طوارئ وقواعد بيانات تربط مؤسسات الدولة ببعضها.","a":true,"fix":"","quote":"المأسسة والتكامل: صياغة لوائح، وخطط طوارئ، وقواعد بيانات محددة تربط جميع مؤسسات الدولة ببعضها.","u":1},{"s":"تهدف الشفافية وتدفق المعلومات إلى توحيد الخطاب الإعلامي ومنع الشائعات.","a":true,"fix":"","quote":"الشفافية وتدفق المعلومات: توحيد الخطاب الإعلامي ومنع الشائعات.","u":1},{"s":"المركزية القيادية تعني إعطاء الفرق الميدانية مرونة تنفيذية كاملة دون وجود قيادة مركزية للقرار.","a":false,"fix":"المركزية القيادية تعني وحدة القرار السياسي والقيادي، مع إعطاء مرونة تنفيذية للفرق الميدانية.","quote":"المركزية القيادية والتداول الميداني اللامركزي: وحدة القرار السياسي والقيادي مع إعطاء مرونة تنفيذية للفرق الميدانية.","u":1}],"mcq":[{"q":"ما الذي تقوم عليه إدارة الكوارث وفق المنظور المؤسسي؟","o":["رد فعل آني يعتمد على الاجتهادات الشخصية","منظومة مؤسسية مستدامة","إجراءات مرتجلة تبدأ مع وقوع الحدث","أعمال تقتصر على وقت الكارثة"],"c":1,"e":"النص يصف إدارة الكوارث بأنها منظومة مؤسسية مستدامة لا رد فعل آني أو فوضوي.","quote":"إدارة الكوارث ليست رد فعل آني أو فوضوي يستند إلى الاجتهادات الشخصية أثناء وقوع الحدث، بل هي منظومة مؤسسية مستدامة تقوم على الآتي:","u":1},{"q":"أي المراحل التالية تتضمن إغلاق الملف الميداني وإعادة بناء ما تم تدميره؟","o":["الوقاية والتخفيف","الاستعداد والجاهزية","الاستجابة","التعافي والتعمير"],"c":3,"e":"مرحلة التعافي والتعمير تشمل إغلاق الملف الميداني وإعادة البناء مع الاستفادة من الدروس المستفادة.","quote":"التعافي والتعمير: إغلاق الملف الميداني، وإعادة بناء ما تم تدميره مع الاستفادة من الدروس المستفادة.","u":1},{"q":"ما الإجراءات التي تندرج تحت مرحلة الوقاية والتخفيف؟","o":["تفعيل غرف العمليات","تدريب الكوادر تنفيذياً","التشريعات وأكواد البناء والسدود","إغلاق الملف الميداني"],"c":2,"e":"الوقاية والتخفيف تشمل الإجراءات الاستباقية مثل التشريعات وأكواد البناء والسدود.","quote":"الوقاية والتخفيف: الإجراءات الاستباقية للحد من الأسباب والمخاطر (مثل التشريعات، وأكواد البناء، والسدود).","u":1},{"q":"أي إجراء يندرج تحت مرحلة الاستعداد والجاهزية؟","o":["إعادة بناء ما تم تدميره","التدخل الميداني السريع","توحيد الخطاب الإعلامي","إنشاء أنظمة الإنذار المبكر"],"c":3,"e":"من إجراءات الاستعداد والجاهزية إعداد خطط الطوارئ وإنشاء أنظمة الإنذار المبكر وتدريب الكوادر.","quote":"الاستعداد والجاهزية: إعداد خطط الطوارئ، وإنشاء أنظمة الإنذار المبكر، وتدريب الكوادر تنفيذياً.","u":1},{"q":"أي مرحلة تتضمن تفعيل غرف العمليات والتدخل الميداني السريع فور وقوع الكارثة؟","o":["الوقاية والتخفيف","الاستجابة","الاستعداد والجاهزية","التعافي والتعمير"],"c":1,"e":"مرحلة الاستجابة تقوم على تفعيل غرف العمليات والتدخل الميداني السريع لإنقاذ الأرواح.","quote":"الاستجابة: تفعيل غرف العمليات والتدخل الميداني السريع فور وقوع الكارثة لإنقاذ الأرواح وتأمين الممتلكات.","u":1},{"q":"ما الهدف الذي تحققه الشفافية وتدفق المعلومات وفق النص؟","o":["تركيز القرار في يد شخص واحد","توحيد الخطاب الإعلامي ومنع الشائعات","تقليص عدد غرف العمليات","الاعتماد على التقدير الشخصي"],"c":1,"e":"الشفافية وتدفق المعلومات تهدف إلى توحيد الخطاب الإعلامي ومنع الشائعات.","quote":"الشفافية وتدفق المعلومات: توحيد الخطاب الإعلامي ومنع الشائعات.","u":1},{"q":"ما وسيلة الاستجابة القائمة على الأدلة البيانية لتوجيه فرق الإنقاذ؟","o":["الإشاعات المتداولة","الاجتهادات الشخصية","التقنيات والخرائط الرقمية","الموارد العشوائية"],"c":2,"e":"الاستجابة القائمة على الأدلة البيانية توظف التقنيات والخرائط الرقمية لتوجيه فرق الإنقاذ.","quote":"الاستجابة القائمة على الأدلة البيانية: توظيف التقنيات والخرائط الرقمية لتوجيه فرق الإنقاذ وإدارة الأزمة.","u":1},{"q":"أي المفاهيم تعني وحدة القرار السياسي والقيادي مع مرونة تنفيذية للفرق الميدانية؟","o":["الشفافية وتدفق المعلومات","المركزية القيادية والتداول الميداني اللامركزي","الاستجابة القائمة على الأدلة البيانية","التعافي والتعمير"],"c":1,"e":"النص يربط وحدة القرار السياسي والقيادي بالمركزية القيادية مع المرونة التنفيذية للفرق الميدانية.","quote":"المركزية القيادية والتداول الميداني اللامركزي: وحدة القرار السياسي والقيادي مع إعطاء مرونة تنفيذية للفرق الميدانية.","u":1},{"q":"ما الذي تُحققه المأسسة والتكامل وفق النص؟","o":["الاعتماد على التقدير الشخصي للقيادات","الاكتفاء بالرد بعد وقوع الحدث","صياغة لوائح وخطط طوارئ وقواعد بيانات تربط مؤسسات الدولة ببعضها","حل غرف العمليات بعد انتهاء الأزمة"],"c":2,"e":"المأسسة والتكامل تقوم على صياغة لوائح وخطط طوارئ وقواعد بيانات تربط مؤسسات الدولة.","quote":"المأسسة والتكامل: صياغة لوائح، وخطط طوارئ، وقواعد بيانات محددة تربط جميع مؤسسات الدولة ببعضها.","u":1},{"q":"أي ما يلي يمثل الاستمرارية وفق النص؟","o":["العمل الدائم قبل وأثناء وبعد الأزمة","العمل فقط عند وقوع الكارثة","الاعتماد على الاجتهادات الشخصية أثناء الحدث","تأجيل الخطط حتى وقوع الحدث"],"c":0,"e":"الاستمرارية تعني العمل الدائم قبل وأثناء وبعد الأزمة وليس فقط عند وقوع الكارثة.","quote":"الاستمرارية: العمل الدائم قبل وأثناء وبعد الأزمة (وليس فقط عند وقوع الكارثة).","u":1}],"def":[],"theory":[]},{"unit":2,"title":"","tf":[{"s":"وفق النص، يمكن للمؤسسة أو الدولة السيطرة على الأزمة باستخدام الموارد والإمكانيات المحلية المتاحة.","a":true,"fix":"","quote":"القدرة على السيطرة: يمكن للمؤسسة أو الدولة السيطرة عليها واستيعابها باستخدام الموارد والإمكانيات المحلية المتاحة دون الحاجة لاستدعاء عون خارجي استثنائي.","u":2},{"s":"الكارثة تتجاوز كلياً القدرات والموارد الاستجابية للدولة، ما يُلزم النظام بإعلان حالة الطوارئ الوطنية.","a":true,"fix":"","quote":"الحد الفاصل بين الأزمة والكارثة هو أن الكارثة تتجاوز كلياً القدرات والموارد الاستجابية للدولة أو الإقليم المحلي، مما يجبر النظام على إعلان حالة الطوارئ الوطنية وطلب أو قبول الدعم الإقليمي والدولي.","u":2},{"s":"تنشأ الأزمة غالباً عن كوارث طبيعية مثل الزلازل والسيول.","a":false,"fix":"تنشأ الأزمة غالباً عن مشكلات إدارية أو سياسية أو اجتماعية، وتتطور عبر التدرج.","quote":"الخصائص: تنشأ غالباً عن مشكلات إدارية، سياسية، أو اجتماعية، وتتطور عبر التدرج.","u":2},{"s":"التهديد وحده يتحول إلى كارثة بمجرد حدوثه.","a":false,"fix":"التهديد لا يتحول إلى كارثة بمفرده، بل إذا اصطدم بشرط الهشاشة.","quote":"التهديد هو المسبب الخارجي (زلزال - سيول - فيروس)، ولكنه لا يتحول إلى “كارثة” بمفرده إلا إذا اصطدم بشرط “الهشاشة”.","u":2},{"s":"كلما ارتفعت قدرة المواجهة، ارتفعت احتمالية تحول التهديد إلى كارثة.","a":false,"fix":"كلما ارتفعت الهشاشة وانخفضت قدرة المواجهة، ارتفع الخطر واحتمالية تحول التهديد إلى كارثة مدمرة.","quote":"الخطر (Risk) = [التهديد (Hazard) × الهشاشة (Vulnerability)] ÷ قدرة المواجهة (Capacity)","u":2},{"s":"وفق المنظور المؤسسي، إدارة الكوارث لجنة تُشكل وقت الطوارئ وتُفض بعد انتهائها.","a":false,"fix":"وفق المنظور المؤسسي، إدارة الكوارث نظام عام مستمر، دائم، ومستدام بالدولة، وليست لجنة تشكل وقت الطوارئ.","quote":"المنظور المؤسسي يُعرف إدارة الكوارث على أنها “نظام عام مستمر، دائم، ومستدام بالدولة” وليست لجنة تشكل وقت الطوارئ وتُفض بعد انتهائها.","u":2},{"s":"وفق النص، يحدث التخطيط والاستعداد في المنظور المؤسسي في ظروف الهدوء والتنسيق، وليس تحت ضغط الأزمة.","a":true,"fix":"","quote":"ج - استدامية التخطيط: التخطيط والاستعداد يحدث في ظروف الهدوء والتنسيق، وليس تحت ضغط الأزمة.","u":2},{"s":"يشمل البعد المعلوماتي والتكنولوجي إنشاء أنظمة الإنذار المبكر المرتبطة بالاستشعار عن بعد.","a":true,"fix":"","quote":"إنشاء أنظمة الإنذار المبكر المرتبطة بالاستشعار عن بعد ومراكز الأرصاد.","u":2},{"s":"وفق النص، تخضع الموازنات الطارئة لإدارة الأزمات للدورة المستندية المعتادة أثناء وقوع الكارثة.","a":false,"fix":"تُخصص موازنات طارئة ومستقلة لإدارة الأزمات، لا تخضع للدورة المستندية المعتادة أثناء وقوع الكارثة.","quote":"تخصيص موازنات وطنية ومبالغ طارئة ومستقلة لإدارة الأزمات، لا تخضع للدورة المستندية المعتادة أثناء وقوع الكارثة.","u":2},{"s":"وفق النص، الإدارة الفردية تتحرك فقط بعد وقوع الحدث وتعتمد القرارات على التقديرات الشخصية.","a":true,"fix":"","quote":"الرد العاطفي والفوضوي: التحرك فقط بعد وقوع الحدث، وتعتمد القرارات على التقديرات الشخصية للقيادات الميدانية دون وجود خطط مرجعية مسبقة.","u":2}],"mcq":[{"q":"وفق النص، أي العبارات الآتية تصف الأزمة بشكل صحيح؟","o":["الأزمة حدث صدمي يدمر الأرواح","الأزمة يمكن السيطرة عليها بالموارد المحلية المتاحة","الكارثة يمكن السيطرة عليها بالموارد المحلية","الأزمة لا تحتاج إلى قرار سريع"],"c":1,"e":"النص يذكر أن المؤسسة أو الدولة تستطيع السيطرة على الأزمة باستخدام الموارد المحلية المتاحة.","quote":"القدرة على السيطرة: يمكن للمؤسسة أو الدولة السيطرة عليها واستيعابها باستخدام الموارد والإمكانيات المحلية المتاحة دون الحاجة لاستدعاء عون خارجي استثنائي.","u":2},{"q":"ما المعنى المفاهيمي للأزمة وفق النص؟","o":["حدث صدمي يُحدث دماراً هائلاً","قرار يتخذه المسؤول بعد انتهاء الكارثة","تهديد طبيعي مثل الزلازل والسيول","خلل يتطلب اتخاذ قرار سريع في ظل الشك وعدم يقين المعلومات"],"c":3,"e":"النص يعرّف الأزمة بأنها خلل يتطلب قراراً سريعاً في ظل الشك وعدم يقين المعلومات وضغط الوقت.","quote":"المعنى المفاهيمي: الأزمة هي خلل يتطلب اتخاذ قرار سريع في ظل ظروف من الشك، وعدم يقين المعلومات، وضغط الوقت الشديد.","u":2},{"q":"وفق النص، ما الحد الفاصل بين الأزمة والكارثة؟","o":["نوع السبب هل هو طبيعي أم بشري","تجاوز الكارثة كلياً قدرات الاستجابة المحلية","عدد الضحايا فقط","مدة استمرار الحدث"],"c":1,"e":"الكارثة تتجاوز كلياً القدرات والموارد الاستجابية للدولة أو الإقليم المحلي، وهذا هو الحد الفاصل.","quote":"الحد الفاصل بين الأزمة والكارثة هو أن الكارثة تتجاوز كلياً القدرات والموارد الاستجابية للدولة أو الإقليم المحلي، مما يجبر النظام على إعلان حالة الطوارئ الوطنية وطلب أو قبول الدعم الإقليمي والدولي.","u":2},{"q":"وفق النص، ما الذي يحوّل التهديد إلى كارثة؟","o":["حدوثه في منطقة مأهولة","وقوعه بشكل مفاجئ فقط","اصطدامه بشرط الهشاشة","كونه ذا مسبب بشري"],"c":2,"e":"التهديد لا يتحول إلى كارثة بمفرده، بل إذا اصطدم بشرط الهشاشة.","quote":"التهديد هو المسبب الخارجي (زلزال - سيول - فيروس)، ولكنه لا يتحول إلى “كارثة” بمفرده إلا إذا اصطدم بشرط “الهشاشة”.","u":2},{"q":"وفق معادلة الخطر، أي العوامل يُضرب في التهديد؟","o":["الهشاشة","قدرة المواجهة","الشك وعدم يقين المعلومات","الخطر"],"c":0,"e":"المعادلة تضرب التهديد في الهشاشة ثم تقسم الناتج على قدرة المواجهة.","quote":"الخطر (Risk) = [التهديد (Hazard) × الهشاشة (Vulnerability)] ÷ قدرة المواجهة (Capacity)","u":2},{"q":"وفق النص، ما الذي تتسم به الإدارة الفردية في الاستجابة؟","o":["التخطيط المسبق بسنوات","تشكيل غرف عمليات مشتركة","التحرك فقط بعد وقوع الحدث","توحيد المعلومات بين الجهات"],"c":2,"e":"الإدارة الفردية تتحرك فقط بعد وقوع الحدث وتعتمد القرارات على التقديرات الشخصية.","quote":"الرد العاطفي والفوضوي: التحرك فقط بعد وقوع الحدث، وتعتمد القرارات على التقديرات الشخصية للقيادات الميدانية دون وجود خطط مرجعية مسبقة.","u":2},{"q":"وفق البعد التنظيمي، ما الذي يجب تأسيسه؟","o":["مركز ينشأ تحت إدارة كل جهاز منفصل","لجنة تُشكل وقت الطوارئ فقط","قاعدة بيانات للمخاطر فقط","مركز وطني موحد لإدارة الأزمات والكوارث يتبع أعلى سلطة تنفيذية"],"c":3,"e":"البعد التنظيمي يقوم على تأسيس مركز وطني موحد يتبع أعلى سلطة تنفيذية في الدولة.","quote":"تأسيس مركز/مركز وطني موحد لإدارة الأزمات والكوارث يتبع أعلى سلطة تنفيذية في الدولة.","u":2},{"q":"وفق المنظور المؤسسي، ما الذي يحدد مهام كل جهاز تنفيذي مسبقاً؟","o":["الأطر التشريعية الملزمة","اللجان المؤقتة التي تُفض بعد الانتهاء","الموازنات الطارئة المستقلة فقط","خطط الإنذار المبكر فقط"],"c":0,"e":"وجود أطر تشريعية ملزمة يحدد مهام كل جهاز تنفيذي بالدولة مسبقاً قبل وقوع الكارثة.","quote":"أ - المؤسسة القانونية: وجود أطر تشريعية ملزمة تحدد مهام كل جهاز تنفيذي بالدولة مسبقاً قبل وقوع الكارثة.","u":2},{"q":"أي الأبعاد الأربعة يتعلق بإنشاء أنظمة الإنذار المبكر المرتبطة بالاستشعار عن بعد؟","o":["البعد التشريعي والسياسي","البعد التنظيمي","البعد المعلوماتي والتكنولوجي","البعد المالي والمادي"],"c":2,"e":"إنشاء أنظمة الإنذار المبكر المرتبطة بالاستشعار عن بعد يندرج تحت البعد المعلوماتي والتكنولوجي.","quote":"إنشاء أنظمة الإنذار المبكر المرتبطة بالاستشعار عن بعد ومراكز الأرصاد.","u":2},{"q":"أي البعد يتعلق بتخصيص موازنات طارئة ومستقلة لإدارة الأزمات؟","o":["البعد المعلوماتي والتكنولوجي","البعد المالي والمادي","البعد التنظيمي","البعد التشريعي والسياسي"],"c":1,"e":"تخصيص موازنات طارئة ومستقلة لإدارة الأزمات يندرج تحت البعد المالي والمادي.","quote":"تخصيص موازنات وطنية ومبالغ طارئة ومستقلة لإدارة الأزمات، لا تخضع للدورة المستندية المعتادة أثناء وقوع الكارثة.","u":2}],"def":[],"theory":[]},{"unit":3,"title":"","tf":[{"s":"مرحلة الوقاية والتخفيف تشمل إجراءات طويلة المدى تهدف لتقليل احتمالية وقوع التهديد أو تقليل آثاره.","a":true,"fix":"","quote":"إجراءات طويلة المدى تهدف لتقليل احتمالية وقوع التهديد أو تقليل آثاره.","u":3},{"s":"تنفيذ تدريبات ومحاكاة ميدانية افتراضية من أعمال مرحلة التعافي وإعادة الإعمار.","a":false,"fix":"تنفيذ تدريبات ومحاكاة ميدانية افتراضية من أعمال مرحلة الاستعداد والجاهزية.","quote":"تنفيذ تدريبات ومحاكاة ميدانية افتراضية.","u":3},{"s":"تقديم الخدمات الطبية العاجلة وإدارة المستشفيات الميدانية من أعمال مرحلة الاستجابة الطارئة.","a":true,"fix":"","quote":"تقديم الخدمات الطبية العاجلة وإدارة المستشفيات الميدانية.","u":3},{"s":"إزالة الأنقاض وإعادة بناء البنية التحتية بنماذج أكثر صلابة من أعمال مرحلة الوقاية والتخفيف.","a":false,"fix":"إزالة الأنقاض وإعادة بناء البنية التحتية بنماذج أكثر صلابة من أعمال مرحلة التعافي وإعادة الإعمار.","quote":"إزالة الأنقاض وإعادة بناء البنية التحتية بنماذج أكثر صلابة.","u":3},{"s":"تبدأ مرحلة الاستجابة الطارئة مع الساعات والأيام الأولى لوقوع الكارثة.","a":true,"fix":"","quote":"الساعات والأيام الأولى لوقوع الكارثة (تفعيل خطة الطوارئ).","u":3},{"s":"تهدف مرحلة الاستعداد والجاهزية إلى تجهيز الأجهزة والأفراد للتدخل السريع عند التنبؤ بالكارثة.","a":true,"fix":"","quote":"الإجراءات المتخذة لتجهيز الأجهزة والأفراد للتدخل السريع عند التنبؤ بالكارثة.","u":3},{"s":"تجنب السكن في مخرات السيول أو الفوالق النشطة من أعمال مرحلة الاستجابة الطارئة.","a":false,"fix":"تجنب السكن في مخرات السيول أو الفوالق النشطة من أعمال مرحلة الوقاية والتخفيف.","quote":"التخطيط العمراني وتجنب السكن في مخرات السيول أو الفوالق النشطة.","u":3},{"s":"تهدف مرحلة التعافي وإعادة الإعمار إلى العودة للتوازن وإعادة بناء المنطقة المتضررة بشروط أفضل مما كانت عليه.","a":true,"fix":"","quote":"العودة للتوازن وإعادة بناء المنطقة المتضررة بشروط أفضل مما كانت عليه.","u":3},{"s":"صياغة ملف “الدروس المستفادة” من أعمال مرحلة الاستعداد والجاهزية.","a":false,"fix":"صياغة ملف “الدروس المستفادة” من أعمال مرحلة التعافي وإعادة الإعمار.","quote":"تقييم الأداء المؤسسي وصياغة ملف “الدروس المستفادة” لتعديل الخطط المستقبلية.","u":3},{"s":"مخزون الاستجابة السريعة من الأغذية والأدوية والخيام من أعمال مرحلة الاستعداد والجاهزية.","a":true,"fix":"","quote":"مخزون الاستجابة السريعة (أغذية، أدوية، خيام).","u":3}],"mcq":[{"q":"أي مرحلة من مراحل دورة حياة الكارثة تشمل إزالة الأنقاض وإعادة بناء البنية التحتية؟","o":["الوقاية والتخفيف","الاستعداد والجاهزية","الاستجابة الطارئة","التعافي وإعادة الإعمار"],"c":3,"e":"إزالة الأنقاض وإعادة بناء البنية التحتية من أعمال مرحلة التعافي وإعادة الإعمار.","quote":"إزالة الأنقاض وإعادة بناء البنية التحتية بنماذج أكثر صلابة.","u":3},{"q":"ما المقصود بمرحلة الوقاية والتخفيف وفق النص؟","o":["تجهيز الأجهزة للتدخل السريع عند التنبؤ بالكارثة","إجراءات طويلة المدى تقلل احتمالية وقوع التهديد أو آثاره","إنقاذ الأرواح وإخلاء المناطق المتأثرة","الدعم النفسي وتوفير سكن بديل"],"c":1,"e":"المرحلة تعرف بأنها إجراءات طويلة المدى تهدف لتقليل احتمالية وقوع التهديد أو تقليل آثاره.","quote":"إجراءات طويلة المدى تهدف لتقليل احتمالية وقوع التهديد أو تقليل آثاره.","u":3},{"q":"أي الإجراءات التالية تندرج ضمن مرحلة الاستجابة الطارئة؟","o":["إنقاذ الأرواح وإخلاء المناطق المتأثرة","مراجعة مخرات السيول والسدود","تنفيذ تدريبات ومحاكاة ميدانية افتراضية","صياغة ملف الدروس المستفادة"],"c":0,"e":"إنقاذ الأرواح وإخلاء المناطق المتأثرة من أعمال مرحلة الاستجابة الطارئة.","quote":"إنقاذ الأرواح وإخلاء المناطق المتأثرة.","u":3},{"q":"ما الهدف من مرحلة الاستعداد والجاهزية؟","o":["إعادة بناء المنطقة المتضررة بشروط أفضل","تقليل احتمالية وقوع التهديد بإجراءات طويلة المدى","تجهيز الأجهزة والأفراد للتدخل السريع عند التنبؤ بالكارثة","تأمين المرافق الأساسية بعد وقوع الكارثة"],"c":2,"e":"المرحلة تتخذ فيها الإجراءات لتجهيز الأجهزة والأفراد للتدخل السريع عند التنبؤ بالكارثة.","quote":"الإجراءات المتخذة لتجهيز الأجهزة والأفراد للتدخل السريع عند التنبؤ بالكارثة.","u":3},{"q":"أي عمل مؤسسي يرد في مرحلة التعافي وإعادة الإعمار؟","o":["مراجعة صلاحية المعدات وأنظمة الاتصال البديلة","تطبيق أطقم وكودات البناء المقاوم للزلازل","تأمين الكهرباء والمياه والاتصالات","الدعم النفسي والاجتماعي للمتضررين وتوفير سكن بديل"],"c":3,"e":"الدعم النفسي والاجتماعي وتوفير السكن البديل من أعمال مرحلة التعافي وإعادة الإعمار.","quote":"الدعم النفسي والاجتماعي للمتضررين وتوفير سكن بديل.","u":3},{"q":"وفق النص، ما الذي تشير إليه مدخل مرحلة الاستجابة الطارئة زمنياً؟","o":["قبل وقوع الكارثة بعدة أشهر","بعد انتهاء إعادة الإعمار بالكامل","الساعات والأيام الأولى لوقوع الكارثة","خلال تدريبات المحاكاة الافتراضية"],"c":2,"e":"مدخل المرحلة هو الساعات والأيام الأولى لوقوع الكارثة مع تفعيل خطة الطوارئ.","quote":"الساعات والأيام الأولى لوقوع الكارثة (تفعيل خطة الطوارئ).","u":3},{"q":"ما الغرض من صياغة ملف “الدروس المستفادة” وفق النص؟","o":["تحديد أماكن مخرات السيول","تعديل الخطط المستقبلية","تجهيز مخزون الاستجابة السريعة","تحديد الوزارات المشاركة في الإنقاذ"],"c":1,"e":"يصاغ الملف ضمن تقييم الأداء المؤسسي لتعديل الخطط المستقبلية.","quote":"تقييم الأداء المؤسسي وصياغة ملف “الدروس المستفادة” لتعديل الخطط المستقبلية.","u":3},{"q":"أي عمل يرد ضمن مرحلة الوقاية والتخفيف؟","o":["تخطيط عمراني يتجنب السكن في مخرات السيول","تأمين المرافق الأساسية (كهرباء، مياه، اتصالات)","مخزون الاستجابة السريعة (أغذية، أدوية، خيام)","تقديم الخدمات الطبية العاجلة"],"c":0,"e":"التخطيط العمراني وتجنب السكن في مخرات السيول من أعمال مرحلة الوقاية والتخفيف.","quote":"التخطيط العمراني وتجنب السكن في مخرات السيول أو الفوالق النشطة.","u":3},{"q":"أي من الأنشطة التالية يمثل تدريباً في مرحلة الاستعداد والجاهزية؟","o":["إزالة الأنقاض","إخلاء المناطق المتأثرة","تقديم الدعم النفسي","تنفيذ تدريبات ومحاكاة ميدانية افتراضية"],"c":3,"e":"تنفيذ التدريبات والمحاكاة الميدانية الافتراضية من أعمال مرحلة الاستعداد والجاهزية.","quote":"تنفيذ تدريبات ومحاكاة ميدانية افتراضية.","u":3},{"q":"في أي مرحلة يرد تأمين المرافق الأساسية (كهرباء، مياه، اتصالات)؟","o":["الوقاية والتخفيف","الاستعداد والجاهزية","الاستجابة الطارئة","التعافي وإعادة الإعمار"],"c":2,"e":"تأمين المرافق الأساسية ومنع السرقة أو انهيار الأمن من أعمال مرحلة الاستجابة الطارئة.","quote":"تأمين المرافق الأساسية (كهرباء، مياه، اتصالات) ومنع سرقة أو انهيار الأمن.","u":3}],"def":[],"theory":[]},{"unit":4,"title":"","tf":[{"s":"الهيكل الوطني لإدارة الأزمات يعمل وفق سياسات واستراتيجية مسبقة لمواجهة المخاطر القومية.","a":true,"fix":"","quote":"تعمل وفق سياسات واستراتيجية مسبقة لمواجهة المخاطر القومية.","u":4},{"s":"يتكون الهيكل الوطني الناجح من 4 مستويات قيادية وتنفيذية مترابطة.","a":false,"fix":"يتكون الهيكل الوطني الناجح من 3 مستويات قيادية وتنفيذية مترابطة.","quote":"يتكون الهيكل الوطني الناجح من 3 مستويات قيادية وتنفيذية مترابطة:","u":4},{"s":"يعمل المركز الوطني لإدارة الأزمات بشكل مستمر 7/24 تحت إدارة خبراء وممثلين دائمين عن كافة الوزارات.","a":true,"fix":"","quote":"جهاز أو مركز دائري مستمر يعمل 7/24 تحت إدارة خبراء وممثلين دائمين عن كافة الوزارات.","u":4},{"s":"يتولى المستوى الميداني إعلان حالة الطوارئ أو الكارثة القومية.","a":false,"fix":"يتولى المستوى الاستراتيجي إعلان حالة الطوارئ أو الكارثة القومية.","quote":"إعلان حالة الطوارئ أو الكارثة القومية.","u":4},{"s":"يتولى المستوى الميداني طلب أو قبول المساعدات الدولية.","a":false,"fix":"يتولى المستوى الاستراتيجي طلب أو قبول المساعدات الدولية.","quote":"طلب أو قبول المساعدات الدولية.","u":4},{"s":"قسم التخطيط مسؤول عن جمع البيانات وتقييم تطور الكارثة ووضع خطة العمل للفترة القادمة.","a":true,"fix":"","quote":"قسم التخطيط: جمع البيانات، تقييم تطور الكارثة، ووضع خطة العمل للفترة القادمة.","u":4},{"s":"قسم اللوجستيات مسؤول عن التعويضات وتوثيق التكاليف.","a":false,"fix":"قسم المالية والإدارة مسؤول عن التعويضات وتوثيق التكاليف.","quote":"قسم المالية والإدارة: التعويضات، وتوثيق التكاليف، وعقود التجهيزات العاجلة.","u":4},{"s":"ينبغي ألا يشرف القيادي الواحد على أكثر من 3 إلى 7 أفراد أو فرق عمل.","a":true,"fix":"","quote":"ألا يشرف القيادي الواحد على أكثر من 3 إلى 7 أفراد أو فرق عمل لضمان تركيز السيطرة.","u":4},{"s":"من شروط نجاح الهيكل الوطني أن يستخدم الجيش والإسعاف ترددات لاسلكية مختلفة.","a":false,"fix":"من شروط نجاح الهيكل الوطني أن تعمل الشبكات اللاسلكية على نفس الترددات بين الشرطة والجيش والإسعاف.","quote":"استخدام شبكات لاسلكية مجهزة تعمل على نفس الترددات بين الشرطة، والجيش، والإسعاف.","u":4},{"s":"تشمل وظيفة إدارة الاتصال والأزمات الإعلامية توحيد الخطاب الإعلامي للدولة عبر متحدث رسمي باسم المركز الوطني.","a":true,"fix":"","quote":"توحيد الخطاب الإعلامي للدولة عبر متحدث رسمي باسم المركز الوطني.","u":4}],"mcq":[{"q":"ما المبدأ الحاكم الذي يقوم عليه الهيكل الوطني لإدارة الأزمات؟","o":["وحدة القيادة وتكامل الأداء","ترك كل وزارة تعمل بشكل منفصل","تأسيس هيكل جديد لكل أزمة","تقليل عدد المستويات القيادية"],"c":0,"e":"المبدأ الحاكم هو وحدة القيادة وتكامل الأداء، لأن كل وزارة لا يمكن أن تعمل منفصلة عند الكارثة الكبرى.","quote":"المبدأ الحاكم هو “وحدة القيادة وتكامل الأداء.”","u":4},{"q":"أيّ مما يلي يمثل المركزية الاستراتيجية واللامركزية التنفيذية؟","o":["كل القرارات تتخذ في الميدان دون تدخل القيادة العليا","الوزارات تعمل بشكل منفصل لكل كارثة","تعيين بدلاء للمسؤولين في حال الإصابة","القرار السياسي وتوزيع الموارد الكبرى مركزي من أعلى سلطة، والصلاحيات الميدانية للقيادات المحلية"],"c":3,"e":"القرار السياسي وتوزيع الموارد الكبرى يكون مركزياً، بينما تعطى الصلاحيات الميدانية للقيادات المحلية.","quote":"القرار السياسي وتوزيع الموارد الكبرى يكون مركزياً من أعلى سلطة، بينما تعطى الصلاحيات الميدانية للقيادات المحلية للتحرك السريع.","u":4},{"q":"ما الذي يضمن استمرارية القيادة وفق النص؟","o":["ترك كل جهاز يعمل منفصلاً","وجود بدلاء وسلسلة قيادة واضحة","الاكتفاء بالمستوى الميداني","إنشاء سجل المخاطر القومي"],"c":1,"e":"استمرارية القيادة تضمنها وجود بدلاء وسلسلة قيادة واضحة عند تغيب أي مسؤول أو إصابته.","quote":"ضمان وجود بدلاء وسلسلة قيادة واضحة في حال تغيب أو إصابة أي مسؤول.","u":4},{"q":"من المشكّلون للمستوى الاستراتيجي وفق النص؟","o":["المحافظون وقادة القطاعات","رئيس مجلس الوزراء والوزراء المعنيون ورؤساء الأجهزة الأمنية","فرق الدفاع المدني والمستشفيات","سيارات الإسعاف وطائرات الإنقاذ"],"c":1,"e":"المستوى الاستراتيجي يشكّله رئيس مجلس الوزراء والوزراء المعنيون ورؤساء الأجهزة الأمنية.","quote":"رئيس مجلس الوزراء، الوزراء المعنيون (دفاع، داخلية، صحة، نقل، إعلام، مالية)، رؤساء الأجهزة الأمنية.","u":4},{"q":"أي مهمة تقع ضمن المستوى الميداني؟","o":["صياغة السيناريوهات وعرض البدائل","إعلان حالة الطوارئ أو الكارثة القومية","رفع تقارير موقف لحظية للمركز الوطني","تعيين المتحدث الرسمي"],"c":2,"e":"المستوى الميداني يرفع تقارير موقف لحظية للمركز الوطني.","quote":"رفع تقارير موقف لحظية للمركز الوطني.","u":4},{"q":"ما الوظيفة التي تشمل إنشاء “سجل المخاطر القومي”؟","o":["التخطيط وبناء السيناريوهات","إدارة اللوجستيات والموارد القومية","إدارة المخاطر والتنبؤ الاستباقي","إدارة الاتصال والأزمات الإعلامية"],"c":2,"e":"إنشاء سجل المخاطر القومي وحصره من مهام وظيفة إدارة المخاطر والتنبؤ الاستباقي.","quote":"إنشاء وحصر “سجل المخاطر القومي”.","u":4},{"q":"أي وظيفة من وظائف الهيكل الوطني تتعلق بمواجهة الشائعات؟","o":["إدارة اللوجستيات والموارد القومية","التخطيط وبناء السيناريوهات","إدارة المخاطر والتنبؤ الاستباقي","إدارة الاتصال والأزمات الإعلامية"],"c":3,"e":"مواجهة الشائعات والمعلومات المغلوطة تقع ضمن إدارة الاتصال والأزمات الإعلامية.","quote":"مواجهة الشائعات والمعلومات المغلوطة التي تسهم في إشاعة الفوضى أو الهلع بين المواطنين.","u":4},{"q":"أي قسم في نظام القيادة الميدانية (ICS) مسؤول عن توفير الإمدادات والوقود وشبكات الاتصال والإطعام؟","o":["قسم اللوجستيات","قسم المالية والإدارة","قسم التخطيط","قسم العمليات"],"c":0,"e":"قسم اللوجستيات مسؤول عن توفير الإمدادات والوقود وشبكات الاتصال والإطعام.","quote":"قسم اللوجستيات: توفير الإمدادات، والوقود، وشبكات الاتصال، والإطعام.","u":4},{"q":"ما المهمة المنسوبة إلى قسم العمليات في نظام القيادة الميدانية (ICS)؟","o":["جمع البيانات وتقييم تطور الكارثة","توفير الإمدادات والوقود","التعويضات وتوثيق التكاليف","المنفذون والإخلاء والفرق الطبية"],"c":3,"e":"قسم العمليات يضم المنفذين والإخلاء والفرق الطبية، أي من يمارس الفعل الميداني.","quote":"قسم العمليات: المنفذون، والإخلاء، والفرق الطبية (من يمارس الفعل الميداني).","u":4},{"q":"ما المقصود بنطاق السيطرة المناسب وفق النص؟","o":["أن تستخدم الشرطة والجيش ترددات مختلفة","أن يكون لكل جهاز مركز مستقل","أن يشرف القيادي الواحد على 3 إلى 7 أفراد أو فرق عمل","أن يتولى المحافظ إعلان الكارثة"],"c":2,"e":"نطاق السيطرة المناسب يعني ألا يشرف القيادي الواحد على أكثر من 3 إلى 7 أفراد أو فرق عمل.","quote":"ألا يشرف القيادي الواحد على أكثر من 3 إلى 7 أفراد أو فرق عمل لضمان تركيز السيطرة.","u":4}],"def":[],"theory":[]},{"unit":5,"title":"","tf":[{"s":"الوقاية والتخفيف من المخاطر هي الإجراءات التي تُتخذ قبل وقوع الأزمة لمنع حدوثها أو تقليل احتمالية وقوعها وحجم أضرارها.","a":true,"fix":"","quote":"هي الإجراءات التي تُتخذ قبل وقوع الأزمة لمنع حدوثها قدر الإمكان، أو تقليل احتمالية وقوعها وحجم أضرارها إذا تعذر منعها.","u":5},{"s":"تبدأ مرحلة الاستجابة بعد انتهاء الأزمة وبدء إعادة الإعمار.","a":false,"fix":"تبدأ مرحلة الاستجابة عند وقوع الأزمة أو ظهور مؤشرات مؤكدة على قرب وقوعها.","quote":"تبدأ هذه المرحلة عند وقوع الأزمة أو ظهور مؤشرات مؤكدة على قرب وقوعها، وتشمل الإجراءات العاجلة للسيطرة على الموقف وتقليل الخسائر.","u":5},{"s":"الفرق الأساسي بين الوقاية والتخفيف والاستعداد أن التخفيف يقلل الخطر نفسه، بينما الاستعداد يجهز الدولة للتعامل معه إذا وقع.","a":true,"fix":"","quote":"التخفيف يقلل الخطر نفسه، بينما الاستعداد يجهز الدولة للتعامل معه إذا وقع.","u":5},{"s":"تعزيز قدرة المنشآت الحيوية مثل المستشفيات ومحطات الكهرباء والمياه من إجراءات مرحلة التعافي وإعادة الإعمار.","a":false,"fix":"تعزيز قدرة المنشآت الحيوية مثل المستشفيات ومحطات الكهرباء والمياه من إجراءات مرحلة الوقاية والتخفيف.","quote":"تعزيز قدرة المنشآت الحيوية مثل المستشفيات ومحطات الكهرباء والمياه.","u":5},{"s":"من أمثلة مرحلة الاستعداد والجاهزية اختبار أجهزة الإنذار وتجهيز فرق الإنقاذ قبل موسم السيول.","a":true,"fix":"","quote":"قبل موسم السيول، يتم اختبار أجهزة الإنذار، وتجهيز فرق الإنقاذ، وتحديد مراكز الإيواء، والتأكد من جاهزية سيارات الإسعاف والمعدات.","u":5},{"s":"من المخرجات الرئيسية لمرحلة الاستعداد والجاهزية: تقييم وطني للمخاطر وخرائط المخاطر.","a":false,"fix":"من المخرجات الرئيسية لمرحلة الاستعداد والجاهزية: خطط طوارئ معتمدة، وفرق مدربة، وموارد جاهزة، وسيناريوهات استجابة مجرّبة.","quote":"خطط طوارئ معتمدة، وفرق مدربة، وموارد جاهزة، وسيناريوهات استجابة مجرّبة.","u":5},{"s":"تبدأ مرحلة التعافي وإعادة الإعمار بعد السيطرة على الخطر المباشر.","a":true,"fix":"","quote":"تبدأ بعد السيطرة على الخطر المباشر، وتهدف إلى إعادة المجتمع والدولة للعمل بصورة طبيعية، مع معالجة الآثار طويلة الأجل للأزمة.","u":5},{"s":"من إجراءات مرحلة التعافي وإعادة الإعمار تنفيذ عمليات الإنقاذ والإخلاء والإسعاف.","a":false,"fix":"من إجراءات مرحلة الاستجابة تنفيذ عمليات الإنقاذ والإخلاء والإسعاف.","quote":"تنفيذ عمليات الإنقاذ والإخلاء والإسعاف.","u":5},{"s":"من إجراءات مرحلة التعافي وإعادة الإعمار تقييم أداء الجهات واستخلاص الدروس المستفادة.","a":true,"fix":"","quote":"تقييم أداء الجهات واستخلاص الدروس المستفادة.","u":5},{"s":"الهدف الرئيسي لمرحلة الاستجابة هو إعادة البناء بصورة أفضل وأكثر أماناً.","a":false,"fix":"الهدف الرئيسي لمرحلة الاستجابة هو إنقاذ الأرواح وحماية الممتلكات واحتواء الأزمة وضمان استمرار الخدمات الأساسية.","quote":"إنقاذ الأرواح، حماية الممتلكات، احتواء الأزمة، وضمان استمرار الخدمات الأساسية.","u":5}],"mcq":[{"q":"أي الإجراءات التالية تندرج ضمن مرحلة الوقاية والتخفيف من المخاطر؟","o":["تفعيل مركز إدارة الأزمات وخطط الطوارئ","إعداد خرائط للمخاطر وتحديد المناطق والفئات الأكثر تعرضاً","إصدار التحذيرات والتعليمات الرسمية","توفير الإيواء المؤقت للمتضررين"],"c":1,"e":"إعداد خرائط المخاطر وتحديد المناطق الأكثر تعرضاً من إجراءات الوقاية والتخفيف، بينما الباقي من إجراءات الاستجابة.","quote":"إعداد خرائط للمخاطر وتحديد المناطق والفئات الأكثر تعرضاً.","u":5},{"q":"ما الهدف الرئيسي لمرحلة الاستجابة؟","o":["إعداد خطط الطوارئ وتحديد الأدوار","تقييم المخاطر وإنشاء أنظمة الإنذار المبكر","تقييم الأضرار وإعادة تشغيل الكهرباء","إنقاذ الأرواح وحماية الممتلكات واحتواء الأزمة"],"c":3,"e":"النص يحدد هدف الاستجابة بإنقاذ الأرواح وحماية الممتلكات واحتواء الأزمة وضمان استمرار الخدمات الأساسية.","quote":"إنقاذ الأرواح، حماية الممتلكات، احتواء الأزمة، وضمان استمرار الخدمات الأساسية.","u":5},{"q":"ما الفرق الأساسي بين الوقاية والتخفيف والاستعداد؟","o":["التخفيف يقلل الخطر نفسه، بينما الاستعداد يجهز الدولة للتعامل معه إذا وقع","الاستعداد يقلل الخطر نفسه، بينما التخفيف يجهز الدولة للتعامل معه","كلاهما يبدأ عند وقوع الأزمة لاحتوائها","كلاهما يقتصر على إعادة الإعمار بعد انتهاء الأزمة"],"c":0,"e":"النص يفرق بين التخفيف الذي يقلل الخطر نفسه والاستعداد الذي يجهز الدولة للتعامل معه.","quote":"التخفيف يقلل الخطر نفسه، بينما الاستعداد يجهز الدولة للتعامل معه إذا وقع.","u":5},{"q":"أي المراحل الأربع تبدأ بعد السيطرة على الخطر المباشر؟","o":["الوقاية والتخفيف","الاستجابة","التعافي وإعادة الإعمار","الاستعداد والجاهزية"],"c":2,"e":"مرحلة التعافي وإعادة الإعمار تبدأ بعد السيطرة على الخطر المباشر وتعالج الآثار طويلة الأجل.","quote":"تبدأ بعد السيطرة على الخطر المباشر، وتهدف إلى إعادة المجتمع والدولة للعمل بصورة طبيعية، مع معالجة الآثار طويلة الأجل للأزمة.","u":5},{"q":"أي الإجراءات التالية من مهام مرحلة الاستعداد والجاهزية؟","o":["إصدار التحذيرات والتعليمات الرسمية","تدريب فرق الطوارئ والإنقاذ والإسعاف","تعويض المتضررين عن أضرارهم","منع البناء في مجاري السيول"],"c":1,"e":"من إجراءات الاستعداد والجاهزية تدريب فرق الطوارئ والإنقاذ والإسعاف، أما الباقي فإجراءات مراحل أخرى.","quote":"تدريب فرق الطوارئ والإنقاذ والإسعاف.","u":5},{"q":"ما الإجراء الوارد مثالاً على الوقاية من أضرار السيول؟","o":["إخلاء المناطق المهددة وإغلاق الطرق الخطرة","توفير مراكز إيواء وخدمات طبية عاجلة","إعادة فتح المدارس والمستشفيات","منع البناء في مجاري السيول"],"c":3,"e":"المثال الوارد للوقاية من السيول يشمل منع البناء في مجاري السيول، بينما الباقي أمثلة للاستجابة أو التعافي.","quote":"منع أو تخفيف أضرار السيول، يتم إنشاء شبكات تصريف، ومنع البناء في مجاري السيول، ومراقبة الأحوال الجوية، وتحديد المناطق المهددة مسبقاً.","u":5},{"q":"أي الإجراءات التالية تشملها مرحلة التعافي وإعادة الإعمار؟","o":["إجراء تقييم شامل للأضرار والاحتياجات","تفعيل مركز إدارة الأزمات","إنشاء أنظمة الإنذار المبكر","وضع التشريعات والاشتراطات الوقائية"],"c":0,"e":"من إجراءات مرحلة التعافي إجراء تقييم شامل للأضرار والاحتياجات، أما الباقي فمن مراحل الوقاية أو الاستجابة.","quote":"إجراء تقييم شامل للأضرار والاحتياجات.","u":5},{"q":"أي العبارات التالية تصف مرحلة الاستعداد والجاهزية؟","o":["منع الأزمة قبل وقوعها ومعالجة نقاط الضعف فيها","تقييم الأضرار واستخلاص الدروس المستفادة","تجهيز الدولة ومؤسساتها للتعامل مع الأزمة قبل وقوعها","احتواء الأزمة وتقليل الخسائر بعد وقوعها"],"c":2,"e":"النص يعرّف مرحلة الاستعداد بأنها تجهيز الدولة ومؤسساتها للتعامل مع الأزمة قبل وقوعها.","quote":"هي مرحلة تجهيز الدولة ومؤسساتها للتعامل مع الأزمة قبل وقوعها، في حال لم تنجح إجراءات الوقاية في منعها.","u":5},{"q":"ما الهدف الرئيسي لمرحلة التعافي وإعادة الإعمار في جدول المراحل الأربع؟","o":["منع الأزمة قبل وقوعها","معالجة الآثار وإعادة البناء بصورة أفضل","رفع جاهزية الدولة للتعامل معها","احتواء الأزمة في موقعها"],"c":1,"e":"الجدول يحدد الهدف الرئيسي لمرحلة التعافي بمعالجة الآثار وإعادة البناء بصورة أفضل.","quote":"معالجة الآثار وإعادة البناء بصورة أفضل","u":5},{"q":"أي الأثر المتوقع من مرحلة التعافي وفق المخرجات الرئيسية؟","o":["الإخلاء الفوري للمناطق المهددة","تقليل احتمالية وقوع الخطر نفسه","تفعيل مركز إدارة الأزمات","تعزيز قدرة الدولة على الصمود وتحسين الخطط"],"c":3,"e":"المخرجات الرئيسية للتعافي تشمل استعادة الحياة الطبيعية وتحسين الخطط وتعزيز قدرة الدولة على الصمود.","quote":"استعادة الحياة الطبيعية، وإعادة بناء ما تضرر، وتحسين الخطط، وتعزيز قدرة الدولة على الصمود.","u":5}],"def":[],"theory":[]},{"unit":6,"title":"","tf":[{"s":"الأزمة الوطنية تتطلب مشاركة جميع المؤسسات ولا تتعامل معها مؤسسة واحدة فقط.","a":true,"fix":"","quote":"الأزمة الوطنية لا تتعامل معها مؤسسة واحدة فقط، بل تتطلب مشاركة جميع المؤسسات:","u":6},{"s":"أجهزة الحماية المدنية تُعد غالباً خط الاستجابة الأخيرة في الكوارث المحلية.","a":false,"fix":"أجهزة الحماية المدنية تُعد غالباً خط الاستجابة الأولى في العديد من الأزمات المحلية والكوارث.","quote":"وهذه الأجهزة تمثل غالباً خط الاستجابة الأولى في العديد من الأزمات المحلية والكوارث.","u":6},{"s":"المستوى المركزي يمتلك قدرة أكبر على حشد الموارد الوطنية، بينما يرى المستوى المحلي الأزمة على الأرض.","a":true,"fix":"","quote":"المستوى المحلي يرى الأزمة على الأرض، بينما المستوى المركزي يمتلك قدرة أكبر على حشد الموارد الوطنية.","u":6},{"s":"التنسيق الأفقي هو انتقال المعلومات والقرارات بين المستوى المركزي والمستوى المحلي.","a":false,"fix":"التنسيق الرأسي هو انتقال المعلومات والقرارات بين المستوى المركزي والمستوى المحلي، أما التنسيق الأفقي فهو بين المؤسسات التي تعمل في المستوى نفسه.","quote":"أي انتقال المعلومات والقرارات بين: المستوى المركزي - المستوى المحلي.","u":6},{"s":"تتولى القيادة السياسية إدارة الأزمة على المستوى الاستراتيجي الأعلى.","a":true,"fix":"","quote":"تتولى القيادة السياسية إدارة الأزمة على المستوى الاستراتيجي الأعلى، وتحدد التوجه العام للدولة وأولويات التعامل مع الأزمة.","u":6},{"s":"تتولى وزارة البيئة ضمان توافر السلع الأساسية.","a":false,"fix":"تتولى وزارة التموين ضمان توافر السلع الأساسية.","quote":"تتولى وزارة التموين ضمان توافر السلع الأساسية.","u":6},{"s":"لا يقتصر دور القطاع الصحي على العلاج، بل يشمل أيضاً الوقاية والرصد والاستجابة.","a":true,"fix":"","quote":"ولا يقتصر دور القطاع الصحي على العلاج، بل يشمل أيضاً (الوقاية - الرصد - الاستجابة).","u":6},{"s":"تتولى مؤسسات المياه توفير الأدوية والمستلزمات الطبية للمتضررين.","a":false,"fix":"من مسؤوليات القطاع الصحي توفير الأدوية والمستلزمات الطبية، بينما تتولى مؤسسات المياه توفير خزانات ومصادر مياه بديلة.","quote":"توفير الأدوية والمستلزمات الطبية.","u":6},{"s":"تضمن مؤسسات الطاقة استمرارية إمدادات الكهرباء والوقود والغاز.","a":true,"fix":"","quote":"تتولى مؤسسات الطاقة ضمان استمرارية إمدادات الكهرباء والوقود والغاز، باعتبارها من الخدمات الضرورية لاستمرار عمل الدولة.","u":6},{"s":"تتولى أجهزة الإعلام الحفاظ على تشغيل شبكات الهاتف والإنترنت.","a":false,"fix":"تتولى أجهزة الاتصالات الحفاظ على تشغيل شبكات الهاتف والإنترنت، بينما يتولى الإعلام إدارة الاتصال مع الجمهور.","quote":"الحفاظ على تشغيل شبكات الهاتف والإنترنت.","u":6}],"mcq":[{"q":"ما الذي تقوم به المؤسسات الاقتصادية والمالية في الأزمة؟","o":["إصدار التحذيرات والتعليمات الرسمية","إخلاء السكان من المناطق الخطرة","توفير السيولة والتمويل للقطاعات المتضررة","تقديم الإسعافات الأولية"],"c":2,"e":"من مسؤوليات المؤسسات الاقتصادية توفير السيولة والتمويل للقطاعات المتضررة، أما الباقي فمن اختصاص جهات أخرى.","quote":"توفير السيولة والتمويل للقطاعات المتضررة.","u":6},{"q":"أي المهام التالية من مسؤوليات القطاع الصحي؟","o":["استقبال المصابين وتصنيفهم وفق درجة الخطورة","تنظيم دخول المناطق المتضررة والخروج منها","إدارة الحركة وتنظيم المرور","إعادة فتح مواقع العمل"],"c":0,"e":"من مسؤوليات القطاع الصحي استقبال المصابين وتصنيفهم وفق درجة الخطورة، بينما الباقي من اختصاص الأمن أو مراحل التعافي.","quote":"استقبال المصابين وتصنيفهم وفق درجة الخطورة.","u":6},{"q":"ما الدور الذي يؤديه المجتمع المدني وفق النص؟","o":["العمل باستقلال تام عن الجهات الرسمية","العمل بمعزل عن المتطوعين لتسريع الإغاثة","العمل دون أي تنسيق مع الجهات الرسمية","العمل تحت إشراف وتنسيق الجهات الرسمية"],"c":3,"e":"النص يشترط أن تعمل جهود المجتمع المدني تحت إشراف وتنسيق الجهات الرسمية لتجنب التكرار أو سوء التوزيع.","quote":"ويجب أن تعمل جهوده تحت إشراف وتنسيق الجهات الرسمية لتجنب التكرار أو سوء توزيع المساعدات.","u":6},{"q":"أي العبارات التالية تصف دور القطاع الخاص وفق النص؟","o":["يتولى إدارة الأزمات الكبرى منفرداً","يساهم في تمويل جهود الإغاثة وإعادة الإعمار","يتولى تحديد الأولويات الوطنية","لا يُسمح له بتوفير الغذاء والدواء"],"c":1,"e":"النص يذكر أن القطاع الخاص يساهم في تمويل جهود الإغاثة وإعادة الإعمار، بينما تحديد الأولويات الوطنية من مهام القيادة السياسية.","quote":"المساهمة في تمويل جهود الإغاثة وإعادة الإعمار.","u":6},{"q":"ما الذي تتولاه مؤسسات المياه أثناء الأزمة؟","o":["تشغيل شبكات الهاتف والإنترنت","توفير الوقود لمحطات الطوارئ","توزيع المياه على المناطق المتضررة","نشر الفرق الطبية والمستشفيات الميدانية"],"c":2,"e":"من مسؤوليات مؤسسات المياه توزيع المياه على المناطق المتضررة، بينما الباقي من مسؤوليات جهات أخرى.","quote":"توزيع المياه على المناطق المتضررة.","u":6},{"q":"أي المسؤوليات التالية تتولاها المؤسسات الأمنية؟","o":["منع الجريمة مثل أعمال السرقة أو التخريب أو الاحتكار","إدارة شبكات الإنترنت والاتصالات","تقديم الدعم النفسي للمتضررين","توزيع الأدوية والمستلزمات الطبية"],"c":0,"e":"من مسؤوليات المؤسسات الأمنية منع الجريمة مثل السرقة والتخريب والاحتكار، أما الباقي فمن مسؤوليات جهات أخرى.","quote":"منع الجريمة مثل أعمال السرقة أو التخريب أو الاحتكار.","u":6},{"q":"أي الأدوار التالية تقوم بها القوات المسلحة وفق النص؟","o":["تحديد الأسعار ومنع الاحتكار","الإعلان عن مناطق الخطر ومسارات الإخلاء","إدارة الحركة في المدن يومياً","إنشاء المستشفيات الميدانية ومراكز الإيواء المؤقتة"],"c":3,"e":"من أدوار القوات المسلحة الدعم الطبي بإنشاء المستشفيات الميدانية ومراكز الإيواء المؤقتة، بينما الباقي من مهام جهات مدنية أخرى.","quote":"الدعم الطبي بإنشاء المستشفيات الميدانية ومراكز الإيواء المؤقتة.","u":6},{"q":"ما الأولوية التي تعطيها مؤسسات النقل أثناء الأزمة؟","o":["نقل السلع الكمالية أولاً","إعطاء الأولوية لنقل المصابين والمواد الطبية والسلع الأساسية","تأجيل نقل فرق الإنقاذ","إغلاق جميع الطرق الرئيسية"],"c":1,"e":"النص يحدد أولوية مؤسسات النقل بنقل المصابين والمواد الطبية والسلع الأساسية.","quote":"إعطاء الأولوية لنقل المصابين والمواد الطبية والسلع الأساسية.","u":6},{"q":"ما الذي يجب على الإعلام تجنبه أثناء الأزمة؟","o":["نشر البيانات الرسمية وتحديثات الموقف","تجنب نشر معلومات قد تثير الذعر","الإعلان عن مراكز الإيواء","توحيد الرسائل بالتنسيق مع المتحدث الرسمي"],"c":1,"e":"من مسؤوليات الإعلام تجنب نشر معلومات قد تثير الذعر، أما الباقي فمن مهامه الأساسية.","quote":"تجنب نشر معلومات قد تثير الذعر.","u":6},{"q":"ما الذي تعطيه مؤسسات الطاقة الأولوية؟","o":["المصانع والمنشآت التجارية","الأحياء السكنية الأكثر كثافة","المستشفيات ومراكز الاتصالات ومحطات المياه","الطرق والجسور"],"c":2,"e":"مؤسسات الطاقة تعطي الأولوية للمستشفيات ومراكز الاتصالات ومحطات المياه في إمداد الطاقة.","quote":"إعطاء الأولوية للمستشفيات ومراكز الاتصالات ومحطات المياه.","u":6}],"def":[],"theory":[]},{"unit":7,"title":"","tf":[{"s":"القيادة أثناء الأزمة هي الجهة المسؤولة عن توجيه جميع الجهود نحو هدف مشترك.","a":true,"fix":"","quote":"القيادة هي الجهة المسؤولة عن توجيه جميع الجهود نحو هدف مشترك، واتخاذ القرارات الحاسمة في ظل ضغط الوقت ونقص المعلومات.","u":7},{"s":"التنسيق الرأسي هو التنسيق بين الجهات التي تعمل على المستوى الإداري نفسه.","a":false,"fix":"التنسيق الأفقي هو التنسيق بين الجهات التي تعمل على المستوى الإداري نفسه، أما التنسيق الرأسي فهو الذي يتم بين المستويات الإدارية المختلفة.","quote":"هو التنسيق بين الجهات التي تعمل على المستوى الإداري نفسه، مثل التنسيق بين الصحة والشرطة والحماية المدنية والنقل والكهرباء داخل المحافظة الواحدة.","u":7},{"s":"في التنسيق الرأسي، ترفع الجهات الميدانية بيانات الموقف والاحتياجات والخسائر إلى متخذي القرار.","a":true,"fix":"","quote":"من أسفل إلى أعلى: رفع بيانات الموقف الميداني، والاحتياجات، والخسائر، والتحديات إلى متخذي القرار.","u":7},{"s":"في مصفوفة RACI، الجهة المنفذة فعلياً للمهمة هي Accountable.","a":false,"fix":"في مصفوفة RACI، الجهة المنفذة فعلياً للمهمة هي Responsible، أما Accountable فهي الجهة المسؤولة نهائياً.","quote":"Responsible: الجهة المنفذة، وتنفذ المهمة فعلياً.","u":7},{"s":"فعالية إدارة الأزمة تعتمد على قيادة موحدة وتنسيق رأسي فعال وتنسيق أفقي متكامل.","a":true,"fix":"","quote":"قيادة موحدة + تنسيق رأسي فعال + تنسيق أفقي متكامل = استجابة سريعة ومنظمة وفعالة","u":7},{"s":"غرفة العمليات تحل محل الوزارات والجهات التنفيذية عند إدارة الأزمة لتوحيد القرار.","a":false,"fix":"غرفة العمليات لا تحل محل الوزارات أو الجهات التنفيذية، بل تعمل على توحيد الصورة العامة وربط الجهات ودعم اتخاذ القرار.","quote":"ولا يعني وجود غرفة العمليات أنها تحل محل الوزارات أو الجهات التنفيذية، بل تعمل على توحيد الصورة العامة، وربط الجهات، ودعم اتخاذ القرار، ومتابعة التنفيذ.","u":7},{"s":"تدعم غرفة العمليات القرار ولا تتجاوز الصلاحيات القانونية للقيادة المختصة.","a":true,"fix":"","quote":"غرفة العمليات تدعم القرار ولا تتجاوز الصلاحيات القانونية للقيادة المختصة.","u":7},{"s":"التدفق الرأسي الهابط يرفع بيانات الموقف الفعلي من الميدان إلى القيادة.","a":false,"fix":"التدفق الرأسي الصاعد هو الذي يرفع بيانات الموقف الفعلي من الميدان إلى القيادة، أما الهابط فينقل القرارات والتوجيهات.","quote":"تنتقل القرارات والتوجيهات من القيادة العليا إلى الوزارات والمحافظات والجهات التنفيذية وفرق الميدان.","u":7},{"s":"في التدفق الرأسي الصاعد، تنتقل المعلومات من فرق الاستجابة الميدانية إلى الإدارات المحلية، ثم إلى غرف العمليات والقيادة العليا.","a":true,"fix":"","quote":"تنتقل المعلومات من فرق الاستجابة الميدانية إلى الإدارات المحلية، ثم إلى غرف العمليات والقيادة العليا.","u":7},{"s":"يتم التدفق الأفقي للمعلومات بين المؤسسات العاملة على مستويات إدارية مختلفة.","a":false,"fix":"يتم التدفق الأفقي للمعلومات بين المؤسسات العاملة على المستوى الإداري نفسه.","quote":"يتم تبادل المعلومات بين المؤسسات العاملة على المستوى نفسه، مثل الصحة والشرطة والحماية المدنية والنقل والطاقة.","u":7},{"s":"الإسناد اللوجستي يعني توفير الاحتياجات والموارد الضرورية لتمكين فرق الاستجابة من أداء مهامها.","a":true,"fix":"","quote":"يعني توفير الاحتياجات والموارد الضرورية لتمكين فرق الاستجابة من أداء مهامها.","u":7},{"s":"الدعم الطبي العسكري يحل محل النظام الصحي المدني عندما تتجاوز أعداد المصابين قدرة المستشفيات المدنية.","a":false,"fix":"الدعم الطبي العسكري لا يحل محل النظام الصحي المدني، بل يزيد قدرته على التعامل مع الضغط الاستثنائي.","quote":"ولا يحل الدعم الطبي العسكري محل النظام الصحي المدني، بل يزيد قدرته على التعامل مع الضغط الاستثنائي.","u":7},{"s":"يتم إخلاء السكان بواسطة القوات المسلحة وحدها دون تنسيق مع الجهات المدنية.","a":false,"fix":"يتم الإخلاء بالتنسيق مع الشرطة والحماية المدنية والمحافظات والقطاع الصحي.","quote":"يتم الإخلاء بالتنسيق مع الشرطة والحماية المدنية والمحافظات والقطاع الصحي.","u":7},{"s":"تتولى القوات المسلحة تأمين المنشآت الحيوية بصفة دائمة دون الحاجة إلى تكليف رسمي.","a":false,"fix":"القوات المسلحة قد تُكلَّف بحماية بعض المنشآت الحيوية عند وجود تهديد كبير أو حاجة أمنية استثنائية، وليس بصفة دائمة ودون تكليف.","quote":"قد تُكلَّف القوات المسلحة بحماية بعض المنشآت الحيوية عند وجود تهديد كبير أو حاجة أمنية استثنائية.","u":7},{"s":"المساعدة الدولية تدعم جهود الدولة المتضررة ولا تحل محلها.","a":true,"fix":"","quote":"المساعدة الدولية تدعم جهود الدولة المتضررة ولا تحل محلها، وتُقدَّم بموافقتها وتحت تنسيقها.","u":7}],"mcq":[{"q":"وفق النص، ما الذي تحتاجه الأزمة الوطنية لمواجهتها؟","o":["قيادة موحدة ونظام تنسيق فعال","عدد أكبر من الجهات دون تحديد للقيادة","تقسيم الصلاحيات دون مسارات اتصال واضحة","قرارات متعددة تصدر من كل جهة على حدة"],"c":0,"e":"النص يربط الأزمة الوطنية بحاجتها إلى قيادة موحدة ونظام تنسيق فعال.","quote":"تحتاج الأزمة الوطنية إلى قيادة موحدة ونظام تنسيق فعال، لأن تعدد الجهات المشاركة دون تحديد واضح للقيادة ومسارات الاتصال قد يؤدي إلى تضارب القرارات، وتأخر الاستجابة، وتكرار الجهود، وسوء استخدام الموارد.","u":7},{"q":"من أهداف التنسيق أثناء الأزمة وفق النص:","o":["إلغاء توزيع المسؤوليات بين الجهات","الاكتفاء بجهة واحدة تنفذ جميع المهام","توحيد القرارات ومنع صدور توجيهات متعارضة","تقليل تدفق المعلومات إلى متخذي القرار"],"c":2,"e":"من أهداف التنسيق توحيد القرارات ومنع التوجيهات المتعارضة، وهو ما تذكره قائمة أهمية التنسيق.","quote":"توحيد القرارات ومنع صدور توجيهات متعارضة.","u":7},{"q":"في مثال إخلاء منطقة معرضة للسيول، ماذا ترفع المحافظة إلى القيادة بعد التنفيذ؟","o":["قرار الإخلاء نفسه قبل صدوره","قائمة بأسماء الوزارات المشاركة فقط","خطة لإعادة إعمار المنطقة بعد الأزمة","تقريراً عن أعداد السكان الذين تم إجلاؤهم والاحتياجات المتبقية"],"c":3,"e":"في مثال التنسيق الرأسي ترفع المحافظة تقريراً عن أعداد من تم إجلاؤهم والاحتياجات المتبقية.","quote":"ثم ترفع تقريراً عن أعداد السكان الذين تم إجلاؤهم والاحتياجات المتبقية.","u":7},{"q":"أثناء إخلاء مستشفى بسبب السيول، من يؤمّن الطرق؟","o":["وزارة الصحة","الشرطة","شركة الكهرباء","وزارة النقل"],"c":1,"e":"في المثال المذكور تؤمن الشرطة الطرق، بينما تنسق وزارة الصحة نقل المرضى وتوفر وزارة النقل المركبات.","quote":"أثناء إخلاء مستشفى بسبب السيول، تنسق وزارة الصحة عملية نقل المرضى، وتؤمن الشرطة الطرق","u":7},{"q":"في مصفوفة RACI، من الجهة التي تعتمد القرار وتتحمل المسؤولية النهائية؟","o":["Responsible","Accountable","Consulted","Informed"],"c":1,"e":"الجهة Accountable هي المسؤولة نهائياً وتعتمد القرار، بينما Responsible هي الجهة المنفذة.","quote":"Accountable: الجهة المسؤولة نهائياً، وتعتمد القرار وتتحمل المسؤولية النهائية.","u":7},{"q":"في الأوبئة والأزمات الصحية، من تكون الجهة الفنية القائدة وفق النص؟","o":["الحماية المدنية","المؤسسات الأمنية","وزارة الصحة","وزارة الطاقة"],"c":2,"e":"النص يحدد وزارة الصحة جهةً فنية قائدة في الأوبئة والأزمات الصحية.","quote":"في الأوبئة والأزمات الصحية تكون وزارة الصحة الجهة الفنية القائدة.","u":7},{"q":"ما دور غرفة العمليات تجاه القرار وفق النص؟","o":["رفع بدائل وتوصيات واضحة إلى صاحب السلطة في اتخاذ القرار","تنفيذ القرارات الميدانية بنفسها","الحلول محل الوزارات التنفيذية","إصدار قرارات الطوارئ بدلاً من القيادة"],"c":0,"e":"غرفة العمليات ترفع البدائل والتوصيات إلى صاحب السلطة ولا تصدر القرار بدلاً منه.","quote":"ثم ترفع بدائل وتوصيات واضحة إلى صاحب السلطة في اتخاذ القرار.","u":7},{"q":"ماذا تفعل غرفة العمليات بعد اعتماد القرارات؟","o":["إلغاء القرارات التي لم تُنفذ فوراً","إعلان حالة الطوارئ بصورة مستقلة","نشر البيانات الرسمية قبل اعتمادها","تحويل القرارات إلى مهام واضحة وتحديد الجهة المسؤولة عن كل مهمة"],"c":3,"e":"بعد اعتماد القرارات تحول غرفة العمليات القرارات إلى مهام وتحدد المسؤول عن كل مهمة.","quote":"بعد اعتماد القرارات، تتولى غرفة العمليات:","u":7},{"q":"في دورة تدفق المعلومات، أي مرحلة تُستبعد فيها الأخبار غير المؤكدة أو المتضاربة؟","o":["جمع المعلومات","التحقق من المعلومات","نشر القرارات والتعليمات","المتابعة والتغذية الراجعة"],"c":1,"e":"في مرحلة التحقق من المعلومات تتم المقارنة بين المصادر، ويتم استبعاد الأخبار غير المؤكدة أو المتضاربة.","quote":"مقارنة المعلومات الواردة من عدة مصادر، واستبعاد الأخبار غير المؤكدة أو المتضاربة","u":7},{"q":"أي خاصية من خصائص المعلومات الفعالة تعني أن يكون مصدر المعلومات وتوقيت ورودها معروفين؟","o":["الدقة","الاكتمال","إمكانية التتبع","الملاءمة"],"c":2,"e":"خاصية إمكانية التتبع تعني معرفة مصدر المعلومة وتوقيت ورودها.","quote":"إمكانية التتبع: أن يكون مصدر المعلومات وتوقيت ورودها معروفين.","u":7},{"q":"أي مما يلي يُعد من تحديات تدفق المعلومات وفق النص؟","o":["انتشار الشائعات أسرع من البيانات الرسمية","وصول التقارير الميدانية في وقتها المحدد","وضوح التعليمات الصادرة عن الجهات","تكامل قواعد البيانات بين الأنظمة"],"c":0,"e":"من تحديات تدفق المعلومات أن الشائعات تنتشر أسرع من البيانات الرسمية.","quote":"انتشار الشائعات أسرع من البيانات الرسمية.","u":7},{"q":"أي مستوى من مستويات التعاون يُستخدم عندما تكون الأزمة واسعة النطاق ولا يمكن التعامل معها من خلال دولة واحدة أو تعاون ثنائي؟","o":["التعاون الثنائي","التعاون الإقليمي","التعاون متعدد الأطراف","المساعدة الطارئة المحدودة"],"c":2,"e":"المستوى الرابع، أي التعاون متعدد الأطراف، يُستخدم في الأزمات واسعة النطاق التي لا تكفيها دولة واحدة أو تعاون ثنائي.","quote":"ويُستخدم هذا المستوى عندما تكون الأزمة واسعة النطاق، ولا يمكن التعامل معها من خلال دولة واحدة أو تعاون ثنائي","u":7},{"q":"أي مما يلي يندرج ضمن الدعم الهندسي الذي تقدمه القوات المسلحة؟","o":["إدارة شبكة الاتصالات المدنية","إصدار البيانات الرسمية للمواطنين","تحديد أسعار السلع الغذائية","إقامة الجسور والطرق المؤقتة"],"c":3,"e":"من الدعم الهندسي للقوات المسلحة إقامة الجسور والطرق المؤقتة.","quote":"إقامة الجسور والطرق المؤقتة.","u":7},{"q":"وفق النص، ماذا تفعل الفرق العسكرية المتخصصة في مجال البحث والإنقاذ؟","o":["الحلول محل فرق الحماية المدنية بصورة كاملة","المشاركة في البحث عن المفقودين وإنقاذ المحاصرين","تعويض المتضررين مالياً","إنشاء شبكات الطرق الدائمة"],"c":1,"e":"تشارك الفرق العسكرية المتخصصة في البحث عن المفقودين وإنقاذ المحاصرين، خاصةً في البيئات الخطرة.","quote":"تشارك الفرق العسكرية المتخصصة في البحث عن المفقودين وإنقاذ المحاصرين","u":7},{"q":"متى تلجأ الدولة إلى طلب المساعدة الدولية وفق النص؟","o":["عندما تكون الأزمة واسعة النطاق أو تتجاوز الاحتياجات قدراتها الوطنية","عند وقوع أي أزمة محلية صغيرة","عندما ترغب في تخفيض الإنفاق الوطني","عندما تستغني عن تقييم الموقف والاحتياجات"],"c":0,"e":"تلجأ الدولة إلى المساعدة الدولية عندما تكون الأزمة واسعة النطاق أو تتجاوز احتياجاتها قدراتها الوطنية.","quote":"تلجأ الدولة إلى طلب المساعدة الدولية عندما تكون الأزمة واسعة النطاق، أو عندما تتجاوز الاحتياجات قدراتها الوطنية ومواردها","u":7}],"def":[],"theory":[]}],"exams":[{"exam":1,"title":"امتحان 1: المفهوم والخصائص، والأزمة والكارثة والمنظور المؤسسي","tf":[{"s":"إدارة الكوارث منظومة مؤسسية مستدامة وليست رد فعل آني أو فوضوي.","a":true,"fix":"","quote":"إدارة الكوارث ليست رد فعل آني أو فوضوي يستند إلى الاجتهادات الشخصية أثناء وقوع الحدث، بل هي منظومة مؤسسية مستدامة تقوم على الآتي:","u":1},{"s":"يُعرّف المنظور المؤسسي إدارة الكوارث بأنها لجنة تُشكَّل وقت الطوارئ وتُفَضّ بعد انتهائها.","a":false,"fix":"يُعرّف المنظور المؤسسي إدارة الكوارث بأنها نظام عام مستمر، دائم، ومستدام بالدولة، وليست لجنة تشكَّل وقت الطوارئ وتُفَضّ بعد انتهائها.","quote":"المنظور المؤسسي يُعرف إدارة الكوارث على أنها “نظام عام مستمر، دائم، ومستدام بالدولة” وليست لجنة تشكل وقت الطوارئ وتُفض بعد انتهائها.","u":2},{"s":"الأزمة خلل يتطلب اتخاذ قرار سريع في ظل الشك وعدم يقين المعلومات وضغط الوقت الشديد.","a":true,"fix":"","quote":"الأزمة هي خلل يتطلب اتخاذ قرار سريع في ظل ظروف من الشك، وعدم يقين المعلومات، وضغط الوقت الشديد.","u":2},{"s":"الكارثة هي الأزمة التي يمكن للمؤسسة السيطرة عليها باستخدام الموارد المحلية المتاحة.","a":false,"fix":"الأزمة هي التي يمكن للمؤسسة أو الدولة السيطرة عليها باستخدام الموارد المحلية، أما الكارثة فتتجاوز كلياً قدرات الدولة أو الإقليم.","quote":"الحد الفاصل بين الأزمة والكارثة هو أن الكارثة تتجاوز كلياً القدرات والموارد الاستجابية للدولة أو الإقليم المحلي، مما يجبر النظام على إعلان حالة الطوارئ الوطنية وطلب أو قبول الدعم الإقليمي والدولي.","u":2},{"s":"التهديد لا يتحول إلى كارثة بمفرده، بل يحتاج إلى اصطدامه بشرط الهشاشة.","a":true,"fix":"","quote":"هو المسبب الخارجي (زلزال - سيول - فيروس)، ولكنه لا يتحول إلى “كارثة” بمفرده إلا إذا اصطدم بشرط “الهشاشة”.","u":2},{"s":"كلما زادت قدرة المواجهة ارتفعت احتمالية تحول التهديد إلى كارثة مدمرة.","a":false,"fix":"كلما زادت هشاشة البنية التحتية أو ضعف الإعداد المؤسسي ارتفعت احتمالية تحول التهديد إلى كارثة مدمرة، أما زيادة قدرة المواجهة فتقلل الخطر.","quote":"كلما زادت هشاشة البنية التحتية أو ضعف الإعداد المؤسسي (المقام)، ارتفعت احتمالية تحول التهديد الطبيعي أو البشري إلى “كارثة” مدمرة.","u":2},{"s":"تضارب الاختصاصات بين الجهات الأمنية والخدمية والأهلية قد يؤدي إلى هدر الموارد وتأخير الاستجابة في الساعات الأولى.","a":true,"fix":"","quote":"تداخل عمل الجهات الأمنية مع الخدمية مع الهيئات الأهلية، مما يؤدي إلى هدر الموارد، وتكرار الجهود، وتأخير الاستجابة في “الساعات الذهبية” الأولى للحدث.","u":2},{"s":"في الإدارة المؤسسية تعتمد القرارات على التقديرات الشخصية والانطباعية للقيادات الميدانية.","a":false,"fix":"في الإدارة الفردية تعتمد القرارات على التقديرات الشخصية والانطباعية، أما الإدارة المؤسسية فمرجعيتها أطر خطط الطوارئ وسيناريوهات المحاكاة.","quote":"التحرك فقط بعد وقوع الحدث، وتعتمد القرارات على التقديرات الشخصية للقيادات الميدانية دون وجود خطط مرجعية مسبقة.","u":2},{"s":"من مرتكزات المنظور المؤسسي وجود أطر تشريعية ملزمة تحدد مهام كل جهاز تنفيذي مسبقاً.","a":true,"fix":"","quote":"وجود أطر تشريعية ملزمة تحدد مهام كل جهاز تنفيذي بالدولة مسبقاً قبل وقوع الكارثة.","u":2},{"s":"تخصص الموازنات الطارئة لإدارة الأزمات وتخضع للدورة المستندية المعتادة أثناء وقوع الكارثة.","a":false,"fix":"تخصص الموازنات الطارئة لإدارة الأزمات وتكون مستقلة، ولا تخضع للدورة المستندية المعتادة أثناء وقوع الكارثة.","quote":"تخصيص موازنات وطنية ومبالغ طارئة ومستقلة لإدارة الأزمات، لا تخضع للدورة المستندية المعتادة أثناء وقوع الكارثة.","u":2}],"mcq":[{"q":"ما الذي يميز المنظور المؤسسي في إدارة الكوارث عن الرد الآني؟","o":["الاعتماد على الاجتهادات الشخصية أثناء الحدث","الاستمرارية: العمل الدائم قبل وأثناء وبعد الأزمة","الاكتفاء بتشكيل لجنة عند وقوع الطوارئ","التركيز على مرحلة التعافي فقط"],"c":1,"e":"الاستمرارية من خصائص المنظور المؤسسي، أي العمل الدائم قبل الأزمة وأثناءها وبعدها وليس عند وقوع الكارثة فقط.","quote":"العمل الدائم قبل وأثناء وبعد الأزمة (وليس فقط عند وقوع الكارثة).","u":1},{"q":"أي مما يلي يمثل الاستعداد والجاهزية وفق النص؟","o":["فرض أكواد البناء المقاوم للزلازل","تفعيل غرف العمليات فور وقوع الكارثة","إعداد خطط الطوارئ وإنشاء أنظمة الإنذار المبكر","إغلاق الملف الميداني بعد انتهاء الحدث"],"c":2,"e":"الاستعداد يشمل إعداد خطط الطوارئ وإنشاء أنظمة الإنذار المبكر وتدريب الكوادر تنفيذياً.","quote":"إعداد خطط الطوارئ، وإنشاء أنظمة الإنذار المبكر، وتدريب الكوادر تنفيذياً.","u":1},{"q":"ما المقصود بعنصر «الشفافية وتدفق المعلومات» في خصائص المؤسسية الناجحة؟","o":["حصر المعلومات داخل كل جهاز منفرداً","تأجيل الإعلان عن المعلومات حتى انتهاء الأزمة","نشر البيانات دون التحقق من دقتها","توحيد الخطاب الإعلامي ومنع الشائعات"],"c":3,"e":"يقوم عنصر الشفافية على توحيد الخطاب الإعلامي ومنع الشائعات.","quote":"توحيد الخطاب الإعلامي ومنع الشائعات.","u":1},{"q":"ما الحد الفاصل بين الأزمة والكارثة وفق النص؟","o":["تجاوز الكارثة كلياً قدرات الاستجابة المحلية","حجم الخسائر المادية فقط","عدد الضحايا المحدد بالأرقام","وقوعها في أكثر من محافظة"],"c":0,"e":"الكارثة تتجاوز كلياً القدرات والموارد الاستجابية للدولة أو الإقليم المحلي، وهذا هو الحد الفاصل.","quote":"الحد الفاصل بين الأزمة والكارثة هو أن الكارثة تتجاوز كلياً القدرات والموارد الاستجابية للدولة أو الإقليم المحلي، مما يجبر النظام على إعلان حالة الطوارئ الوطنية وطلب أو قبول الدعم الإقليمي والدولي.","u":2},{"q":"في معادلة الخطر «الخطر = [التهديد × الهشاشة] ÷ قدرة المواجهة»، ما الذي يمثله المقام؟","o":["التهديد (Hazard)","قدرة المواجهة (Capacity)","الخطر (Risk)","الهشاشة (Vulnerability)"],"c":1,"e":"المقام في المعادلة هو قدرة المواجهة (Capacity)، وكلما ارتفع الإعداد المؤسسي انخفض الخطر.","quote":"الخطر (Risk) = [التهديد (Hazard) × الهشاشة (Vulnerability)] ÷ قدرة المواجهة (Capacity)","u":2},{"q":"أي عبارة تصف الإدارة الفردية وفق الجدول المقارن في النص؟","o":["غرف عمليات مشتركة ورصد لحظي متكامل","مصفوفة موارد وطنية محددة ومحدثة رقمياً","جزر منعزلة وتكتم معلوماتي","تحليل الدروس المستفادة والتطوير المستمر"],"c":2,"e":"الإدارة الفردية التقليدية تتسم بجزر منعزلة وتكتم معلوماتي، بينما تتسم الإدارة المؤسسية بغرف عمليات مشتركة.","quote":"جزر منعزلة وتكتم معلوماتي","u":2},{"q":"أي مرتكز من مرتكزات المنظور المؤسسي يعني وجود تسلسل قيادي محدد وغرف عمليات موحدة؟","o":["المؤسسة القانونية","استدامية التخطيط","المرونة المالية","الهيكلة الواضحة"],"c":3,"e":"الهيكلة الواضحة تعني تسلسلاً قيادياً محدداً وغرف عمليات موحدة.","quote":"تسلسل قيادي محدد وغرف عمليات موحدة إدارة السيطرة.","u":2},{"q":"متى يحدث التخطيط والاستعداد وفق المنظور المؤسسي؟","o":["في ظروف الهدوء والتنسيق","تحت ضغط الأزمة مباشرة","بعد انتهاء الكارثة بعام","عند طلب المساعدة الدولية"],"c":0,"e":"التخطيط والاستعداد يحدث في ظروف الهدوء والتنسيق، وليس تحت ضغط الأزمة.","quote":"التخطيط والاستعداد يحدث في ظروف الهدوء والتنسيق، وليس تحت ضغط الأزمة.","u":2},{"q":"ما الأبعاد الرئيسية الأربعة التي تشكل هيكل المنظومة المؤسسية؟","o":["الوقائي، والاستعدادي، والاستجابي، والتعافي","التشريعي والسياسي، والتنظيمي، والمعلوماتي والتكنولوجي، والمالي والمادي","الإداري، والأمني، والصحي، والإعلامي","القيادي، والميداني، واللوجستي، والتعليمي"],"c":1,"e":"الأبعاد الأربعة هي التشريعي والسياسي، والتنظيمي، والمعلوماتي والتكنولوجي، والمالي والمادي.","quote":"لتطبيق المنظور المؤسسي في الدولة، يجب أن تتوافر أربعة أبعاد رئيسية تشكل هيكل المنظومة:","u":2},{"q":"وفق البعد التنظيمي، إلى أي جهة يتبع المركز الوطني الموحد لإدارة الأزمات والكوارث؟","o":["الوزارة الأكثر تضرراً في الأزمة","المحافظة المتضررة مباشرة","أعلى سلطة تنفيذية في الدولة","القطاع الخاص المشارك"],"c":2,"e":"ينص البعد التنظيمي على أن المركز الوطني الموحد يتبع أعلى سلطة تنفيذية في الدولة.","quote":"تأسيس مركز/مركز وطني موحد لإدارة الأزمات والكوارث يتبع أعلى سلطة تنفيذية في الدولة.","u":2}],"def":[{"q":"عرّف الأزمة والكارثة وفق المنظور المؤسسي، ثم اذكر تطبيقاً عملياً يوضح الفرق بينهما.","model":"الأزمة خلل يتطلب قراراً سريعاً في ظل الشك وعدم يقين المعلومات وضغط الوقت، ويمكن للدولة السيطرة عليها باستخدام مواردها المحلية. أما الكارثة فحدث صدمي يُحدث دماراً هائلاً في الأرواح أو الممتلكات أو البيئة، وتتجاوز كلياً قدرات الاستجابة المحلية فتستوجب إعلان حالة الطوارئ الوطنية وطلب الدعم الإقليمي والدولي. التطبيق: إذا استطاعت محافظة احتواء سيول بمواردها المحلية فهي أزمة، أما إذا تجاوزت السيول قدرات المحافظة وأجبرت الدولة على إعلان الطوارئ الوطنية فقد أصبحت كارثة وفق الحد الفاصل الوارد في النص.","u":2}],"research":[{"q":"حلل كيف يسهم الانتقال من العمل الفردي إلى المنظور المؤسسي في تقليل الخسائر، مستنداً إلى المقارنة الواردة في النص.","model":"يقوم العمل الفردي على الرد بعد وقوع الحدث وعلى التقديرات الشخصية دون خطط مرجعية، مما يؤدي إلى تضارب الاختصاصات وتأخير الاستجابة في الساعات الذهبية. أما المنظور المؤسسي فيبدأ التفكير قبل الكارثة بسنوات، ويعتمد على أطر خطط الطوارئ وسيناريوهات المحاكاة، ويربط الجهات عبر غرف عمليات مشتركة ورصد لحظي. وبذلك يقل هدر الموارد وتكرار الجهود، وتصبح الاستجابة أسرع وأكثر تنظيماً، ويتيح تحليل الدروس المستفادة تطوير الأداء باستمرار.","u":2}],"choose":[{"q":"اختر أحد السؤالين التاليين وأجب عنه: (أ) وضّح الأبعاد الأربعة للمنظور المؤسسي. (ب) اشرح كيف تؤدي الإدارة الفردية إلى تضارب الاختصاصات وتأخير الاستجابة.","model":"(أ) الأبعاد الأربعة هي: البعد التشريعي والسياسي الذي يمنح هيئات إدارة الكوارث صلاحيات الإخلاء وتوجيه الموارد وإعلان الطوارئ، والبعد التنظيمي بتأسيس مركز وطني موحد يتبع أعلى سلطة تنفيذية، والبعد المعلوماتي والتكنولوجي بأنظمة الإنذار المبكر وقاعدة بيانات وطنية، والبعد المالي والمادي بموازنات طارئة وصناديق للتعافي.","u":2},{"q":"اشرح دور الجهات العاملة بمعزل عن بعضها في تأخير الاستجابة، وفق ما ورد في النص.","model":"تعمل الجهات في الإدارة الفردية كجزر منعزلة مع تكتم معلوماتي، فيتداخل عمل الجهات الأمنية مع الخدمية والهيئات الأهلية دون تحديد للاختصاصات. ويؤدي ذلك إلى هدر الموارد وتكرار الجهود وتأخير الاستجابة في الساعات الذهبية الأولى للحدث، بينما تتطلب المؤسسية تنسيقاً مستمراً وغرف عمليات مشتركة.","u":2}]},{"exam":2,"title":"امتحان 2: دورة حياة الكارثة والهيكل الوطني لإدارة الأزمات","tf":[{"s":"تهدف إجراءات مرحلة الوقاية والتخفيف إلى إجراءات طويلة المدى لتقليل احتمالية وقوع التهديد أو تقليل آثاره.","a":true,"fix":"","quote":"إجراءات طويلة المدى تهدف لتقليل احتمالية وقوع التهديد أو تقليل آثاره.","u":3},{"s":"تتعامل مرحلة الاستعداد والجاهزية مع إنقاذ الأرواح وإخلاء المناطق المتأثرة بعد وقوع الكارثة.","a":false,"fix":"إنقاذ الأرواح وإخلاء المناطق المتأثرة من أعمال مرحلة الاستجابة الطارئة، أما مرحلة الاستعداد فتتضمن التدريبات والمحاكاة ومراجعة صلاحية المعدات.","quote":"إنقاذ الأرواح وإخلاء المناطق المتأثرة.","u":3},{"s":"من أعمال مرحلة التعافي وإعادة الإعمار تقييم الأداء المؤسسي وصياغة ملف الدروس المستفادة.","a":true,"fix":"","quote":"تقييم الأداء المؤسسي وصياغة ملف “الدروس المستفادة” لتعديل الخطط المستقبلية.","u":3},{"s":"تشمل مرحلة التعافي وإعادة الإعمار تنفيذ تدريبات ومحاكاة ميدانية افتراضية.","a":false,"fix":"تنفيذ التدريبات والمحاكاة الميدانية الافتراضية من أعمال مرحلة الاستعداد والجاهزية، أما التعافي فيشمل الدعم النفسي وإعادة بناء المنطقة بشروط أفضل.","quote":"تنفيذ تدريبات ومحاكاة ميدانية افتراضية.","u":3},{"s":"المبدأ الحاكم للهيكل الوطني لإدارة الأزمات هو وحدة القيادة وتكامل الأداء.","a":true,"fix":"","quote":"المبدأ الحاكم هو “وحدة القيادة وتكامل الأداء.”","u":4},{"s":"يُنشأ هيكل وطني جديد لكل أزمة على حدة لأن الهيكل القائم لا يصلح لأنواع أخرى من الكوارث.","a":false,"fix":"الهيكل الوطني قابل للتعامل مع أي نوع من الكوارث دون الحاجة لتأسيس هيكل جديد لكل أزمة.","quote":"أن يكون الهيكل قابلاً للتعامل مع أي نوع من الكوارث (طبيعية كـ الزلازل والسيول، أو بشرية كـ الحوادث الكبرى والإرهاب، أو صحية كـ الجوائح)، دون الحاجة لتأسيس هيكل جديد لكل أزمة.","u":4},{"s":"المركز الوطني لإدارة الأزمات جهاز مستمر يعمل على مدار الساعة تحت إدارة خبراء وممثلين دائمين عن الوزارات.","a":true,"fix":"","quote":"جهاز أو مركز دائري مستمر يعمل 7/24 تحت إدارة خبراء وممثلين دائمين عن كافة الوزارات.","u":4},{"s":"يتولى المستوى الميداني إعلان حالة الطوارئ أو الكارثة القومية وتوجيه الموارد المالية والعسكرية الشاملة.","a":false,"fix":"يتولى المستوى الاستراتيجي إعلان حالة الطوارئ أو الكارثة القومية، أما المستوى الميداني فيتولى تنفيذ عمليات الإنقاذ والإخلاء والإغاثة.","quote":"إعلان حالة الطوارئ أو الكارثة القومية.","u":4},{"s":"ينبغي أن يشرف القيادي الواحد على عدد كبير من الأفراد لضمان تركيز السيطرة.","a":false,"fix":"لا ينبغي أن يشرف القيادي الواحد على أكثر من 3 إلى 7 أفراد أو فرق عمل لضمان تركيز السيطرة.","quote":"ألا يشرف القيادي الواحد على أكثر من 3 إلى 7 أفراد أو فرق عمل لضمان تركيز السيطرة.","u":4},{"s":"يتكون الهيكل الوطني الناجح من ثلاثة مستويات قيادية وتنفيذية مترابطة.","a":true,"fix":"","quote":"يتكون الهيكل الوطني الناجح من 3 مستويات قيادية وتنفيذية مترابطة:","u":4}],"mcq":[{"q":"في أي مرحلة من مراحل دورة حياة الكارثة تُنفَّذ التدريبات والمحاكاة الميدانية الافتراضية؟","o":["الوقاية والتخفيف","الاستجابة الطارئة","الاستعداد والجاهزية","التعافي وإعادة الإعمار"],"c":2,"e":"التدريبات والمحاكاة الميدانية الافتراضية من أعمال مرحلة الاستعداد والجاهزية.","quote":"تنفيذ تدريبات ومحاكاة ميدانية افتراضية.","u":3},{"q":"ما المدخل الذي يصف مرحلة الوقاية والتخفيف؟","o":["الساعات والأيام الأولى لوقوع الكارثة","الإجراءات المتخذة لتجهيز الأجهزة والأفراد للتدخل السريع","العودة للتوازن وإعادة بناء المنطقة المتضررة","إجراءات طويلة المدى تهدف لتقليل احتمالية وقوع التهديد أو تقليل آثاره"],"c":3,"e":"مدخل مرحلة الوقاية والتخفيف هو الإجراءات طويلة المدى التي تقلل احتمالية وقوع التهديد أو آثاره.","quote":"إجراءات طويلة المدى تهدف لتقليل احتمالية وقوع التهديد أو تقليل آثاره.","u":3},{"q":"أي الأعمال التالية تندرج تحت مرحلة الاستجابة الطارئة؟","o":["تقديم الخدمات الطبية العاجلة وإدارة المستشفيات الميدانية","صياغة ملف الدروس المستفادة","إزالة الأنقاض وإعادة بناء البنية التحتية","تطبيق أكواد البناء المقاوم للزلازل"],"c":0,"e":"تقديم الخدمات الطبية العاجلة وإدارة المستشفيات الميدانية من أعمال مرحلة الاستجابة الطارئة.","quote":"تقديم الخدمات الطبية العاجلة وإدارة المستشفيات الميدانية.","u":3},{"q":"ما الهدف الذي يحدده النص لمرحلة التعافي وإعادة الإعمار؟","o":["منع الكارثة قبل وقوعها","العودة للتوازن وإعادة بناء المنطقة المتضررة بشروط أفضل مما كانت عليه","توزيع المواد الغذائية والخيام","رفع جاهزية الكوادر بالتدريب"],"c":1,"e":"تهدف مرحلة التعافي إلى العودة للتوازن وإعادة بناء المنطقة بشروط أفضل مما كانت عليه.","quote":"العودة للتوازن وإعادة بناء المنطقة المتضررة بشروط أفضل مما كانت عليه.","u":3},{"q":"ما المبدأ الحاكم للهيكل الوطني لإدارة الأزمات؟","o":["المركزية المطلقة في كل التفاصيل","تأسيس هيكل جديد لكل أزمة","وحدة القيادة وتكامل الأداء","الفصل بين الوزارات لتسهيل العمل"],"c":2,"e":"المبدأ الحاكم للهيكل الوطني هو وحدة القيادة وتكامل الأداء.","quote":"المبدأ الحاكم هو “وحدة القيادة وتكامل الأداء.”","u":4},{"q":"أي المستويات الثلاثة للهيكل الوطني تتولى إعلان حالة الطوارئ أو الكارثة القومية؟","o":["المستوى الميداني / التنفيذي","المستوى التنسيقي / التكتيكي","المستوى الإعلامي","المستوى الاستراتيجي (السياسي / القيادي)"],"c":3,"e":"إعلان حالة الطوارئ أو الكارثة القومية من مهام المستوى الاستراتيجي.","quote":"إعلان حالة الطوارئ أو الكارثة القومية.","u":4},{"q":"ما المهمة الأساسية للمركز الوطني لإدارة الأزمات بوصفه المستوى التنسيقي؟","o":["التنسيق بين كافة أجهزة الدولة لضمان عدم تضارب القرارات","إعلان حالة الطوارئ بمفرده","التنفيذ المباشر لعمليات الإخلاء","تحديد المسؤوليات المالية للمحافظات"],"c":0,"e":"من مهام المستوى التنسيقي التنسيق بين كافة أجهزة الدولة لضمان عدم تضارب القرارات.","quote":"التنسيق بين كافة أجهزة الدولة لضمان عدم تضارب القرارات.","u":4},{"q":"وفق نظام قيادة الحوادث الميداني، ما الذي يتولاه قسم التخطيط؟","o":["المنفذون والإخلاء والفرق الطبية","جمع البيانات، تقييم تطور الكارثة، ووضع خطة العمل للفترة القادمة","الإمدادات والوقود وشبكات الاتصال","التعويضات وتوثيق التكاليف"],"c":1,"e":"يتولى قسم التخطيط جمع البيانات وتقييم تطور الكارثة ووضع خطة العمل للفترة القادمة.","quote":"جمع البيانات، تقييم تطور الكارثة، ووضع خطة العمل للفترة القادمة.","u":4},{"q":"وفق شروط نجاح الهيكل الوطني، كم عدد الأفراد أو فرق العمل الذي ينبغي أن يشرف عليه القيادي الواحد كحد أقصى؟","o":["أكثر من 20 فرداً","لا يوجد حد محدد لنطاق الإشراف","من 3 إلى 7 أفراد أو فرق عمل","فرد واحد فقط في كل فريق"],"c":2,"e":"ينص النص على ألا يشرف القيادي الواحد على أكثر من 3 إلى 7 أفراد أو فرق عمل لضمان تركيز السيطرة.","quote":"ألا يشرف القيادي الواحد على أكثر من 3 إلى 7 أفراد أو فرق عمل لضمان تركيز السيطرة.","u":4},{"q":"أي وظيفة من وظائف الهيكل الوطني الأربع تتعلق بتوحيد الخطاب الإعلامي للدولة؟","o":["إدارة المخاطر والتنبؤ الاستباقي","التخطيط وبناء السيناريوهات","إدارة اللوجستيات والموارد القومية","إدارة الاتصال والأزمات الإعلامية"],"c":3,"e":"وظيفة إدارة الاتصال والأزمات الإعلامية تقوم على توحيد الخطاب الإعلامي للدولة عبر متحدث رسمي.","quote":"توحيد الخطاب الإعلامي للدولة عبر متحدث رسمي باسم المركز الوطني.","u":4}],"def":[{"q":"عرّف الهيكل الوطني لإدارة الأزمات، ثم اذكر مستوى من مستوياته الثلاثة وكيف يطبّق دوره في أثناء الكارثة.","model":"الهيكل الوطني هو الإطار المؤسسي المعترف به رسمياً وقانونياً بالدولة، والذي يربط السلطات التنفيذية والأمنية والخدمية والاجتماعية ضمن شبكة قيادية موحدة تعمل وفق سياسات واستراتيجية مسبقة. ومن مستوياته المستوى الميداني / التنفيذي، ويتولى تنفيذ عمليات الإنقاذ والإخلاء والإغاثة، ويرفع تقارير موقف لحظية للمركز الوطني، كأن تنفذ المحافظة قرار إخلاء منطقة متضررة عبر فرق الدفاع المدني والمستشفيات ثم ترفع تقرير أعداد المجلَّين.","u":4}],"research":[{"q":"ناقش العلاقة بين مراحل دورة حياة الكارثة والهيكل الوطني لإدارة الأزمات، وبيّن لماذا تحتاج الدولة إلى القيادة الموحدة والتنسيق قبل وقوع الكارثة وأثناءها.","model":"ترتبط مراحل دورة حياة الكارثة بالهيكل الوطني، فالمستوى الاستراتيجي يعلن حالة الطوارئ، والمستوى التنسيقي (المركز الوطني) يعمل بصورة دائمة لتقييم المخاطر وصياغة السيناريوهات، والمستوى الميداني ينفذ الإنقاذ والإخلاء. وتحتاج الدولة إلى القيادة الموحدة قبل الكارثة لأن الاستعداد يتطلب تدريبات ومراجعة للمعدات والتنسيق بين الأجهزة، لأن التخطيط يحدث في ظروف الهدوء وليس تحت ضغط الأزمة. وأثناء الكارثة يمنع التنسيق تضارب القرارات، وبذلك تستمر الخدمات الأساسية ويتحقق تكامل الأداء.","u":4}],"choose":[{"q":"اختر أحد السؤالين التاليين وأجب عنه: (أ) اذكر الأعمال المؤسسية لمرحلة الاستجابة الطارئة. (ب) اذكر أعمال مرحلة التعافي وإعادة الإعمار.","model":"(أ) تشمل الاستجابة الطارئة إنقاذ الأرواح وإخلاء المناطق المتأثرة، وتقديم الخدمات الطبية العاجلة وإدارة المستشفيات الميدانية، وتأمين المرافق الأساسية كالكهرباء والمياه والاتصالات ومنع السرقة وانهيار الأمن. (ب) يشمل التعافي الدعم النفسي والاجتماعي للمتضررين وتوفير سكن بديل، وإزالة الأنقاض وإعادة بناء البنية التحتية بنماذج أكثر صلابة، وتقييم الأداء المؤسسي وصياغة ملف الدروس المستفادة.","u":3},{"q":"اختر أحد السؤالين التاليين وأجب عنه: (أ) اشرح مستويات الهيكل الوطني الثلاثة وكيف ترتبط ببعضها أثناء الأزمة. (ب) اذكر الوظائف الأربع الجوهرية للهيكل الوطني.","model":"(أ) المستوى الاستراتيجي (السياسي / القيادي) يضم رئيس مجلس الوزراء والوزراء المعنيين ورؤساء الأجهزة الأمنية ويتخذ القرارات السيادية. والمستوى التنسيقي (المركز الوطني لإدارة الأزمات) يعمل 7/24 ويجمع البيانات ويعرض البدائل على القيادة. والمستوى الميداني (المحافظات والميدان) ينفذ عمليات الإنقاذ ويرفع تقارير الموقف، فيرتبط المستويات بتدفق القرارات للأسفل والمعلومات للأعلى. (ب) الوظائف الأربع هي: إدارة المخاطر والتنبؤ الاستباقي، والتخطيط وبناء السيناريوهات، وإدارة الاتصال والأزمات الإعلامية، وإدارة اللوجستيات والموارد القومية.","u":4}]},{"exam":3,"title":"امتحان 3: منظومة إدارة الأزمات ومراحلها (الوقاية، الاستعداد، الاستجابة، التعافي)","tf":[{"s":"الوقاية والتخفيف إجراءات تُتخذ قبل وقوع الأزمة لمنع حدوثها قدر الإمكان، أو تقليل احتمالية وقوعها وحجم أضرارها إذا تعذر منعها.","a":true,"fix":"","quote":"هي الإجراءات التي تُتخذ قبل وقوع الأزمة لمنع حدوثها قدر الإمكان، أو تقليل احتمالية وقوعها وحجم أضرارها إذا تعذر منعها.","u":5},{"s":"التخفيف يجهز الدولة للتعامل مع الخطر إذا وقع، بينما الاستعداد يقلل الخطر نفسه.","a":false,"fix":"التخفيف يقلل الخطر نفسه، بينما الاستعداد يجهز الدولة للتعامل معه إذا وقع.","quote":"التخفيف يقلل الخطر نفسه، بينما الاستعداد يجهز الدولة للتعامل معه إذا وقع.","u":5},{"s":"تبدأ مرحلة الاستجابة عند وقوع الأزمة أو ظهور مؤشرات مؤكدة على قرب وقوعها.","a":true,"fix":"","quote":"تبدأ هذه المرحلة عند وقوع الأزمة أو ظهور مؤشرات مؤكدة على قرب وقوعها، وتشمل الإجراءات العاجلة للسيطرة على الموقف وتقليل الخسائر.","u":5},{"s":"تبدأ مرحلة التعافي وإعادة الإعمار قبل السيطرة على الخطر المباشر لتسريع عودة الحياة الطبيعية.","a":false,"fix":"تبدأ مرحلة التعافي وإعادة الإعمار بعد السيطرة على الخطر المباشر، وتهدف إلى إعادة المجتمع والدولة للعمل بصورة طبيعية.","quote":"تبدأ بعد السيطرة على الخطر المباشر، وتهدف إلى إعادة المجتمع والدولة للعمل بصورة طبيعية، مع معالجة الآثار طويلة الأجل للأزمة.","u":5},{"s":"من إجراءات مرحلة الاستعداد والجاهزية تحديد طرق الإخلاء ومراكز الإيواء.","a":true,"fix":"","quote":"تحديد طرق الإخلاء ومراكز الإيواء.","u":5},{"s":"من أهداف مرحلة الاستجابة إعادة فتح المدارس والمستشفيات ومواقع العمل.","a":false,"fix":"إعادة فتح المدارس والمستشفيات ومواقع العمل من إجراءات مرحلة التعافي، أما الاستجابة فهدفها إنقاذ الأرواح وحماية الممتلكات واحتواء الأزمة.","quote":"إعادة فتح المدارس والمستشفيات ومواقع العمل.","u":5},{"s":"من إجراءات مرحلة الاستجابة إصدار التحذيرات والتعليمات الرسمية.","a":true,"fix":"","quote":"إصدار التحذيرات والتعليمات الرسمية.","u":5},{"s":"الهدف الرئيسي لمرحلة الوقاية هو إنقاذ الأرواح مباشرة بعد وقوع الأزمة.","a":false,"fix":"الهدف الرئيسي لمرحلة الوقاية هو حماية الأرواح والممتلكات والبنية التحتية وتقليل الخسائر الاقتصادية والاجتماعية، أما إنقاذ الأرواح فهدف مرحلة الاستجابة.","quote":"حماية الأرواح والممتلكات والبنية التحتية، وتقليل الخسائر الاقتصادية والاجتماعية.","u":5},{"s":"من إجراءات مرحلة التعافي إجراء تقييم شامل للأضرار والاحتياجات.","a":true,"fix":"","quote":"إجراء تقييم شامل للأضرار والاحتياجات.","u":5},{"s":"في مرحلة الاستعداد يُنفَّذ إصلاح الطرق والمنازل وتعويض المتضررين.","a":false,"fix":"في مرحلة التعافي يُنفَّذ إصلاح الطرق والمنازل وتعويض المتضررين، أما الاستعداد فيشمل إعداد خطط الطوارئ والتدريب والمحاكاة.","quote":"بعد انتهاء السيول، يتم إصلاح الطرق والمنازل وشبكات المرافق، وتعويض المتضررين، ثم تطوير شبكات التصريف لمنع تكرار الخسائر نفسها.","u":5}],"mcq":[{"q":"ما الفرق الأساسي بين الوقاية والتخفيف والاستعداد والجاهزية وفق النص؟","o":["الوقاية تُنفَّذ بعد وقوع الأزمة فقط","كلاهما يقتصر على الإعلام والتوعية","الاستعداد يقلل الخطر نفسه، والتخفيف يجهز الدولة للتعامل معه","التخفيف يقلل الخطر نفسه، والاستعداد يجهز الدولة للتعامل معه إذا وقع"],"c":3,"e":"التخفيف يقلل الخطر نفسه، بينما الاستعداد يجهز الدولة للتعامل معه إذا وقع.","quote":"التخفيف يقلل الخطر نفسه، بينما الاستعداد يجهز الدولة للتعامل معه إذا وقع.","u":5},{"q":"ما الهدف الأساسي لمرحلة الاستجابة وفق النص؟","o":["إنقاذ الأرواح، حماية الممتلكات، احتواء الأزمة، وضمان استمرار الخدمات الأساسية","إعادة بناء المنشآت بصورة أفضل","تقييم أداء الجهات واستخلاص الدروس","تطوير شبكات التصريف والطرق"],"c":0,"e":"تهدف الاستجابة إلى إنقاذ الأرواح وحماية الممتلكات واحتواء الأزمة وضمان استمرار الخدمات الأساسية.","quote":"إنقاذ الأرواح، حماية الممتلكات، احتواء الأزمة، وضمان استمرار الخدمات الأساسية.","u":5},{"q":"أي الإجراءات التالية يندرج تحت مرحلة الاستعداد والجاهزية؟","o":["إعادة فتح المدارس والمستشفيات","إعداد خطط الطوارئ والاستجابة الوطنية","تقييم الأضرار والاحتياجات","إصلاح شبكات الكهرباء والمياه"],"c":1,"e":"من إجراءات الاستعداد والجاهزية إعداد خطط الطوارئ والاستجابة الوطنية.","quote":"إعداد خطط الطوارئ والاستجابة الوطنية.","u":5},{"q":"أي الإجراءات التالية ورد ضمن إجراءات مرحلة التعافي وإعادة الإعمار؟","o":["إخلاء المناطق المهددة وإغلاق الطرق الخطرة","تفعيل مركز إدارة الأزمات","إجراء تقييم شامل للأضرار والاحتياجات","إصدار التحذيرات الرسمية"],"c":2,"e":"من إجراءات مرحلة التعافي وإعادة الإعمار: إجراء تقييم شامل للأضرار والاحتياجات.","quote":"إجراء تقييم شامل للأضرار والاحتياجات.","u":5},{"q":"وفق مثال السيول في مرحلة الاستجابة، أي الإجراءات التالية ورد ذكره؟","o":["تحديد المناطق المهددة مسبقاً","تعويض المتضررين","تطوير شبكات التصريف","إغلاق الطرق الخطرة وإخلاء المناطق المهددة"],"c":3,"e":"يذكر المثال إخلاء المناطق المهددة وإغلاق الطرق الخطرة مع إنقاذ المتضررين.","quote":"عند وقوع السيول، يتم إخلاء المناطق المهددة، وإغلاق الطرق الخطرة، وإنقاذ المتضررين، وتوفير مراكز إيواء وخدمات طبية عاجلة.","u":5},{"q":"وفق مثال الاستعداد قبل موسم السيول، ما الإجراء المذكور؟","o":["اختبار أجهزة الإنذار وتجهيز فرق الإنقاذ","تطوير شبكات التصريف","إصلاح الطرق والمنازل","إغلاق الطرق الخطرة"],"c":0,"e":"قبل موسم السيول يتم اختبار أجهزة الإنذار وتجهيز فرق الإنقاذ وتحديد مراكز الإيواء.","quote":"قبل موسم السيول، يتم اختبار أجهزة الإنذار، وتجهيز فرق الإنقاذ، وتحديد مراكز الإيواء، والتأكد من جاهزية سيارات الإسعاف والمعدات.","u":5},{"q":"ما المخرج الرئيسي لمرحلة الوقاية والتخفيف؟","o":["خطط طوارئ معتمدة وفرق مدربة","تقييم وطني للمخاطر وخرائط المخاطر","استعادة الحياة الطبيعية","احتواء الأزمة وتقليل الإصابات"],"c":1,"e":"من المخرجات الرئيسية للوقاية والتخفيف تقييم وطني للمخاطر وخرائط المخاطر.","quote":"تقييم وطني للمخاطر، وخرائط المخاطر، وإجراءات قانونية، وخطط لتقليل الخسائر.","u":5},{"q":"أي مرحلة تُعنى بمعالجة الآثار طويلة الأجل للأزمة وإعادة البناء بصورة أفضل؟","o":["الوقاية والتخفيف","الاستعداد والجاهزية","التعافي وإعادة الإعمار","الاستجابة"],"c":2,"e":"مرحلة التعافي وإعادة الإعمار هي التي تعالج الآثار طويلة الأجل للأزمة.","quote":"تبدأ بعد السيطرة على الخطر المباشر، وتهدف إلى إعادة المجتمع والدولة للعمل بصورة طبيعية، مع معالجة الآثار طويلة الأجل للأزمة.","u":5},{"q":"ما المعيار الذي يحدد بداية مرحلة الاستجابة؟","o":["انتهاء الأزمة بالكامل","تقييم الأضرار والاحتياجات","الإعلان عن الميزانية الطارئة","عند وقوع الأزمة أو ظهور مؤشرات مؤكدة على قرب وقوعها"],"c":3,"e":"تبدأ الاستجابة عند وقوع الأزمة أو ظهور مؤشرات مؤكدة على قرب وقوعها.","quote":"تبدأ هذه المرحلة عند وقوع الأزمة أو ظهور مؤشرات مؤكدة على قرب وقوعها، وتشمل الإجراءات العاجلة للسيطرة على الموقف وتقليل الخسائر.","u":5},{"q":"أي الأمثلة التالية يوضح إجراءات مرحلة الوقاية والتخفيف؟","o":["إنشاء شبكات تصريف ومنع البناء في مجاري السيول","إخلاء المناطق المهددة وإغلاق الطرق الخطرة","إصلاح الطرق والمنازل بعد انتهاء السيول","توفير مراكز إيواء وخدمات طبية عاجلة"],"c":0,"e":"المثال الوارد للوقاية يشمل إنشاء شبكات تصريف ومنع البناء في مجاري السيول ومراقبة الأحوال الجوية.","quote":"منع أو تخفيف أضرار السيول، يتم إنشاء شبكات تصريف، ومنع البناء في مجاري السيول، ومراقبة الأحوال الجوية، وتحديد المناطق المهددة مسبقاً.","u":5}],"def":[{"q":"عرّف مرحلة الاستجابة في منظومة إدارة الأزمات على المستوى الوطني، ثم اذكر مثالاً تطبيقياً على إجراءاتها.","model":"مرحلة الاستجابة تبدأ عند وقوع الأزمة أو ظهور مؤشرات مؤكدة على قرب وقوعها، وتشمل الإجراءات العاجلة للسيطرة على الموقف وتقليل الخسائر، وهدفها إنقاذ الأرواح وحماية الممتلكات واحتواء الأزمة وضمان استمرار الخدمات الأساسية. ومثالها عند وقوع السيول: إخلاء المناطق المهددة، وإغلاق الطرق الخطرة، وإنقاذ المتضررين، وتوفير مراكز إيواء وخدمات طبية عاجلة.","u":5}],"research":[{"q":"حلل العلاقة بين مراحل الوقاية والاستعداد والاستجابة والتعافي في منظومة إدارة الأزمات، مبيناً كيف تؤثر نتائج كل مرحلة في المرحلة التالية.","model":"تقلل الوقاية والتخفيف احتمالية الأزمة وحجم الخسائر عبر التقييم الوطني للمخاطر وخرائط المخاطر والتشريعات الوقائية. ويجهز الاستعداد الدولة للتعامل مع الأزمة إذا وقعت بخطط طوارئ معتمدة وفرق مدربة وموارد جاهزة. ثم تحتوي الاستجابة الأزمة بتفعيل خطط الطوارئ وتنفيذ الإنقاذ والإخلاء. وأخيراً يعالج التعافي الآثار طويلة الأجل ويستخلص الدروس، فتُحدَّث خطط الطوارئ والتشريعات بناءً على النتائج، ويُعاد البناء بصورة أكثر قدرة على مواجهة الأزمات المستقبلية.","u":5}],"choose":[{"q":"اختر أحد السؤالين التاليين وأجب عنه: (أ) عرّف الوقاية والتخفيف من المخاطر، واذكر أهم إجراءاته. (ب) اشرح الفرق بين الاستجابة والتعافي وإعادة الإعمار من حيث الهدف والتوقيت.","model":"(أ) الوقاية والتخفيف إجراءات تُتخذ قبل
