 خلال تنسيق الأدوار وتبادل الموارد والمعلومات، ويُستخدم هذا المستوى عندما تكون الأزمة واسعة النطاق، ولا يمكن التعامل معها من خلال دولة واحدة أو تعاون ثنائي، ويهدف فقط إلى توحيد الجهود وتوزيع المسؤوليات والاستفادة من إمكانات جميع الأطراف المشاركة.<\/p><h4>3 - المنظمات الإقليمية ودورها في إدارة الأزمات<\/h4><p>المنظمات الإقليمية هي تجمعات تضم عدداً من الدول ترتبط بموقع جغرافي أو مصالح مشتركة، وتساعد في تنسيق الجهود عند وقوع أزمة تؤثر في دولة أو أكثر داخل الإقليم.<\/p><p><b>أمثلة على المنظمات الإقليمية:<\/b><\/p><ul><li><b>جامعة الدول العربية:<\/b> تنسق المواقف والجهود المشتركة بين الدول العربية في مواجهة الأزمات السياسية والإنسانية والأمنية.<\/li><li><b>الاتحاد الأفريقي:<\/b> يدعم الدول الأفريقية في التعامل مع النزاعات والكوارث والأزمات الإنسانية، ويشجع التعاون بينها.<\/li><li><b>الاتحاد الأوروبي:<\/b> ينسق بين الدول الأعضاء في مجالات الأمن والصحة والطاقة والكوارث، ويقدم الدعم للدول المتضررة.<\/li><li><b>منظمة التعاون الإسلامي:<\/b> تعزز التعاون بين الدول الأعضاء، وتساهم في تقديم الدعم السياسي والإنساني أثناء الأزمات.<\/li><li><b>المنظمات الإقليمية الأخرى:<\/b> تساعد الدول الواقعة داخل نطاقها على تنسيق الاستجابة وفق طبيعة الأزمة واحتياجات المنطقة.<\/li><\/ul><h4>4 - آليات طلب المساعدة الدولية<\/h4><p>تلجأ الدولة إلى طلب المساعدة الدولية عندما تكون الأزمة واسعة النطاق، أو عندما تتجاوز الاحتياجات قدراتها الوطنية ومواردها، ويتم ذلك وفقاً للقوانين الوطنية والاتفاقيات الدولية، مع احترام سيادة الدولة المتضررة.<\/p><h4>خطوات طلب المساعدة الدولية<\/h4><h4>1 - تقييم الموقف والاحتياجات<\/h4><p>تقوم الجهات الوطنية بتحديد:<\/p><ul><li>حجم الأزمة والأضرار.<\/li><li>الموارد المتاحة محلياً.<\/li><li>الفجوة بين الاحتياجات والقدرات الوطنية.<\/li><li>نوع المساعدة المطلوبة ودرجة استعجالها.<\/li><\/ul><h4>2 - اتخاذ القرار الرسمي<\/h4><p>تصدر الجهة الوطنية المختصة قراراً بطلب المساعدة، ولا يُقدَّم الطلب عادةً من جهة منفردة، بل من خلال السلطة المخولة قانونياً.<\/p><h4>3 - إرسال الطلب عبر القنوات الرسمية<\/h4><p>يمكن توجيه الطلب من خلال:<\/p><ul><li>القنوات الدبلوماسية بين الدول.<\/li><li>المنظمات الإقليمية.<\/li><li>الأمم المتحدة ووكالاتها المتخصصة.<\/li><li>المؤسسات والمنظمات الإنسانية الدولية.<\/li><\/ul><div class=\"note\"><p><b>القاعدة الأساسية:<\/b> المساعدة الدولية تدعم جهود الدولة المتضررة ولا تحل محلها، وتُقدَّم بموافقتها وتحت تنسيقها.<\/p><\/div><h4>5 - تحليل نماذج عمليات إدارة الأزمات<\/h4><table><thead><tr><th>النموذج<\/th><th>أهم ميزة<\/th><th>أسلوب القيادة<\/th><th>أبرز تحدٍ<\/th><\/tr><\/thead><tbody><tr><td>المركزي<\/td><td>توحيد القرار<\/td><td>القرارات من جهة وطنية واحدة<\/td><td>بطء الاستجابة المحلية<\/td><\/tr><tr><td>اللامركزي<\/td><td>سرعة الاستجابة<\/td><td>صلاحيات للجهات المحلية<\/td><td>اختلاف القرارات<\/td><\/tr><tr><td>الجهة القائدة<\/td><td>الخبرة الفنية<\/td><td>قيادة المؤسسة المختصة<\/td><td>محدودية النظرة الشاملة<\/td><\/tr><tr><td>القيادة الموحدة<\/td><td>تكامل القدرات<\/td><td>قيادة مشتركة بين الجهات<\/td><td>تعقيد التنسيق<\/td><\/tr><tr><td>التصاعدي<\/td><td>تناسب الاستجابة مع الأزمة<\/td><td>الانتقال من المحلي إلى الوطني<\/td><td>احتمال تأخر التصعيد<\/td><\/tr><tr><td>الهجين<\/td><td>التوازن بين السيطرة والمرونة<\/td><td>قيادة مركزية وتنفيذ مرن محلياً<\/td><td>تداخل الصلاحيات<\/td><\/tr><\/tbody><\/table>"}],"research":[]};
var KEY = 'wahdan_results_v1';
var state = { tab: 'home' };

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}
function saveResult(r){try{var list=JSON.parse(localStorage.getItem(KEY)||'[]');list.unshift(r);localStorage.setItem(KEY,JSON.stringify(list.slice(0,200)));}catch(e){}}
function loadResults(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
function nowStr(){return new Date().toLocaleString('ar-EG');}

function go(t){state.tab=t;render();window.scrollTo(0,0);}
function render(){
  var nav=[['home','الرئيسية'],['explain','الشرح'],['review','المراجعة والامتحان لكل وحدة'],['exams','الامتحانات المتوقعة'],['results','نتائجي']];
  document.getElementById('nav').innerHTML=nav.map(function(n){return '<button class="'+(state.tab===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')">'+n[1]+'</button>';}).join('');
  var m=document.getElementById('main');
  var f={home:homePage,explain:explainPage,review:reviewPage,exams:examsPage,research:researchPage,results:resultsPage}[state.tab];
  m.innerHTML=f();
  if(state.after){state.after();state.after=null;}
}

function homePage(){
  var nTf=D.bank.reduce(function(s,u){return s+u.tf.length;},0)+D.exams.reduce(function(s,e){return s+e.tf.length;},0);
  var nMcq=D.bank.reduce(function(s,u){return s+u.mcq.length;},0)+D.exams.reduce(function(s,e){return s+e.mcq.length;},0);
  return '<h2>برنامج الأجهزة المعنية في الدولة</h2>'+
  '<p>شرح الوحدات السبع، وامتحانات لكل وحدة تُولَّد عشوائياً من البنك، وتصحيح تلقائي مع بيان الإجابة الصحيحة، والامتحانات الخمسة المتوقعة.</p>'+
  '<div class="grid">'+
  '<div class="card"><b>7</b><br>وحدات مشروحة</div>'+
  '<div class="card"><b>'+nTf+'</b><br>عبارة صح/خطأ</div>'+
  '<div class="card"><b>'+nMcq+'</b><br>سؤال اختيار من متعدد</div>'+
  '<div class="card"><b>5</b><br>امتحانات متوقعة</div></div>'+
  '<div class="note"><b>ملاحظة:</b> البنك مبني على المادة المرفقة فقط. الأسئلة المقالية تعرض نموذج الإجابة بعد التسليم، ولا تُصحَّح آلياً.</div>';
}

function explainPage(){
  return '<h2>الشرح</h2>'+D.explain.map(function(u){
    return '<details><summary>الوحدة '+u.unit+': '+esc(u.title)+'</summary>'+u.html+'</details>';
  }).join('');
}

function unitPool(n){
  var b=D.bank.find(function(u){return u.unit===n;});
  var tf=[],mcq=[],def=[],th=[];
  if(b){tf=tf.concat(b.tf);mcq=mcq.concat(b.mcq);def=def.concat(b.def);th=th.concat(b.theory);}
  D.exams.forEach(function(e){
    tf=tf.concat(e.tf.filter(function(x){return x.u===n;}));
    mcq=mcq.concat(e.mcq.filter(function(x){return x.u===n;}));
    def=def.concat(e.def.filter(function(x){return x.u===n;}));
    th=th.concat(e.research.filter(function(x){return x.u===n;}),e.choose.filter(function(x){return x.u===n;}));
  });
  return {tf:tf,mcq:mcq,def:def,theory:th};
}

function reviewPage(){
  return '<h2>المراجعة والامتحان لكل وحدة</h2>'+
  '<p class="muted">يُولَّد الامتحان عشوائياً من بنك الوحدة (حتى 10 عبارات صح/خطأ و10 أسئلة اختيار، مع سؤال مقالي). تُصحَّح الأسئلة الموضوعية تلقائياً.</p>'+
  '<div class="grid">'+D.explain.map(function(u){
    var p=unitPool(u.unit);
    return '<div class="card"><b>الوحدة '+u.unit+'</b><br><span class="muted">'+esc(u.title)+'</span><br>'+
      '<span class="muted">بنك: '+p.tf.length+' صح/خطأ، '+p.mcq.length+' اختيار</span><br>'+
      '<button class="btn" style="margin-top:8px" onclick="startUnit('+u.unit+')">ابدأ الامتحان</button></div>';
  }).join('')+'</div><div id="quiz"></div>';
}

function startUnit(n){
  var p=unitPool(n);
  var title='امتحان الوحدة '+n;
  var tf=pick(p.tf,Math.min(10,p.tf.length));
  var mcq=pick(p.mcq,Math.min(10,p.mcq.length)).map(function(q){
    var idx=q.o.map(function(_,i){return i;});
    var order=shuffle(idx);
    return {q:q.q,o:order.map(function(i){return q.o[i];}),c:order.indexOf(q.c),e:q.e,u:q.u};
  });
  var essays=pick(p.def,1).concat(pick(p.theory,1));
  buildQuiz(title,{tf:tf,mcq:mcq,essays:essays});
}

function startExam(i){
  var e=D.exams[i];
  var essays=[].concat(e.def.map(function(x){return{q:x.q,model:x.model,label:'تعريف/تطبيق'};}),
    e.research.map(function(x){return{q:x.q,model:x.model,label:'بحث'};}),
    e.choose.map(function(x){return{q:x.q,model:x.model,label:'اختر سؤالاً واحداً'};}));
  var mcq=e.mcq.map(function(q){
    var order=shuffle(q.o.map(function(_,k){return k;}));
    return {q:q.q,o:order.map(function(k){return q.o[k];}),c:order.indexOf(q.c),e:q.e};
  });
  buildQuiz('الامتحان المتوقع '+(i+1)+': '+e.title,{tf:e.tf,mcq:mcq,essays:essays});
}

function examsPage(){
  return '<h2>الامتحانات الخمسة المتوقعة</h2><p class="muted">بصيغة الامتحان الموحدة. الأسئلة الموضوعية تُصحَّح تلقائياً، والمقالية تعرض نموذج الإجابة.</p>'+
  '<div class="grid">'+D.exams.map(function(e,i){
    return '<div class="card"><b>الامتحان '+e.exam+'</b><br><span class="muted">'+esc(e.title)+'</span><br><button class="btn" style="margin-top:8px" onclick="startExam('+i+')">ابدأ</button></div>';
  }).join('')+'</div><div id="quiz"></div>';
}

var CUR=null;
function buildQuiz(title,Q){
  CUR={title:title,Q:Q,submitted:false};
  var h='<div class="card" id="qbox"><h2>'+esc(title)+'</h2>';
  h+='<h3>أولاً: اختر صح أم خطأ، وصحّح الخطأ</h3>';
  if(!Q.tf.length) h+='<p class="muted">لا توجد عبارات صح/خطأ لهذه الوحدة في البنك.</p>';
  Q.tf.forEach(function(x,n){
    h+='<div class="q" data-k="tf" data-n="'+n+'"><p>'+(n+1)+'. '+esc(x.s)+'</p>'+
      '<label class="opt"><input type="radio" name="tf'+n+'" value="1">صحيحة</label>'+
      '<label class="opt"><input type="radio" name="tf'+n+'" value="0">خاطئة</label></div>';
  });
  h+='<h3>ثانياً: اختر الإجابة الصحيحة</h3>';
  if(!Q.mcq.length) h+='<p class="muted">لا توجد أسئلة اختيار لهذه الوحدة في البنك.</p>';
  Q.mcq.forEach(function(x,n){
    h+='<div class="q" data-k="mcq" data-n="'+n+'"><p>'+(n+1)+'. '+esc(x.q)+'</p>'+
      x.o.map(function(o,k){return '<label class="opt"><input type="radio" name="mc'+n+'" value="'+k+'">'+'أبجد'.charAt(k)+'. '+esc(o)+'</label>';}).join('')+'</div>';
  });
  if(Q.essays.length){
    h+='<h3>ثالثاً: المقالية (تُراجع بنموذج الإجابة)</h3>';
    Q.essays.forEach(function(x,n){
      h+='<div class="q"><p>'+esc(x.label?'['+x.label+'] ':'')+esc(x.q)+'</p><textarea id="es'+n+'" placeholder="اكتب إجابتك هنا..."></textarea></div>';
    });
  }
  h+='<div class="toolbar no-print"><button class="btn" onclick="submitQuiz()">تصحيح الإجابات</button><button class="btn alt" onclick="window.print()">طباعة</button></div>';
  h+='<div id="score"></div></div>';
  var box=document.getElementById('quiz');
  if(!box){document.getElementById('main').insertAdjacentHTML('beforeend','<div id="quiz"></div>');box=document.getElementById('quiz');}
  box.innerHTML=h;
  box.scrollIntoView({behavior:'smooth'});
}

function submitQuiz(){
  if(!CUR||CUR.submitted) return;
  CUR.submitted=true;
  var Q=CUR.Q, tfOk=0, mcOk=0;
  Q.tf.forEach(function(x,n){
    var el=document.querySelector('[data-k="tf"][data-n="'+n+'"]');
    var sel=document.querySelector('input[name="tf'+n+'"]:checked');
    var want=x.a?'1':'0';
    var right=sel&&sel.value===want;
    if(right) tfOk++;
    el.classList.add(right?'ok':'bad');
    var ex=x.a?'الإجابة: صحيحة.':'الإجابة: خاطئة. التصويب: '+esc(x.fix);
    el.insertAdjacentHTML('beforeend','<div class="exp">'+(sel?(right?'إجابتك صحيحة. ':'إجابتك غير صحيحة. '):'لم تجب. ')+ex+'</div>');
  });
  Q.mcq.forEach(function(x,n){
    var el=document.querySelector('[data-k="mcq"][data-n="'+n+'"]');
    var sel=document.querySelector('input[name="mc'+n+'"]:checked');
    var right=sel&&Number(sel.value)===x.c;
    if(right) mcOk++;
    el.classList.add(right?'ok':'bad');
    el.querySelectorAll('label').forEach(function(l,k){ if(k===x.c) l.style.fontWeight='700'; });
    el.insertAdjacentHTML('beforeend','<div class="exp">'+(sel?(right?'إجابتك صحيحة. ':'إجابتك غير صحيحة. '):'لم تجب. ')+'الإجابة الصحيحة: '+esc(x.o[x.c])+(x.e?'. '+esc(x.e):'')+'</div>');
  });
  var essayHtml='';
  Q.essays.forEach(function(x,n){
    essayHtml+='<details><summary>نموذج الإجابة: '+esc(x.q)+'</summary><p>'+esc(x.model)+'</p></details>';
  });
  var tot=Q.tf.length+Q.mcq.length, ok=tfOk+mcOk;
  var score=tot?Math.round(ok/tot*20):0;
  var pct=tot?Math.round(ok/tot*100):0;
  var box=document.getElementById('score');
  box.innerHTML='<div class="res '+(pct<60?'low':'')+'"><b>النتيجة الموضوعية: '+ok+' من '+tot+' ('+pct+'%)</b><br>'+
    'صح/خطأ: '+tfOk+' من '+Q.tf.length+'، اختيار: '+mcOk+' من '+Q.mcq.length+'.<br>'+
    '<span class="muted">الدرجة من 20: '+score+'</span></div>'+essayHtml;
  saveResult({title:CUR.title,date:nowStr(),ok:ok,total:tot,pct:pct,score20:score});
  box.scrollIntoView({behavior:'smooth'});
}

function researchPage(){
  return '<h2>الأبحاث الثلاثة</h2><div class="toolbar no-print"><button class="btn alt" onclick="window.print()">طباعة الأبحاث</button></div>'+
  D.research.map(function(r){return '<details open><summary>'+esc(r.title)+'</summary>'+r.html+'</details>';}).join('');
}

function resultsPage(){
  var list=loadResults();
  if(!list.length) return '<h2>نتائجي</h2><p class="muted">لا توجد نتائج محفوظة بعد. تُحفظ النتائج في هذا المتصفح بعد كل تصحيح.</p>';
  return '<h2>نتائجي</h2><table><thead><tr><th>الامتحان</th><th>التاريخ</th><th>الصحيح</th><th>النسبة</th><th>من 20</th></tr></thead><tbody>'+
  list.map(function(r){return '<tr><td>'+esc(r.title)+'</td><td>'+esc(r.date)+'</td><td>'+r.ok+' / '+r.total+'</td><td>'+r.pct+'%</td><td>'+r.score20+'</td></tr>';}).join('')+
  '</tbody></table><button class="btn alt no-print" onclick="clearResults()">مسح النتائج</button>';
}
function clearResults(){try{localStorage.removeItem(KEY);}catch(e){}render();}

window.go=go; window.startUnit=startUnit; window.startExam=startExam; window.submitQuiz=submitQuiz; window.clearResults=clearResults;
render();
</script>
</body></html>
